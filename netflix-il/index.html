<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מה בנטפליקס?">
<meta name="description" content="מה שווה לראות עכשיו בנטפליקס ישראל, לפי ציוני IMDb">
<title>מה בנטפליקס?</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon-64.png?v=3" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div class="bwrap"><img class="banner" src="img/banner-780.webp" srcset="img/banner-780.webp 780w, img/banner.webp 1200w" sizes="(min-width:700px) 680px, 100vw" width="1200" height="400" alt="מה יש חדש בנטפליקס?"><a id="egg" class="egg" href="https://www.youtube.com/watch?v=lU0xlaWd_-U&amp;t=17s" target="_blank" rel="noopener" aria-label="🎵"></a><button id="infoBtn" class="info" type="button" aria-label="אודות">i</button></div>
<header class="top">
  <h1 class="sr">מה בנטפליקס?</h1>
  <div class="hrow">
    <div id="meta" class="meta">טוען…</div>
    <button id="qBtn" class="ib" type="button" aria-label="חיפוש" aria-expanded="false">🔍</button>
    <button id="setBtn" class="ib" type="button" aria-label="הגדרות">⚙️<span id="tasteB" class="tb" hidden></span></button>
  </div>
  <div id="srchW" class="srchw"><div class="srchi"><div class="srch"><span class="mg">🔍</span><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="חיפוש סרט או סדרה" aria-label="חיפוש"><button id="qX" type="button" aria-label="ניקוי" hidden>✕</button></div></div></div>
  <div id="tasteNote" class="tnote" hidden></div>
  <div class="seg tabs" role="tablist">
    <button type="button" data-tab="find" class="on">🔎 מה לראות</button>
    <button type="button" data-tab="wl">🔖 הרשימה שלי <span id="wlN" class="cnt">0</span></button>
    <button type="button" data-tab="seen">🏆 ראיתי <span id="seenN" class="cnt">0</span></button>
  </div>
</header>

<main>
  <section id="filters">
    <div class="seg" id="fType">
      <button type="button" data-v="s">📺 סדרות</button>
      <button type="button" data-v="m">🎬 סרטים</button>
    </div>
    <div class="chips" id="fGen"></div>
    <div class="ilrow">
      <div class="seg" id="fIl">
        <button type="button" data-v="all">הכול</button>
        <button type="button" data-v="only">🇮🇱 ישראלי</button>
        <button type="button" data-v="no">בלי ישראלי</button>
      </div>
      <button type="button" id="fNf" class="tgl" role="switch" aria-checked="false"><span class="sw"></span><span class="tl">שפות זרות</span></button>
    </div>
    <div class="ratew"><div class="rates" id="fRate"></div><span class="imdbl" aria-hidden="true">IMDb</span></div>
  </section>

  <div id="ach" class="ach" hidden></div>
  <div class="seg sub" id="fSub" hidden>
    <button type="button" data-v="all">הכול <span class="cnt"></span></button>
    <button type="button" data-v="s">📺 סדרות <span class="cnt"></span></button>
    <button type="button" data-v="m">🎬 סרטים <span class="cnt"></span></button>
  </div>
  <div class="resbar">
    <div id="resN" class="resn"></div>
    <div class="seg mini" id="fSort">
      <button type="button" data-v="r">ציון <i>↓</i></button>
      <button type="button" data-v="new">חדש <i>↓</i></button>
      <button type="button" data-v="pop">פופולרי <i>↓</i></button>
      <button type="button" data-v="me" class="mebtn" aria-label="בשבילי">🎯<i>↓</i></button>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="more" class="more"></div>
  <footer class="about"><button id="aboutBtn" type="button"><b>מה בנטפליקס?</b> · ⓘ אודות</button>
    <details class="fcred" dir="ltr"><summary>Credits</summary>
      <div>Idea &amp; Design by Oren Itzhaki</div><div>Coding by Claude Code</div>
      <div class="fsrc">Data: JustWatch via TMDB · IMDb · Wikidata · Netflix Top 10. Updated daily.</div>
    </details></footer>
</main>
<button id="toTop" class="totop" type="button" aria-label="לראש הדף">↑</button>

<div id="ov" class="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="shead"><b id="ovT"></b><button id="ovX" class="ib" type="button" aria-label="סגירה">✕</button></div>
    <div id="ovB" class="sbody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="tastes.js?v=3"></script>
<script src="app.js?v=21"></script>
</body>
</html>
