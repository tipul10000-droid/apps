<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="gU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5f8"/><stop offset=".5" stop-color="#9aa6b2"/><stop offset="1" stop-color="#d9e0e7"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".5" stop-color="#c9a23a"/><stop offset="1" stop-color="#f3d57a"/></linearGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#e2501c"/><stop offset="1" stop-color="#f59a3b"/></linearGradient>
    <path id="sym" d="M0,-34 L10,-12 L34,-10 L16,6 L22,32 L0,18 L-22,32 L-16,6 L-34,-10 L-10,-12 Z"/>
  </defs>
  <rect width="960" height="860" rx="24" fill="#ffffff"/>
  <text direction="rtl" unicode-bidi="embed" x="480" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1d1d2b">איך מזהים נדירות של קלף Magic</text>
  <text direction="rtl" unicode-bidi="embed" x="480" y="86" text-anchor="middle" font-size="18" fill="#555">שתי דרכים: צבע סמל הסט (בקצה הימני של שורת הסוג) והאות בפינה השמאלית התחתונה</text>

  <!-- four rarity columns -->
  <g transform="translate(840,190)">
    <circle r="62" fill="#f1f1f4"/><use href="#sym" fill="url(#gC)" stroke="#000" stroke-width="2" transform="scale(1.4)"/>
    <text direction="rtl" unicode-bidi="embed" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d2b">שחור</text>
    <text direction="rtl" unicode-bidi="embed" y="128" text-anchor="middle" font-size="18" fill="#555">Common · נפוץ</text>
    <text direction="rtl" unicode-bidi="embed" y="156" text-anchor="middle" font-size="16" fill="#888">שווה אגורות</text>
  </g>
  <g transform="translate(600,190)">
    <circle r="62" fill="#f1f1f4"/><use href="#sym" fill="url(#gU)" stroke="#000" stroke-width="2" transform="scale(1.4)"/>
    <text direction="rtl" unicode-bidi="embed" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d2b">כסוף</text>
    <text direction="rtl" unicode-bidi="embed" y="128" text-anchor="middle" font-size="18" fill="#555">Uncommon · לא נפוץ</text>
    <text direction="rtl" unicode-bidi="embed" y="156" text-anchor="middle" font-size="16" fill="#888">כמעט תמיד אגורות</text>
  </g>
  <g transform="translate(360,190)">
    <circle r="62" fill="#fff6d6" stroke="#c9a23a" stroke-width="4"/><use href="#sym" fill="url(#gR)" stroke="#000" stroke-width="2" transform="scale(1.4)"/>
    <text direction="rtl" unicode-bidi="embed" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#8a6a00">זהב</text>
    <text direction="rtl" unicode-bidi="embed" y="128" text-anchor="middle" font-size="18" fill="#555">Rare · נדיר</text>
    <text direction="rtl" unicode-bidi="embed" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6a00">לשלוף ולסרוק ✓</text>
  </g>
  <g transform="translate(120,190)">
    <circle r="62" fill="#ffe6d9" stroke="#e2501c" stroke-width="4"/><use href="#sym" fill="url(#gM)" stroke="#000" stroke-width="2" transform="scale(1.4)"/>
    <text direction="rtl" unicode-bidi="embed" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#b8380c">כתום-אדום</text>
    <text direction="rtl" unicode-bidi="embed" y="128" text-anchor="middle" font-size="18" fill="#555">Mythic · מיתי</text>
    <text direction="rtl" unicode-bidi="embed" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#b8380c">לשלוף ולסרוק ✓</text>
  </g>
  <text direction="rtl" unicode-bidi="embed" x="480" y="378" text-anchor="middle" font-size="15" fill="#888">הצורה של הסמל משתנה מסט לסט, והכוכב כאן רק לדוגמה. מה שקובע הוא הצבע</text>

  <!-- mock card -->
  <g transform="translate(60,410)">
    <rect width="380" height="420" rx="18" fill="#161616"/>
    <rect x="16" y="16" width="348" height="36" rx="8" fill="#e9e3d2"/>
    <text x="28" y="41" font-size="18" font-weight="700" fill="#222" direction="ltr">Card Name</text>
    <rect x="16" y="58" width="348" height="160" rx="4" fill="#5b6d8a"/>
    <rect x="16" y="224" width="348" height="34" rx="8" fill="#e9e3d2"/>
    <text x="28" y="247" font-size="16" font-weight="700" fill="#222" direction="ltr">Creature — Type</text>
    <use href="#sym" fill="url(#gM)" stroke="#000" stroke-width="2" transform="translate(340,241) scale(.42)"/>
    <circle cx="340" cy="241" r="24" fill="none" stroke="#e2501c" stroke-width="4"/>
    <rect x="16" y="264" width="348" height="112" rx="4" fill="#f4efe2"/>
    <text x="22" y="397" font-size="15" fill="#ddd" direction="ltr">016/264 <tspan fill="#ff7a3d" font-weight="700" font-size="19">M</tspan></text>
    <text x="22" y="413" font-size="12" fill="#aaa" direction="ltr">WAR • EN</text>
    <rect x="12" y="378" width="104" height="40" rx="8" fill="none" stroke="#e2501c" stroke-width="4"/>
  </g>
  <!-- arrows + explanation -->
  <g font-size="20" fill="#1d1d2b">
    <line x1="430" y1="651" x2="470" y2="600" stroke="#e2501c" stroke-width="4"/>
    <text direction="rtl" unicode-bidi="embed" x="905" y="530" text-anchor="start" font-weight="700">① סמל הסט</text>
    <text direction="rtl" unicode-bidi="embed" x="905" y="560" text-anchor="start" font-size="18" fill="#444">בקצה הימני של שורת הסוג (סוג הקלף)</text>
    <text direction="rtl" unicode-bidi="embed" x="905" y="586" text-anchor="start" font-size="18" fill="#444">זהב = נדיר, כתום-אדום = מיתי</text>
    <line x1="180" y1="808" x2="530" y2="770" stroke="#e2501c" stroke-width="4"/>
    <text direction="rtl" unicode-bidi="embed" x="905" y="690" text-anchor="start" font-weight="700">② האות בפינה השמאלית התחתונה</text>
    <text direction="rtl" unicode-bidi="embed" x="905" y="720" text-anchor="start" font-size="18" fill="#444">הכי בטוח, מופיע בכל הקלפים מ-2015 ואילך</text>
    <rect x="807" y="738" width="76" height="62" rx="10" fill="#eee"/><text direction="rtl" unicode-bidi="embed" x="845" y="768" text-anchor="middle" font-size="26" font-weight="700" fill="#333">C</text><text direction="rtl" unicode-bidi="embed" x="845" y="791" text-anchor="middle" font-size="15" fill="#333">נפוץ</text>
    <rect x="717" y="738" width="76" height="62" rx="10" fill="#e6eaee"/><text direction="rtl" unicode-bidi="embed" x="755" y="768" text-anchor="middle" font-size="26" font-weight="700" fill="#5b6670">U</text><text direction="rtl" unicode-bidi="embed" x="755" y="791" text-anchor="middle" font-size="15" fill="#5b6670">לא נפוץ</text>
    <rect x="627" y="738" width="76" height="62" rx="10" fill="#fff3c4"/><text direction="rtl" unicode-bidi="embed" x="665" y="768" text-anchor="middle" font-size="26" font-weight="700" fill="#8a6a00">R</text><text direction="rtl" unicode-bidi="embed" x="665" y="791" text-anchor="middle" font-size="15" fill="#8a6a00">נדיר</text>
    <rect x="537" y="738" width="76" height="62" rx="10" fill="#ffe2d4"/><text direction="rtl" unicode-bidi="embed" x="575" y="768" text-anchor="middle" font-size="26" font-weight="700" fill="#b8380c">M</text><text direction="rtl" unicode-bidi="embed" x="575" y="791" text-anchor="middle" font-size="15" fill="#b8380c">מיתי</text>
    <text x="905" y="830" direction="rtl" unicode-bidi="embed" text-anchor="start" font-size="17" fill="#444">אדמות (L) וטוקנים (T) לא שווים כלום</text>
  </g>
</svg>
