<style>
/* Layout: colored hero band with quick-add, a strip of solid project tiles, then ONE grouped quest list of compact rows. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE6; --ink:#18221E; --muted:#5E6B64; --line:#D6DDD7;
  --hero:#16433C; --hero-ink:#F3F7F4; --hero-muted:#A9C7BE; --accent:#F2A93B;
  --k-research:#2C6BB5; --k-followup:#D08419; --k-admin:#2E8B57; --k-reminder:#C8414B; --k-idea:#7A52B3; --k-project:#245E73;
  --p4a:#16433C; --p4b:#245E73; --p4c:#8C3B2E; --p4d:#5B4A8A; --p3:#B66A12;
  --due:#C8414B; --due-soft:#FBE3E4; --soon:#B86A10; --soon-soft:#FBEBD3; --ok-soft:#E1F1E7;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --ink:#E5ECE8; --muted:#97A69E; --line:#2B3732;
  --hero:#123631; --hero-ink:#EEF5F1; --hero-muted:#8FB5AA; --accent:#F4B451;
  --k-research:#6FA6E8; --k-followup:#EBA74A; --k-admin:#62C08A; --k-reminder:#EE7A82; --k-idea:#B293E6; --k-project:#7DC0D6;
  --due:#EE7A82; --due-soft:#3B1E21; --soon:#EBA74A; --soon-soft:#3A2A14; --ok-soft:#183126; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --ink:#E5ECE8; --muted:#97A69E; --line:#2B3732;
  --hero:#123631; --hero-ink:#EEF5F1; --hero-muted:#8FB5AA; --accent:#F4B451;
  --k-research:#6FA6E8; --k-followup:#EBA74A; --k-admin:#62C08A; --k-reminder:#EE7A82; --k-idea:#B293E6; --k-project:#7DC0D6;
  --due:#EE7A82; --due-soft:#3B1E21; --soon:#EBA74A; --soon-soft:#3A2A14; --ok-soft:#183126; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding-block:22px 26px;position:relative;overflow:hidden}
.hero{padding-block:14px 18px}
.hero .inner{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.top{display:flex;justify-content:flex-start;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;direction:ltr;text-align:right}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--hero-muted);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.refr{margin-inline-start:auto;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-ink);font-size:13.5px;min-height:32px}
.refr .ic{display:inline-block;font-size:16px;line-height:1}
.refr.spin .ic{animation:sqspin .8s linear infinite}
@keyframes sqspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refr.spin .ic{animation:none}}
.stat{display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;color:var(--hero-muted)}
.stat b{font-family:var(--f-mono);font-size:16px;color:var(--hero-ink)}
.stat.hot{background:var(--accent);color:#3A2400}.stat.hot b{color:#3A2400}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;background:rgba(255,255,255,.95);border:0;color:#18221E;padding:10px 14px;border-radius:10px}
.quick button{background:var(--accent);color:#3A2400;font-weight:700;padding:0 16px;border-radius:10px}
.quick button:disabled{opacity:.5}

main{padding-block:22px 64px}
main .inner{display:flex;flex-direction:column;gap:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:18px;font-weight:700}
.hint{color:var(--muted);font-size:14px}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pc-top{display:flex;gap:12px;align-items:center;min-width:0}
.pic{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-family:var(--f-display);font-weight:800;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pc h3{font-size:16.5px;font-weight:700}
.pc .stage{font-size:13.5px;color:var(--muted);line-height:1.35}
.pc .stage b{color:var(--ink);font-weight:600}
.pc-acts{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.pbtn.app{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.pbtn.missing{border-style:dashed;color:var(--muted);background:transparent;font-weight:600}
.pbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pc-more{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pc-more a{color:var(--muted)}
.pc-add{display:flex;gap:6px}.pc-add input{flex:1;min-width:0;font-size:14px}
.ptag{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap;flex:none;background:var(--sunk);color:var(--ink);display:inline-flex;gap:4px;align-items:center}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* views + share */
.views{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin-bottom:10px;width:fit-content;max-width:100%}
.vtab{padding:6px 14px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--muted)}
.vtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vtab .n{font-family:var(--f-mono);font-weight:500;font-size:12.5px;margin-inline-start:4px}
.share{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.share textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:96px;resize:vertical;width:100%}
.pill.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E;text-decoration:none;font-weight:700}
.pill.go{background:transparent;color:var(--k-admin);border:1.5px solid var(--k-admin);font-weight:700}
.pill.go:hover{background:var(--ok-soft)}
.row.closed .r-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}

/* grouped list */
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.g-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:2px 4px}
.g-head .n{font-family:var(--f-mono);font-weight:500}
.g-head.hot{color:var(--due)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:5px 1fr auto;align-items:stretch;overflow:hidden}
.row .bar{background:var(--k)}
.r-body{min-width:0;padding:9px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.r-line{display:flex;align-items:center;gap:8px;min-width:0}
.r-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-next{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap;flex:none}
.tag.me{background:var(--soon-soft);color:var(--soon)}
.tag.other{background:var(--sunk);color:var(--muted)}
.tag.kind{color:var(--k);background:transparent;border:1px solid currentColor}
.date{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.date.due{color:var(--due);font-weight:700}.date.soon{color:var(--soon)}
.r-side{display:flex;align-items:center;gap:2px;padding:4px 6px}
.ib{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;flex:none}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.chat{color:var(--k-research)}.ib.page{color:var(--k-followup)}
.ib.done{color:var(--k-admin);border:1.5px solid var(--k-admin);width:32px;height:32px;margin-inline:2px}
.ib.done:hover{background:var(--ok-soft)}
.ib.off{opacity:.3}
.drawer{grid-column:1/-1;border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;background:var(--bg)}
.drawer p{margin:0;max-width:70ch;color:var(--ink)}
.d-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.d-row .lbl{font-size:12.5px;color:var(--muted);font-weight:700;min-width:58px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.danger{color:var(--due);border-color:var(--due)}
.lnk{font-size:13.5px;padding:3px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.lnk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.d-row input{flex:1;min-width:140px}
.d-row input[type=date]{flex:none;min-width:0}
.src{font-size:12.5px;color:var(--muted)}
details.arch summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;padding:4px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.notice{background:var(--soon-soft);color:var(--soon);border-radius:10px;padding:10px 14px;font-size:14.5px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}
/* AI assist: status lines, decisions inbox, offers and multiple-choice questions */
.r-wait{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-wait b{color:var(--ink);font-weight:600}
.tag.ask{background:var(--accent);color:#3A2400}
.tag.cl{background:var(--sunk);color:var(--k-research)}
.st{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.st .lbl{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.st div{min-width:0}
.ai{border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ai .ai-h{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.ai .ai-q{font-weight:700;font-size:15px}
.ai .ai-d{font-size:14px;color:var(--muted)}
.ai .opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;font-size:14.5px;font-weight:600}
.opt:hover{border-color:var(--ink)}
.opt.yes{background:var(--k-admin);color:#fff;border-color:var(--k-admin)}
.opt.chat{border-style:dashed;color:var(--muted);font-weight:600;text-decoration:none;display:block}
.ai.answered{border-inline-start-color:var(--k-admin)}
.ai .ans{font-size:14px}.ai .ans b{color:var(--k-admin)}
.inbox{display:flex;flex-direction:column;gap:8px}
.inbox .ai-t{font-size:12.5px;font-weight:700;color:var(--k-research);cursor:pointer}
.files .lnk.file{border-style:dashed}
@media (max-width:620px){.r-wait{white-space:normal}}
/* simple mode */
.opt.later{background:transparent;color:var(--muted)}
.later-menu{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:10px;background:var(--sunk)}
.later-menu .opt{background:var(--surface)}
.g-head.back{color:var(--k-research)}
.tag.zz{background:var(--sunk);color:var(--muted)}
[hidden]{display:none!important}
.r-wait{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;white-space:normal!important}
.ai{padding:10px 12px;gap:6px;border-inline-start-width:3px}
.ai .opts{flex-direction:row;flex-wrap:wrap}
.opt{padding:6px 12px;border-radius:999px;font-size:14px}
.opt.chat{border:1px solid var(--k-research);color:var(--k-research);background:transparent;padding:5px 11px;text-decoration:none;font-weight:700}
.cont{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1px solid var(--k-research);color:var(--k-research);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;text-decoration:none;min-height:34px}
.cont svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.ai .ai-t{font-size:12.5px;color:var(--muted);font-weight:600}
.inbox .ai .ai-t{font-size:17px;font-weight:800;color:var(--ink);line-height:1.3}
.inbox .ai .ai-q{font-size:14px;font-weight:600;color:var(--muted)}
.ai .opt{font-size:13px;padding:5px 11px;min-height:32px}
.opt.pressed,.ib.pressed{background:var(--k-admin)!important;color:#fff!important;border-color:var(--k-admin)!important;transform:scale(.96);transition:transform .1s}
.busy{pointer-events:none}.busy .opt:not(.pressed){opacity:.45}
.toast.undo{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px}
.toast.undo button{border:0;border-radius:999px;background:var(--accent);color:#111;font-weight:800;font-size:14px;padding:6px 14px}
details.more{border-top:1px dashed var(--line);padding-top:6px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:700;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:8px}
details.more>div{display:flex;flex-direction:column;gap:10px}
.st{grid-template-columns:auto 1fr;font-size:14.5px}
@media (max-width:620px){.brand h1{font-size:34px}.r-line{flex-wrap:wrap;row-gap:2px}.r-title{white-space:normal;flex-basis:100%}.r-next{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ib{width:34px}}

/* Fun Quest: a separate, playful area for hobbies (music, movies…), opened from the button in the hero */
:root{--fz1:#FF7A59;--fz2:#E0458F;--fz3:#6C4CE0;--fz4:#1FA37A;--spot:#1DB954}
@keyframes sqwig{0%,70%,100%{transform:none}80%{transform:rotate(-16deg) scale(1.15)}90%{transform:rotate(12deg)}}
.funzone{display:none}
body.fun-on .funzone{display:flex;flex-direction:column;gap:18px}
body.fun-on .tasks-only{display:none!important}
/* synthwave arcade banner: night sky, striped sun, neon grid floor, equalizer */
.fz-head{position:relative;overflow:hidden;border-radius:18px;min-height:250px;padding:22px 20px 84px;color:#fff;isolation:isolate;
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 48% 26%,#fff,transparent),radial-gradient(1px 1px at 66% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 30%,#fff,transparent),radial-gradient(1px 1px at 92% 10%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),radial-gradient(1px 1px at 58% 40%,#fff,transparent),
  linear-gradient(180deg,#0B0322 0%,#2A0A4E 52%,#7A1460 72%,#0B0322 72.2%)}
.fz-sun{position:absolute;z-index:-1;left:14%;bottom:28%;width:150px;height:150px;border-radius:50%;
  background:linear-gradient(180deg,#FFE66D 0%,#FF9A3D 45%,#FF3D7F 80%);
  -webkit-mask:linear-gradient(180deg,#000 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88% 94%,#000 94%);
          mask:linear-gradient(180deg,#000 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88% 94%,#000 94%);
  filter:drop-shadow(0 0 24px rgba(255,61,127,.6))}
.fz-floor{position:absolute;z-index:-1;left:-30%;right:-30%;bottom:0;height:28%;transform-origin:50% 0;transform:perspective(160px) rotateX(55deg);
  background:repeating-linear-gradient(90deg,rgba(255,61,127,.85) 0 2px,transparent 2px 46px),repeating-linear-gradient(180deg,rgba(255,61,127,.85) 0 2px,transparent 2px 22px);
  animation:fzrun 1.4s linear infinite}
@keyframes fzrun{to{background-position:0 0,0 22px}}
.fz-title{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right}
.fz-press{font-family:"Press Start 2P",var(--f-mono);font-size:9px;letter-spacing:1px;color:#33E1FF;direction:ltr;animation:fzblink 1.2s steps(2,start) infinite;text-shadow:0 0 6px #33E1FF}
@keyframes fzblink{to{visibility:hidden}}
.fz-head h2{font-family:"Bungee",var(--f-display);font-weight:400;font-size:46px;line-height:.95;direction:ltr;letter-spacing:1px;
  background:linear-gradient(180deg,#FFF6B0 0%,#FFE66D 40%,#FF8A3D 62%,#FF3D7F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,61,127,.55)) drop-shadow(0 3px 0 #3B0B5E)}
.fz-head p{margin:4px 0 0;font-weight:700;font-size:14.5px;max-width:30ch;color:#E9D8FF;text-shadow:0 1px 4px #0B0322}

        h("summary",null,h("span",{class:"rt"},g.title||gid),h("span",{class:"rn"},`${its.length} שירים`+(ups?` · 👍${ups}`:"")+(downs?` · 👎${downs}`:""))),
        safeUrl(g.url||"")?h("a",{class:"fbtn ghost rlink",href:safeUrl(g.url),target:"_blank",rel:"noopener"},g.url_label||"פתח"):null,
        h("ul",{class:"fc-items"},its.map(x=>itemRow(t,x,all.indexOf(x)))));
      d.addEventListener("toggle",()=>{funFold[key]=d.open;});
      return d;
    }));
  }
  function fhCard(p){
    const app=safeUrl(p.app_url||""),cl=safeUrl(p.claude_url||"");
    return h("article",{class:"fcard fh"},
      h("a",{class:"fh-logo",href:app||cl||"#",target:"_blank",rel:"noopener","aria-label":"פתח את Frame Horizon"},h("img",{src:"fh-logo.png",alt:"Frame Horizon",width:"560",height:"178"})),
      h("p",{class:"fh-tag"},"ערבי סרטים שהופכים למסע"),
      h("div",{class:"fc-links"},app?h("a",{class:"fbtn",href:app,target:"_blank",rel:"noopener"},"פתח את האפליקציה"):null,cl?h("a",{class:"fbtn ghost",href:cl,target:"_blank",rel:"noopener"},"פתח ב-Claude"):null));
  }
  function renderFun(){
    const list=funTopics.filter(t=>t.status!=="archived"&&t.status!=="done").sort((a,b)=>(a.fun_order||99)-(b.fun_order||99));
    const cards=list.map(funCard);
    const fh=projById("frame-horizon");if(fh)cards.push(fhCard(fh));
    $("funGrid").replaceChildren(...(cards.length?cards:[h("div",{class:"empty"},"עוד אין כאן כלום. בקש מ-Claude בשיחה להוסיף תחביב ל-Fun Quest.")]));
  }
  window.addEventListener("hashchange",()=>{const q=questFromHash();if(q!==quest){quest=q;applyQuest();if(db)renderAll();}});
  applyQuest();
  function renderAll(){renderQnav();renderStats();renderInbox();renderViews();renderFilters();renderStrip();renderList();renderFun();}

  async function patch(t,fields,msg,noUndo){if(!db)return;if(!("snooze_until" in fields)&&returned(t))fields={...fields,snooze_until:""};
    const prev={};for(const k of [...Object.keys(fields),"updated_at"])prev[k]=k in t?JSON.parse(JSON.stringify(t[k])):null;
    try{await db.collection("topics").doc(t.id).update({...fields,updated_at:new Date().toISOString()});
      if(noUndo){if(msg)toast(msg);}else toast(msg||"נשמר",async()=>{try{await db.collection("topics").doc(t.id).update(prev);toast("בוטל");}catch(e){fail(e);}});
    }catch(e){fail(e);}}
  function snooze(t,n){const base=n===1?todayISO():(t.next_date&&daysUntil(t.next_date)>0?t.next_date:todayISO());patch(t,{next_date:addDays(base,n)},n===1?"עד מחר":n===7?"נדחה בשבוע":"נדחה בחודש");}
  async function del(t,btn){if(btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.textContent="ללחוץ שוב";return;}const snap=JSON.parse(JSON.stringify(t));delete snap.id;try{await db.collection("topics").doc(t.id).delete();openId=null;toast("נמחק",async()=>{try{await db.collection("topics").doc(t.id).set(snap);toast("שוחזר");}catch(e){fail(e);}});}catch(e){fail(e);}}
  function fail(e){if(e&&e.code==="invalid_argument"){canWrite=false;renderList();notice("הדף מוצג לקריאה בלבד.");}else{renderAll();toast("השמירה נכשלה, נסה שוב");}}
  function notice(t){const n=$("notice");n.textContent=t;n.hidden=false;}

  $("quick").addEventListener("submit",async e=>{
    e.preventDefault();const v=$("qtitle").value.trim();if(!v||!db)return;
    const now=new Date().toISOString();
    if(/^[\[{`]/.test(v)){ // a block pasted from a Claude chat
      let items;try{const j=JSON.parse(v.replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,""));items=[].concat(j.quest||j.bakane||j.topics||j);}catch(err){toast("לא הצלחתי לקרוא את הבלוק שהודבק");return;}
      let n=0;
      for(const x of items.filter(x=>x&&x.title)){
        const ex=x.id&&allTopics.find(t=>t.id===x.id&&!isFun(t));
        const links=(Array.isArray(x.links)?x.links:[]).filter(l=>l&&safeUrl(l.url)).map(l=>({label:String(l.label||"קישור"),url:l.url,type:l.type||linkType(l)}));
        const clean={title:String(x.title).slice(0,200),summary:String(x.summary||""),next_step:String(x.next_step||""),next_date:/^\d{4}-\d{2}-\d{2}$/.test(x.next_date||"")?x.next_date:"",kind:KINDS[x.kind]?x.kind:"research",status:STATUS[x.status]?x.status:"active",priority:x.priority==="high"?"high":"normal",area:String(x.area||""),source:String(x.source||"הודבק משיחה"),updated_at:now};
        try{
          if(ex)await db.collection("topics").doc(ex.id).update({...clean,links:[...linksOf(ex),...links.filter(l=>!linksOf(ex).some(o=>o.url===l.url))],log:[...(Array.isArray(ex.log)?ex.log:[]),{at:now,text:String(x.log_note||"עודכן משיחה")}]});
          else await db.collection("topics").doc(newId()).set({...clean,...((x.quest==="army"||x.quest==="work")?{quest:x.quest}:(quest==="army"||quest==="work")?{quest}:{}),links,created_at:now,log:x.log_note?[{at:now,text:String(x.log_note)}]:[]});
          n++;
        }catch(err){fail(err);break;}
      }
      if(n){$("qtitle").value="";toast(n===1?"נוסף מהשיחה":`נוספו ${n} נושאים`);}
      return;
    }
    try{const nid=newId();await db.collection("topics").doc(nid).set({title:v.slice(0,200),kind:"research",status:"active",priority:"normal",area:"",next_step:"",next_date:"",summary:"",links:[],source:"נוסף ידנית בדף",...(quest==="army"||quest==="work"?{quest}:quest==="fun"?{fun:true,kind:"fun"}:{}),created_at:now,updated_at:now,log:[]});$("qtitle").value="";showAdd(false);toast("נוסף",async()=>{try{await db.collection("topics").doc(nid).delete();toast("בוטל");}catch(e){fail(e);}});}catch(err){fail(err);}
  });
  setInterval(()=>{if(db&&!laterFor)renderAll();},60000);
  function renderRefr(){$("refrTxt").textContent=window.SQ_LAST_REFRESH?ago(window.SQ_LAST_REFRESH):"עדכון";}
  function showAdd(on){$("quick").hidden=!on;$("addBtn").setAttribute("aria-expanded",on?"true":"false");$("addBtn").textContent=on?"×":"+";if(on){$("quick").scrollIntoView({block:"nearest"});setTimeout(()=>$("qtitle").focus(),50);}}
  $("addBtn").onclick=()=>showAdd($("quick").hidden);
  $("qtitle").addEventListener("keydown",e=>{if(e.key==="Escape")showAdd(false);});
  window.addEventListener("sq-refreshed",renderRefr);setInterval(renderRefr,20000);
  // the iPhone home-screen app keeps the old page in memory and the CDN caches it ~10 min.
  // When the app comes back to the screen (or on refresh), fetch the page fresh and reload if a newer build is up.
  let lastVer=0;
  async function checkUpdate(force){
    if(!force&&Date.now()-lastVer<60000)return;lastVer=Date.now();
    try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;const m=(await r.text()).match(/SQ_BUILD="([^"]+)"/);
      if(m&&m[1]!==window.SQ_BUILD){location.replace(location.pathname+"?u="+Date.now()+location.hash);}}catch(e){}
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate();});
  window.addEventListener("pageshow",e=>{if(e.persisted)checkUpdate(true);});
  setTimeout(()=>checkUpdate(true),3000);
  $("ver").textContent=`גרסה ${window.SQ_BUILD} · ${window.SQ_BUILD_AT}`;
  $("ver").onclick=async()=>{$("ver").textContent="בודק גרסה חדשה…";await checkUpdate(true);setTimeout(()=>{$("ver").textContent=`גרסה ${window.SQ_BUILD} · ${window.SQ_BUILD_AT} (העדכנית)`;},600);};
  $("refr").onclick=async()=>{const b=$("refr");if(b.classList.contains("spin"))return;b.classList.add("spin");$("refrTxt").textContent="מעדכן הכול…";checkUpdate(true);
    try{if(db&&db.refresh)await db.refresh();laterFor=null;renderAll();toast("הכול עודכן");}catch(e){toast("העדכון נכשל, נסה שוב");}
    setTimeout(()=>b.classList.remove("spin"),300);renderRefr();};
  renderStats();
  (async()=>{
    db=await (window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null));
    if(!db){notice("חסר המפתח האישי. פתח את הלינק המלא עם המפתח (?k=...).");$("qbtn").disabled=true;$("list").replaceChildren();return;}
    try{const user=await window.claude.use("user");if(user&&typeof user.can==="function"&&(await user.can("data.write"))===false){canWrite=false;$("qbtn").disabled=true;}}catch(e){}
    db.collection("topics").onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));allTopics=all;splitTopics();renderAll();},()=>notice("הקשר לנתונים נותק. רענן את הדף."));
    // quest logos live in the private data (collection settings, doc quest_logos {army, work} as data:image URLs), never in this public repo
    db.collection("settings").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="quest_logos");const L=d?d.data():{};
      for(const q of ["army","work"]){const img=$("logo-"+q),u=String(L[q]||"");const ok=u.startsWith("data:image/")||!!safeUrl(u);img.hidden=!ok;if(ok&&img.src!==u)img.src=u;}},()=>{});
    db.collection("projects").onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));renderStrip();renderList();renderFun();},()=>{});
  })();
})();
</script>
