button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

.mapband::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(236,224,198,.55),rgba(236,224,198,0) 45%);pointer-events:none}
.mapband .inner{width:100%;position:relative;z-index:1}
.mapband .brand{max-width:min(46%,420px)}
.mapband .brand h1{color:#2B2417;text-shadow:0 1px 0 rgba(255,248,230,.6)}
.mapband .brand h1 i{color:#B2701A}
.mapband .brand p{color:#4A3F2C;font-weight:600}
@media (max-width:620px){.mapband{background-position:right center}.mapband .brand{max-width:58%}.mapband .brand p{font-size:13.5px;line-height:1.3}}
.hero .inner{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.top{display:flex;justify-content:flex-start;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;direction:ltr;text-align:right}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--hero-muted);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.refr{margin-inline-start:auto;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-ink);font-size:13.5px;min-height:32px}
.refr .ic{display:inline-block;font-size:16px;line-height:1}
.refr.spin .ic{animation:sqspin .8s linear infinite}
@keyframes sqspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refr.spin .ic{animation:none}}
.stat{display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;color:var(--hero-muted)}
.stat b{font-family:var(--f-mono);font-size:16px;color:var(--hero-ink)}
.stat.hot{background:var(--accent);color:#3A2400}.stat.hot b{color:#3A2400}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;background:rgba(255,255,255,.95);border:0;color:#18221E;padding:10px 14px;border-radius:10px}
.quick button{background:var(--accent);color:#3A2400;font-weight:700;padding:0 16px;border-radius:10px}
.quick button:disabled{opacity:.5}

main{padding-block:22px 64px}
main .inner{display:flex;flex-direction:column;gap:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:18px;font-weight:700}
.hint{color:var(--muted);font-size:14px}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pc-top{display:flex;gap:12px;align-items:center;min-width:0}
.pic{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-family:var(--f-display);font-weight:800;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pc h3{font-size:16.5px;font-weight:700}
.pc .stage{font-size:13.5px;color:var(--muted);line-height:1.35}
.pc .stage b{color:var(--ink);font-weight:600}
.pc-acts{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.pbtn.app{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.pbtn.missing{border-style:dashed;color:var(--muted);background:transparent;font-weight:600}
.pbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pc-more{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pc-more a{color:var(--muted)}
.pc-add{display:flex;gap:6px}.pc-add input{flex:1;min-width:0;font-size:14px}
.ptag{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap;flex:none;background:var(--sunk);color:var(--ink);display:inline-flex;gap:4px;align-items:center}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* views + share */
.views{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin-bottom:10px;width:fit-content;max-width:100%}
.vtab{padding:6px 14px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--muted)}
.vtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vtab .n{font-family:var(--f-mono);font-weight:500;font-size:12.5px;margin-inline-start:4px}
.share{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.share textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:96px;resize:vertical;width:100%}
.pill.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E;text-decoration:none;font-weight:700}
.pill.go{background:var(--k-admin);color:#fff;border-color:var(--k-admin);font-weight:700}
.row.closed .r-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}

/* grouped list */
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.g-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:2px 4px}
.g-head .n{font-family:var(--f-mono);font-weight:500}
.g-head.hot{color:var(--due)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:5px 1fr auto;align-items:stretch;overflow:hidden}
.row .bar{background:var(--k)}
.r-body{min-width:0;padding:9px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.r-line{display:flex;align-items:center;gap:8px;min-width:0}
.r-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-next{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap;flex:none}
.tag.me{background:var(--soon-soft);color:var(--soon)}
.tag.other{background:var(--sunk);color:var(--muted)}
.tag.kind{color:var(--k);background:transparent;border:1px solid currentColor}
.date{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.date.due{color:var(--due);font-weight:700}.date.soon{color:var(--soon)}
.r-side{display:flex;align-items:center;gap:2px;padding:4px 6px}
.ib{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;flex:none}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<script>
(function(){
  const KINDS={project:"מפרויקטים",followup:"מעקב",admin:"סידורים",reminder:"תזכורת",research:"בירור",idea:"רעיון"};
  const STATUS={active:"בתנועה",waiting_me:"מחכה לי",waiting_other:"מחכה לאחרים",paused:"בהקפאה",done:"בוצע",promoted:"עלה לפרויקט",archived:"בארכיון"};

  const P4=["--p4a","--p4b","--p4c","--p4d"];

  };
  let inboxAll=false, view="open", shareId=null, shareMode="task";
  let db=null, topics=[], projects=[], filterKind="all", openId=null, canWrite=true;
  const $=id=>document.getElementById(id);
  function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
  function toast(t,undo){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=h("div",{class:"toast"+(undo?" undo":""),role:"status"},h("span",null,t),undo?h("button",{type:"button",onclick:()=>{e.remove();undo();}},"בטל"):null);document.body.append(e);setTimeout(()=>e.remove(),undo?5000:2000);}
  // a tapped button stays lit ~300ms before the card changes, so the tap is visible

  function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}

  function ago(ms){if(!ms)return"";const m=Math.floor((Date.now()-ms)/60000);if(m<1)return"עכשיו";if(m<60)return m===1?"לפני דקה":`לפני ${m} דקות`;const hr=Math.floor(m/60);if(hr<24)return hr===1?"לפני שעה":hr===2?"לפני שעתיים":`לפני ${hr} שעות`;const d=Math.floor(hr/24);if(d===1)return"אתמול";if(d===2)return"לפני יומיים";if(d<30)return`לפני ${d} ימים`;const mo=Math.floor(d/30);return mo===1?"לפני חודש":mo===2?"לפני חודשיים":`לפני ${mo} חודשים`;}
  function lastHandled(t){let best=0;for(const v of [t.updated_at,...(Array.isArray(t.log)?t.log.map(e=>e&&e.at):[])]){const x=v?Date.parse(v):NaN;if(x>best)best=x;}return best;}
  function relDate(iso){const n=daysUntil(iso);if(n==null)return"";if(n===0)return"היום";if(n===1)return"מחר";if(n===-1)return"אתמול";if(n<0)return`באיחור ${-n} ימים`;if(n<=14)return`בעוד ${n} ימים`;return fmtDate(iso);}
  function safeUrl(u){try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:null;}catch(e){return null;}}
  function linkType(l){if(l.type)return l.type;const u=l.url||"";if(/claude\.ai\/(chat|code\/project|code\/session|share|project)/.test(u)&&!/\/artifact\//.test(u))return"chat";if(/\/artifact\/|\.html|github\.io/.test(u))return"page";return"other";}
  function linksOf(t){return (Array.isArray(t.links)?t.links:[]).filter(l=>l&&safeUrl(l.url));}
  function isOpen(t){return OPEN.includes(t.status||"active");}
  function isHot(t){if(!isOpen(t)||t.status==="paused")return false;const n=daysUntil(t.next_date);return (n!=null&&n<=2)||t.status==="waiting_me"&&n!=null&&n<=0;}
  function newId(){return "t-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
  function byDate(a,b){const x=daysUntil(a.next_date),y=daysUntil(b.next_date);return (x==null?9999:x)-(y==null?9999:y)||(a.priority==="high"?-1:0)-(b.priority==="high"?-1:0)||(b.updated_at||"").localeCompare(a.updated_at||"");}

  // ai_offers: [{id,text,detail,state:open|approved|declined|done,at}]  questions: [{id,q,options:[],answer,answered_at,done}]
  // snooze_until: ISO time, or "someday". Future = hidden in "אחר כך"; past = jumps to "חזר אליך" until Oren acts.
  function snoozed(t){const z=t.snooze_until;if(!z)return false;if(z==="someday")return true;return new Date(z)>new Date();}
  function returned(t){const z=t.snooze_until;return !!z&&z!=="someday"&&new Date(z)<=new Date();}
  function atHour(dayOffset,hh){const d=new Date();d.setDate(d.getDate()+dayOffset);d.setHours(hh,0,0,0);return d;}
  function laterOptions(){
    const now=new Date(),eod=atHour(0,18);
    return [["עוד שעה",new Date(now.getTime()+3600000)],now<eod?["סוף היום",eod]:["הערב",new Date(now.getTime()+3*3600000)],["מחר בבוקר",atHour(1,8)],["מחר בערב",atHour(1,19)],["בעוד שבוע",atHour(7,8)],["כשיהיה לי זמן","someday"]];
  }
  function fmtWhen(z){if(z==="someday")return"כשיהיה זמן";const d=new Date(z),n=daysUntil(new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10));const hm=d.toTimeString().slice(0,5);return (n===0?"היום ":n===1?"מחר ":fmtDate(new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10))+" ")+hm;}
  let laterFor=null;
  function remindLater(t,when,label){const z=when==="someday"?"someday":when.toISOString();laterFor=null;patch(t,{snooze_until:z,log:logPush(t,"תזכורת: "+label,new Date().toISOString())},when==="someday"?"עבר ל״אחר כך״":"אזכיר לך "+fmtWhen(z));}
  function laterBtn(t,key){return canWrite?h("button",{class:"opt later",type:"button",onclick:e=>{e.stopPropagation();laterFor=laterFor===key?null:key;renderAll();}},"⏰ אחר כך"):null;}
  function laterMenu(t,key){if(laterFor!==key)return null;return h("div",{class:"later-menu"},laterOptions().map(([l,w])=>h("button",{class:"opt",type:"button",onclick:press(()=>remindLater(t,w,l))},l)),t.snooze_until?h("button",{class:"opt",type:"button",onclick:press(()=>{laterFor=null;patch(t,{snooze_until:""},"התזכורת בוטלה");})},"בטל תזכורת"):null);}
  function offersOf(t){return (Array.isArray(t.ai_offers)?t.ai_offers:[]).filter(o=>o&&o.text);}
  function questionsOf(t){return (Array.isArray(t.questions)?t.questions:[]).filter(q=>q&&q.q);}
  function openAsks(t){return offersOf(t).filter(o=>(o.state||"open")==="open").length+questionsOf(t).filter(q=>!q.answer).length;}
  function forClaude(t){return offersOf(t).filter(o=>o.state==="approved").length+questionsOf(t).filter(q=>q.answer&&!q.done).length;}
  function chatOf(t){const c=linksOf(t).find(l=>linkType(l)==="chat");return c?safeUrl(c.url):null;}
  function logPush(t,text,now){return [...(Array.isArray(t.log)?t.log:[]),{at:now,text}];}
  function decideOffer(t,o,state){
    const now=new Date().toISOString();
    const offers=offersOf(t).map(x=>x.id===o.id?{...x,state,decided_at:now}:x);
    patch(t,{ai_offers:offers,log:logPush(t,(state==="approved"?"אישרת: ":"דחית: ")+o.text,now)},state==="approved"?"אושר. Claude יבצע ויעדכן כאן":"נדחה");
  }
  function optLabel(op){return typeof op==="object"&&op?String(op.label||""):String(op);}
  function answerQ(t,q,op){
    const now=new Date().toISOString(),ans=optLabel(op);

      if(op.then&&op.then.q)qs=[...qs,{id:"q"+Date.now().toString(36),q:String(op.then.q),options:Array.isArray(op.then.options)?op.then.options:[],answer:""}];

      h("div",{class:"ai-q"},"❓ "+q.q),

  function renderInbox(){
