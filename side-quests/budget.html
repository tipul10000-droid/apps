<style>
/* דשבורד הוצאות ותקציב (Side Quest). 2.0 (אורן 16.11.2026): אוחד עם "תשלומים חודשיים קבועים" (payments.html, שמפנה לכאן).
   נתונים: sq_docs topics/cf-budget (data.cf.summary + steps, התזרים כותב), payments (תשלום לכל מסמך + _meta), insurance (שורת ביטוחים חיה).
   תובנות, המלצות, צעדים וכללים = שורה אחת קצרה, לחיצה פותחת את הטקסט המלא מתחת (הכותרת לא זזה).
   נעול בקוד (dash-lock.js). החזרי הוצאות עבודה הם דשבורד נפרד (expenses.html, Work Quest). */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --sunk:#E7EDF1; --ink:#15212A; --muted:#5A6873; --line:#D6DFE5;
  --hero:#3B2F5C; --hero2:#6A55A0; --art:url(img/art-payments.svg); --mark:#E2C14B; --hero-ink:#F2F8FB; --hero-muted:#CFC6E6; --accent:#F4C152; --accent-ink:#3A2700;
  --good:#23855A; --good-soft:#DDF1E6; --warn:#A8600E; --warn-soft:#FBEAD3; --bad:#B83A2E; --bad-soft:#F8E0DD; --link:#5A44A0; --hi:#5A44A0; --hi-soft:#ECE7F8;
  --c-digital:#5B5BD6; --c-streaming:#C2378B; --c-telecom:#2773B8; --c-housing:#2E8B57; --c-car:#D08419; --c-insurance:#16706A; --c-leisure:#8E4FC0; --c-kids:#E0663C; --c-finance:#6B6B6B; --c-other:#8A8494;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161A; --surface:#182127; --sunk:#212C33; --ink:#EAF1F5; --muted:#9FB0BA; --line:#2A3740;
  --hero:#241C3A; --hero2:#463970; --hero-ink:#EEF6FA; --hero-muted:#B7ADD6; --good:#5CC88E; --good-soft:#163024; --warn:#EBA654; --warn-soft:#3A2814; --bad:#F07A6E; --bad-soft:#3A1E1B; --link:#B9A8F0; --hi:#B9A8F0; --hi-soft:#2A2340;
  --c-digital:#9A9AF0; --c-streaming:#E77DB9; --c-telecom:#6FAEE6; --c-housing:#62C08A; --c-car:#EBA74A; --c-insurance:#5FC2B9; --c-leisure:#BC8FE6; --c-kids:#F2946F; --c-finance:#B0B0B0; --c-other:#A39BB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161A; --surface:#182127; --sunk:#212C33; --ink:#EAF1F5; --muted:#9FB0BA; --line:#2A3740;
  --hero:#241C3A; --hero2:#463970; --hero-ink:#EEF6FA; --hero-muted:#B7ADD6; --good:#5CC88E; --good-soft:#163024; --warn:#EBA654; --warn-soft:#3A2814; --bad:#F07A6E; --bad-soft:#3A1E1B; --link:#B9A8F0; --hi:#B9A8F0; --hi-soft:#2A2340;
  --c-digital:#9A9AF0; --c-streaming:#E77DB9; --c-telecom:#6FAEE6; --c-housing:#62C08A; --c-car:#EBA74A; --c-insurance:#5FC2B9; --c-leisure:#BC8FE6; --c-kids:#F2946F; --c-finance:#B0B0B0; --c-other:#A39BB0; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
bdi{unicode-bidi:isolate}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700}
.hero h1{font-size:25px;margin:10px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;min-width:0;border:0;color:inherit;text-align:start;display:block;width:100%}
.kpi:active{background:rgba(255,255,255,.16)}
.kpi b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.save b{color:var(--accent)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 2px;font-weight:800;font-size:14.5px;font-family:var(--f-display);white-space:nowrap;min-width:0}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
section{margin-bottom:22px;scroll-margin-top:70px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:18px}.sh small{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:20px 12px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px 0}
/* one frame, rows split by lines (no frame in frame) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;padding:11px 14px;color:inherit;font-weight:400}
.row .b{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:700;font-size:15.5px;display:block}
.row .s{color:var(--muted);font-size:13px;display:block;line-height:1.4}
.row .v{flex:none;text-align:left;font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap}
.row .v small{display:block;font-family:var(--f-body);font-weight:700;font-size:11.5px;color:var(--muted)}
.row .sw{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--cc,var(--line))}
.mh{font-family:var(--f-display);font-weight:800;font-size:13.5px;color:var(--muted);padding:7px 14px 4px;background:var(--sunk);display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-block;font-family:var(--f-body);font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-hi{background:var(--hi-soft);color:var(--hi)}.p-mute{background:var(--sunk);color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--good)}
/* 2.0: collapsible bullet. One line, tap opens the full text below; the line itself never moves or changes size */
.xh{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;background:none;padding:9px 14px;text-align:right;color:inherit}
.xh .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.hi{background:var(--hi)}
.xh .em{flex:none;font-size:16px;min-width:20px;text-align:center;display:inline-flex;justify-content:center}
.xh .xt{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xh .xv{flex:none;font-family:var(--f-display);font-weight:800;font-size:13.5px;white-space:nowrap}
.xh .xv.save{color:var(--good)}
.xh .ch{flex:none;color:var(--muted);font-size:15px;transition:transform .2s;width:12px;text-align:center}
.xr.open .xh .ch{transform:rotate(-90deg)}
.xb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.xr.open .xb{grid-template-rows:1fr}
.xb>div{overflow:hidden;min-height:0}
.xb .in{padding:0 14px 12px 14px;padding-inline-start:33px;font-size:14.5px;line-height:1.55}
.xb .in>b{display:block;margin-bottom:2px}
.xb .in p{margin:4px 0 0}
.xb .meta{color:var(--muted);font-size:13px}
.who{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:0 7px;line-height:20px;white-space:nowrap;margin-inline-end:4px}
.who.oren{background:var(--warn-soft);color:var(--warn)}.who.claude{background:var(--hi-soft);color:var(--hi)}.who.both{background:var(--good-soft);color:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:0;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.acts>*{border:0;background:var(--surface);padding:7px 12px;font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.acts>*+*{border-inline-start:1px solid var(--line)}
.acts .ok{color:var(--good)}
/* decisions: question + options in one frame split by lines */
.qr{padding:11px 14px}
.qr .qt{font-weight:700;font-size:15px;line-height:1.35}
.qr .qs{color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;margin-top:8px;border:1px solid var(--hero2);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.opts button{border:0;background:var(--surface);color:var(--hi);padding:7px 12px;font-weight:700;font-size:14px;min-height:36px;transition:background .15s}
.opts button+button{border-inline-start:1px solid var(--hero2)}
.opts button.on{background:var(--hero);color:#fff}
/* wallet table */
.wt{display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.wt>*{background:var(--surface);padding:8px 8px;min-width:0}
.wt .h{background:var(--sunk);font-family:var(--f-display);font-weight:800;font-size:12.5px;color:var(--muted);text-align:center}
.wt .l{font-weight:700}
.wt .n{font-family:var(--f-display);font-weight:800;text-align:center;white-space:nowrap;direction:ltr}
.wt .tot{background:var(--hi-soft)}
.bar2{height:6px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden;position:relative}
.bar2 i{position:absolute;inset:0 0 0 auto;display:block;border-radius:3px;background:var(--hi)}
.bar2 i.over{background:var(--bad)}
.step.done{opacity:.55}
/* fixed payments */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:600;font-size:12px;opacity:.75;margin-inline-start:4px}
.bars{padding:10px 14px}
.brow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:14px;background:none;border:0;width:100%;text-align:start;padding:0}
.brow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px}
.brow .v{font-family:var(--f-display);font-weight:700;font-size:13.5px;direction:ltr;text-align:left}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;line-height:19px}
.tag.high{background:var(--bad-soft);color:var(--bad)}.tag.mid{background:var(--warn-soft);color:var(--warn)}.tag.low{background:var(--sunk);color:var(--muted)}.tag.okk{background:var(--good-soft);color:var(--good)}
.row .m{display:flex;flex-wrap:wrap;gap:3px 8px;color:var(--muted);font-size:12.5px;margin-top:1px}
details.fold2>summary{list-style:none;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--muted);padding:10px 2px}
details.fold2>summary::-webkit-details-marker{display:none}
details.fold2>summary::before{content:"‹ ";display:inline-block;transition:transform .2s}
details.fold2[open]>summary::before{transform:rotate(-90deg)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.links a{background:var(--surface);padding:11px 8px;text-align:center;font-size:14px;font-weight:800;color:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:none}
.sheet{position:fixed;z-index:41;inset:auto 16px 0 16px;height:78vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.open>.scrim{display:block}.open>.sheet{transform:none}
.sheet h3{font-size:19px;display:flex;align-items:center;gap:8px;padding-inline-end:44px;min-height:34px}
.sheet .x{position:sticky;top:0;float:left;border:0;background:var(--sunk);border-radius:999px;width:34px;height:34px;font-size:17px;z-index:2}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:14px 0;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.box{border-top:1px solid var(--line);padding:10px 0;font-size:14.5px}
.box h4{margin:0 0 4px;font-size:13.5px;color:var(--muted);font-family:var(--f-display)}
.box pre{white-space:pre-wrap;font-family:var(--f-body);margin:0;font-size:14px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{display:flex}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;padding:0}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:16px}.hero h1{font-size:22px}.seg button{font-size:13.5px}.wt{font-size:13px}.wt>*{padding:7px 5px}.brow{grid-template-columns:96px 1fr 62px}}
@media (prefers-reduced-motion:reduce){.xb,.sheet,.xh .ch{transition:none}}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=a=>Array.isArray(a)?a:[];
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const CF="https://household-cashflow-control.vercel.app/spending/budget";
const ils=v=>v==null||v===""||isNaN(+v)?"—":'<bdi dir="ltr">'+(v<0?"−":"")+"₪"+Math.round(Math.abs(+v)).toLocaleString("he-IL")+"</bdi>";
const kils=v=>{if(v==null||v===""||isNaN(+v))return "—";const a=Math.abs(+v);if(a<1000)return ils(v);return '<bdi dir="ltr">'+(v<0?"−":"")+"₪"+(a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,"")+"K</bdi>";};
const sgn=v=>`<span class="${v<0?"neg":v>0?"pos":""}">${ils(v)}</span>`;
const VD={fixed:["קבוע","p-mute"],ok:["בתקציב","p-good"],tight:["צמוד","p-warn"],over:["חריגה","p-bad"],missing:["לא בתכנון","p-warn"]};
// how we count (Oren 15.11.2026). Rules only; the numbers come from the cashflow app.
const RULES=[
  ["🏦","הלוואות הן לא הכנסה","כסף שנכנס מהלוואה הוא חוב, לא הכנסה. גם העברות נכנסות שאינן משכורת לא נספרות."],
  ["🔁","העברות מההשקעות = המינוס גדל","העברות מהחשבון השני הן לא הכנסה. שני החשבונות נספרים יחד במינוס."],
  ["🤝","גישור שהוחזר לא בפער","גישור קצר של כמה שבועות מהמשפחה שהוחזר במלואו בביט לא נספר כהכנסה וגם לא כחוב."],
  ["📉","חודש רגיל = החודש הנמוך","המשכורת בחודש רגיל לפי הרבעון התחתון, כדי שהתמונה לא תהיה ורודה מדי. מה שמעל זה כסף שנתי."],
  ["✈️","שני ארנקים","חודשי: משכורות מול הוצאות חודשיות וחיסכון. שנתי: בונוסים, מילואים, החזרים ועבודות נוספות מול טיולים ומיוחדות."],
  ["🧾","נסיעות עבודה","נסיעות עבודה נכללות בטיולים בפועל, וההחזר שלהן נכנס כהכנסה שנתית. ההגשה עצמה: בדשבורד החזרי עבודה ב-Work Quest."]];
// fixed payments (was payments.html)
const CATS={
  telecom:{l:"אינטרנט, טלוויזיה וסלולר",s:"תקשורת",i:"📶",c:"--c-telecom"},
  streaming:{l:"סטרימינג",s:"סטרימינג",i:"🎬",c:"--c-streaming"},
  digital:{l:"מנויים דיגיטליים ו-AI",s:"דיגיטלי",i:"☁️",c:"--c-digital"},
  housing:{l:"דיור: שכירות, ארנונה, חשמל, מים",s:"דיור",i:"🏠",c:"--c-housing"},
  insurance:{l:"ביטוחים",s:"ביטוחים",i:"🛡️",c:"--c-insurance"},
  car:{l:"רכב ותחבורה",s:"רכב",i:"🚗",c:"--c-car"},
  leisure:{l:"פנאי",s:"פנאי",i:"🎾",c:"--c-leisure"},
  kids:{l:"ילדים וחינוך",s:"ילדים",i:"🎒",c:"--c-kids"},
  finance:{l:"בנק ופיננסים",s:"בנק",i:"🏦",c:"--c-finance"},

    <p class="hint">מסמנים צעד שבוצע במשימה "תקציב הבית".</p></section>
  <section><div class="sh"><h2>מה סיכמנו</h2><small>איך סופרים</small></div><div class="list">${RULES.map((r,i)=>xr("r"+i,r[1],esc(r[2]),{em:r[0]})).join("")}</div></section>`;}

function links(){return `<section><div class="links"><a href="${CF}" target="_blank" rel="noopener">📊 התקציב בתזרים</a><a href="./#t=cf-budget" target="_top">✅ המשימה</a><a href="credit.html">💳 כרטיסי אשראי</a><a href="insurance.html">🛡️ ביטוחים</a></div></section>`;}
function render(){$("hero").innerHTML=hero();$("bar").innerHTML=bar();
  const s=S(),t=ui.tab;
  if(!T&&t!=="fixed"){$("app").innerHTML='<div class="empty">טוען…</div>';}
  else if(!s.monthly&&t!=="fixed"){$("app").innerHTML='<div class="empty">אין עדיין נתונים מהתזרים. פותחים את התזרים פעם אחת והם מגיעים.</div>'+links();}
  else $("app").innerHTML=(t==="month"?tabMonth():t==="fixed"?tabFixed():t==="year"?tabYear():t==="steps"?tabSteps():tabSum())+links();
  const pm=P.meta;
  $("foot").innerHTML=`${(s.months||[]).length?'התזרים <bdi dir="ltr">'+esc(mLbl(s.months[0]))+"–"+esc(mLbl(s.months[1]))+"</bdi>":""}${pm.updated?" · תשלומים עודכנו "+esc(pm.updated):""}${pm.sources&&t==="fixed"?`<details class="more"><summary>מקורות</summary><div>${esc(pm.sources)}</div></details>`:""}<br>הוצאות ותקציב ${esc(window.BG_BUILD)} · ${esc(window.BG_BUILD_AT)}`;}

// ---- taps ----
document.addEventListener("click",e=>{
  const x=e.target.closest("[data-x]");
  if(x){const k=x.dataset.x,r=x.closest(".xr"),op=!OPEN.has(k);op?OPEN.add(k):OPEN.delete(k);r.classList.toggle("open",op);x.setAttribute("aria-expanded",op);return;}
  const tb=e.target.closest("[data-tab]");
  if(tb){const go=tb.dataset.go;ui.tab=tb.dataset.tab;save();render();
    const tgt=go&&$(go);if(tgt)tgt.scrollIntoView({behavior:"smooth",block:"start"});else if(!tb.closest(".seg")&&!tb.closest(".kpis"))scrollTo({top:0});
    else if(tb.closest(".kpis")){const b=$("bar");if(b)b.scrollIntoView({block:"start"});}
    return;}
  const c=e.target.closest("[data-c]");if(c){fCat=c.dataset.c;render();return;}
  const a=e.target.closest("[data-ans]");if(a){answer(a);return;}
  const d=e.target.closest("[data-done]");if(d){markDone(d.dataset.done);if(d.closest("#sheet"))setTimeout(()=>openItem(d.dataset.done),50);return;}
  const u=e.target.closest("[data-undo]");if(u){setAnswer(u.dataset.undo,null);setTimeout(()=>openItem(u.dataset.undo),50);return;}
  const cp=e.target.closest("[data-copy]");if(cp){copyMail(cp.dataset.copy);return;}
  const p=e.target.closest("[data-p]");if(p){openItem(p.dataset.p);return;}
});

// ---- payments writes (decisions → todo; done; undo). Each write touches only the fields that changed. ----
let undoFn=null,tt=null;
function toast(t,u){$("toastT").textContent=t;undoFn=u||null;$("toastU").style.display=u?"":"none";$("toast").className="toast on";clearTimeout(tt);tt=setTimeout(()=>{$("toast").className="toast";undoFn=null;},5000);}
$("toastU").onclick=()=>{const f=undoFn;$("toast").className="toast";undoFn=null;f&&f();};
function answer(b){b.classList.add("on");const id=b.dataset.ans,i=+b.dataset.i,p=P.items.find(x=>x.id===id);if(!p||!p.q)return;
  const o=(p.q.options||[])[i],label=typeof o==="string"?o:o.label,inSheet=!!b.closest("#sheet");
  setTimeout(()=>{setAnswer(id,label,o&&o.no_save,typeof o==="object"?o:null);if(inSheet)openItem(id);},300);}
async function setAnswer(id,label,noSave,opt){const p=P.items.find(x=>x.id===id);if(!p||!db)return;
  const now=new Date().toISOString(),prev={q:{...p.q},todo:p.todo?{...p.todo}:null,status:p.status};
  const q={...p.q,answer:label||"",answered_at:label?now:"",no_save:!!noSave},up={q,updated_at:now};
  if(label&&opt&&opt.todo)up.todo={...opt.todo,status:"open",from:label,at:now};
  else if(label&&!(opt&&opt.close))up.todo={who:"claude",text:`להגדיר את הצעד הבא אחרי ההחלטה: ${label}`,status:"open",from:label,at:now};
  if(label&&opt&&opt.status)up.status=opt.status;
  if(!label)up.todo=prev.todo&&prev.todo.from?null:prev.todo;
  up.log=[...arr(p.log),{at:now,text:label?`ענית: ${p.q.q} → ${label}${up.todo&&up.todo.text?" · הצעד הבא: "+up.todo.text:""}`:"ביטלת תשובה"}];
  Object.assign(p,up);render();
  try{await db.collection("payments").doc(id).update(up);
    if(label)toast(up.todo?"נשמר. עבר לפעולות הפתוחות":"נשמר וסגור",async()=>{Object.assign(p,prev);render();try{await db.collection("payments").doc(id).update({q:prev.q,todo:prev.todo,status:prev.status});}catch(e){}});}
  catch(e){Object.assign(p,prev);render();toast("השמירה נכשלה, נסה שוב");}}
async function markDone(id){const p=P.items.find(x=>x.id===id);if(!p||!p.todo||!db)return;
  const now=new Date().toISOString(),prev={...p.todo},todo={...p.todo,status:"done",done_at:now},log=[...arr(p.log),{at:now,text:"בוצע: "+p.todo.text}];
  p.todo=todo;render();
  try{await db.collection("payments").doc(id).update({todo,log,updated_at:now});
    toast("סומן כבוצע",async()=>{p.todo=prev;render();try{await db.collection("payments").doc(id).update({todo:prev});}catch(e){}});}
  catch(e){p.todo=prev;render();toast("השמירה נכשלה, נסה שוב");}}
async function copyMail(id){const p=P.items.find(x=>x.id===id);if(!p||!p.email)return;
  const t=(p.email.subject?p.email.subject+"\n\n":"")+p.email.body;
  try{await navigator.clipboard.writeText(t);toast("הנוסח הועתק");}catch(e){toast("לא הצלחתי להעתיק");}}
const fmtD=d=>{if(!d)return "";const [y,m,dd]=String(d).split("-");return dd?`${+dd}.${+m}`:`${+m}.${(y||"").slice(2)}`;};
function openItem(id){const p=allItems().find(x=>x.id===id);if(!p)return;
  if(p.virtual&&p.link){location.href=p.link;return;}
  const c=CATS[p.cat]||CATS.other,st=STATUS[p.status]||STATUS.active,v=monthly(p);
  const row=(k,val)=>val==null||val===""?"":`<dt>${k}</dt><dd>${val}</dd>`;
  const q=p.q&&p.q.q?(p.q.answer?`<div class="box"><h4>החלטה</h4>${esc(p.q.q)}<br><b>✓ ${esc(p.q.answer)}</b><div class="acts"><button data-undo="${esc(p.id)}">שינוי</button></div></div>`:`<div class="box"><h4>החלטה</h4>${qRow(p).replace('class="qr"','class="qr" style="padding:0"')}</div>`):"";
  $("sheet").innerHTML=`<button class="x" id="sx" aria-label="סגירה">✕</button>
  <h3>${window.SQ_LOGO?SQ_LOGO(p,34):`<span>${esc(p.icon||c.i)}</span>`}${esc(p.name)}</h3>
  <dl class="kv">${row("סטטוס",`<span class="tag ${st[1]}">${st[0]}</span>`)}
    ${row("סכום",p.amt!=null&&p.amt!==""?`${p.cur==="USD"?"$"+esc(p.amt):ils(+p.amt)} ${esc(CYC[p.cycle]||"")}${p.cur==="USD"||p.cycle!=="m"?` · ${ils(v)} לחודש`:""}`:esc(p.amt_label||"לא ידוע עדיין"))}
    ${row("משלמים דרך",esc(p.pay))}${row("מי משתמש",esc(p.who))}${row("החיוב הבא",p.next?fmtD(p.next):"")}${row("קטגוריה",c.i+" "+esc(c.l))}</dl>
  ${p.todo&&p.todo.text?`<div class="box"><h4>הצעד הבא · ${WHO[p.todo.who]||WHO.oren}${p.todo.status==="done"?" · בוצע ✓":""}</h4>${esc(p.todo.text)}${p.todo.status!=="done"&&p.todo.who!=="claude"?`<div class="acts"><button class="ok" data-done="${esc(p.id)}">✓ בוצע</button></div>`:""}</div>`:""}
  ${q}
  ${p.why?`<div class="box"><h4>למה</h4>${esc(p.why)}</div>`:""}
  ${p.note?`<div class="box"><h4>מה ידוע</h4>${esc(p.note)}</div>`:""}
  ${p.market?`<div class="box"><h4>מחיר שוק</h4>${esc(p.market)}</div>`:""}
  ${p.email&&p.email.body?`<div class="box"><h4>נוסח מוכן${p.email.to_label?" · "+esc(p.email.to_label):""}</h4><pre>${esc(p.email.body)}</pre></div>`:""}
  ${actsHtml(p,false)}
  ${arr(p.log).length?`<div class="box"><h4>היסטוריה</h4>${p.log.slice(-5).reverse().map(l=>`<div style="font-size:13px;color:var(--muted)">${esc(String(l.at||"").slice(0,10))} · ${esc(l.text)}</div>`).join("")}</div>`:""}
  <div class="box meta">מקור: ${esc(SRC[p.src]||p.src||"")}${p.seen?` · נבדק ${esc(p.seen)}`:""}</div>`;
  $("sheetwrap").className="open";$("sx").onclick=close;}
function close(){$("sheetwrap").className="";}
$("scrim").onclick=close;document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection("topics").doc("cf-budget").onSnapshot(x=>{T=x&&x.exists!==false&&x.data?x.data()||{}:{};render();},()=>{$("app").innerHTML='<div class="empty">הטעינה נכשלה</div>';});
  db.collection("payments").onSnapshot(s=>{const items=[],meta={};
    s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted||v.excluded)return;if(x.id==="_meta")Object.assign(meta,v);else if(v.name)items.push({id:x.id,...v});});
    P.items=items;P.meta=meta;render();},()=>{});
  db.collection("insurance").onSnapshot(s=>{P.ins=s.docs.map(x=>({id:x.id,...x.data()}));render();},()=>{});
});
})();
</script>
