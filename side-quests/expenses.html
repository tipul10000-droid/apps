<style>

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}

.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}

.toast.on{display:flex}.toast button{border:0;background:none;color:var(--accent);font-weight:800;cursor:pointer;padding:0}

details.more{margin-top:4px}details.more summary{cursor:pointer;font-weight:800;color:var(--link);font-size:14px;padding:4px 2px}
details.more>div{padding:6px 2px;font-size:14px;color:var(--muted);line-height:1.55}

.hero .kpis .kpi b{white-space:normal;overflow:visible;font-size:14.5px}

.trip.red{border-color:var(--bad)}

.th .b{flex:1;min-width:0}.th .t{font-family:var(--f-display);font-weight:800;font-size:16px;display:block}
.th .s{font-size:12.5px;color:var(--muted);display:block}
.tb{padding:10px 14px 12px;animation:grow .22s ease-out}
.tb .stand{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.lab{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 4px}
.dec{display:grid;grid-template-columns:1fr 1fr;flex:none;width:112px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dec button{border:0;background:var(--surface);padding:6px 0;font-weight:800;font-size:12.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dec button.on{background:var(--hi);color:#fff}
.dec.c3{grid-template-columns:repeat(3,1fr);width:100%;margin-top:6px}
.irow{display:flex;align-items:center;gap:10px;padding:8px 0}
.irow+.irow{border-top:1px solid var(--line)}
.irow .b{flex:1;min-width:0}.irow .t{font-weight:700;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .s{font-size:12px;color:var(--muted);display:block;direction:rtl}
.irow .v{font-family:var(--f-display);font-weight:800;font-size:14px;white-space:nowrap;direction:ltr;text-align:left}

details.fd{border-top:1px solid var(--line);margin-top:6px}

.need .row .v{font-size:14px}
.car{padding:10px 14px}.car+.car{border-top:1px solid var(--line)}
.car .t{font-weight:800;font-size:15px}.car .s{font-size:12.5px;color:var(--muted)}
.hold{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:6px}
.todo{background:var(--hi-soft);color:var(--hi);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:800;margin:6px 0 2px}

.go{display:block;width:100%;border:0;border-radius:12px;background:var(--hi);color:#fff;font-family:var(--f-display);font-weight:800;font-size:15.5px;padding:11px;cursor:pointer;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 14px}.prow+.prow{border-top:1px solid var(--line)}
.prow .b{flex:1;min-width:0;font-weight:700;font-size:14px}
.prow .dec{width:170px}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0 14px 8px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.calc span{background:var(--surface);padding:6px 8px;display:flex;flex-direction:column;line-height:1.3}.calc em{font-style:normal;font-size:11.5px;color:var(--muted)}.calc b{font-size:15px;color:var(--ink)}.calc span:last-child b{color:var(--hi,#2E6FB0)}.calc small{font-size:10.5px;color:var(--muted);white-space:nowrap}
/* 1.6: no frame in a frame: calc + status row are full-bleed segments of the trip card, split by lines */
.calc{margin:0;border:0;border-top:1px solid var(--line);border-radius:0}
.tsel{padding:0}.tsel .dec{width:100%;margin:0;border:0;border-top:1px solid var(--line);border-radius:0}.tsel .dec button{padding:11px 0;font-size:14px}
.trip .tb{border-top:1px solid var(--line)}
.st3 button.on{background:var(--hi-soft);color:var(--hi)}.st3 button.cur{background:var(--hi);color:#fff}

/* 1.8 (Oren 16.11.2026): what to do on top, what to know, everything else folded. Green ✓ on every tap. */
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.box.todo-box{border:2px solid var(--hi)}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--hi);color:#fff;font-family:var(--f-display);font-weight:800;font-size:17px}
.bh small{font-size:13px;font-weight:700;opacity:.85}
.bh{background:var(--hero2)}
.box.know .bh{background:var(--sunk);color:var(--ink);font-size:15.5px}
.ac{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;transition:background .25s}
.ac+.ac{border-top:1px solid var(--line)}
.ac .ic{flex:none;font-size:20px;width:26px;text-align:center}
.ac .b{flex:1;min-width:0}
.ac .t{display:block;font-weight:800;font-size:15px;line-height:1.35}

.ab button.alt{background:var(--surface);color:var(--muted);font-size:12.5px;padding:7px 2px}

.ac.ok{background:var(--good-soft)}
.ac .b[data-xp]{cursor:pointer;-webkit-tap-highlight-color:transparent}.ac .xc{color:var(--link);font-weight:700;white-space:nowrap}
@keyframes xdgrow{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}.sqgrow{animation:xdgrow .22s ease-out}

.know .ac .t{font-weight:700;font-size:14.5px}
.allok{padding:14px;text-align:center;color:var(--good);font-weight:800;background:var(--good-soft)}

details.zone>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;font-family:var(--f-display);font-weight:800;font-size:15px;-webkit-tap-highlight-color:transparent}
details.zone>summary::-webkit-details-marker{display:none}
details.zone>summary .n{flex:1}details.zone>summary small{color:var(--muted);font-weight:700;font-size:13px;font-family:var(--f-body)}
details.zone>summary::after{content:"▾";color:var(--muted);transition:transform .2s}details.zone[open]>summary::after{transform:rotate(180deg)}

/* selected = green ✓, check = amber, bad = red */
.st3 button.on{background:var(--good-soft);color:var(--good)}.st3 button.cur{background:var(--good);color:#fff}

@media (max-width:420px){.kpi b{font-size:15px}.hero h1{font-size:22px}.seg button{font-size:12.5px}.chips button{font-size:12px}}

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const arr=a=>Array.isArray(a)?a:[];
// 4 categories (Oren 13.11.2026)
// Oren 16.11.2026: abroad = Italy trips (everything incl. project/food/fuel there); the other 3 are in Israel only
const CATS=[["abroad","✈️🇮🇹","חו״ל"],["project","📁🇮🇱","פרויקטלי"],["meals","🍽️🇮🇱","אש״ל"],["car","🚗🇮🇱","רכב"]];
// receipt flow: in chat → sent to the work mailbox → submitted on Elbit's network → money back. personal = not Elbit's.
const ST={open:["לא נשלח","p-bad"],sent:["במייל","p-warn"],submitted:["הוגש","p-hi"],received:["התקבל","p-good"],personal:["פרטי","p-mute"]};
const ORDER=["open","sent","submitted","received","personal"];
const SYM={EUR:"€",ILS:"₪",USD:"$"};
const CF_URL="https://household-cashflow-control.vercel.app/trips?t=work";

// each action: k = what the green button does, k2 = optional second outcome.
function acts(){const R=tripRows(),C=cars(),A=[],K=[],sc=scanRow(),until=x=>((String(x||"").match(/עד\s+(\d{1,2}\.\d{1,2}(?:\.\d{2,4})?)/)||[])[1]||"");
  const stepRow=(row,s,nm)=>({k:"st:"+row.id+":"+s.id,ic:"🔎",t:s.text,s:nm||"",b:"✓ טופל",wait:!!s.wait});
  R.forEach(t=>{const st=tState(t),nm=tLabel(t),v=tripTot(t);
    if(st==="open")A.push({d:"t:"+t.id,k:"ts:"+t.id+":scanned",ic:"🧾",t:"לשלוח קבלות לצ׳אט",s:nm,v:v?ils0(v):"",b:"✓ נשלח"});
    if(st==="scanned")A.push({d:"t:"+t.id,k:"ts:"+t.id+":submitted",ic:"📤",t:"להגיש באלביט",s:nm+" · הוצאות + אש״ל",v:v?ils0(v):"",b:"✓ הגשתי"});
    const ask=0;if(ask)A.push({k:"open:"+t.id,ic:"❓",t:`לסווג ${ask} חיובים: עבודה או פרטי`,s:nm,b:"פתח ›",go:1});
    if(st==="open"||st==="scanned")arr(t.steps).filter(s=>!s.tx&&!s.done&&!s.superseded&&!["scan","submit","paid","classify"].includes(s.id)).forEach(s=>{const r=stepRow(t,s,nm);(r.wait?K:A).push(r);});});
  C.forEach(c=>{const nm=c.label+" "+c.amt,ic=c.hotel?"🏨":"🚗";
    if(c.state==="bad")A.push({d:"c:"+c.tx,k:"cv:"+c.tx+":submitted",ic:"📤",t:"להגיש לאלביט: "+nm,s:c.info,b:"✓ הגשתי"});
    else if(!c.state)A.push({d:"c:"+c.tx,k:"cv:"+c.tx+":ok",k2:"cv:"+c.tx+":bad",ic,t:"להכריע: "+nm,s:c.info,b:"✓ תקין",b2:"להגיש"});
    else if(c.state==="check"&&c.hold)K.push({d:"c:"+c.tx,k:"cv:"+c.tx+":ok",k2:"cv:"+c.tx+":bad",ic:"⏳",t:"תפיסת מסגרת: "+nm,s:"לבדוק בכאל"+(until(c.todo)?" עד "+until(c.todo):"")+" שירד ולא הפך לחיוב",b:"✓ ירד",b2:"הפך לחיוב"});
    else if(c.state==="check")A.push({d:"c:"+c.tx,k:"cv:"+c.tx+":ok",k2:"cv:"+c.tx+":bad",ic:"🔎",t:"בבירור: "+nm,s:c.todo||c.info,b:"✓ נסגר",b2:"להגיש"});
});
  if(sc)arr(sc.steps).filter(s=>!s.tx&&!s.done&&!s.superseded).forEach(s=>{const r=stepRow(sc,s,"חיוב ישן · לבדוק במחשב העבודה");(r.wait?K:A).push(r);});
  return {A,K};}
const pend={};
function xDetail(d){const [ty,id]=[d.slice(0,1),d.slice(2)];if(ty==="t"){const t=topics.find(x=>x.id===id);return t?tripCard(t,1):"";}const c=cars().find(x=>x.tx===id);return c?carRow(c,1):"";}
function acRow(x){const xo=x.d&&ui.xp===x.d;return `<div class="ac${pend[x.k]?" ok":""}" data-row="${esc(x.k)}"><span class="ic">${x.ic}</span><span class="b"${x.d?` data-xp="${esc(x.d)}"`:""}><span class="t">${esc(x.t)}</span>${x.s||x.d?`<span class="s">${esc(x.s||"")}${x.d?`<span class="xc">${xo?" ▴ פחות":" ▾ פרטים"}</span>`:""}</span>`:""}</span>${x.v?`<span class="v">${esc(x.v)}</span>`:""}
  <span class="ab">${x.go?`<button data-act="${esc(x.k)}" class="go2">${esc(x.b)}</button>`:`<button data-act="${esc(x.k)}" class="chk${pend[x.k]?" on":""}" aria-pressed="${pend[x.k]?"true":"false"}"><i>✓</i>${esc(String(x.b).replace(/^✓\s*/,""))}</button>`}${x.k2?`<button data-act="${esc(x.k2)}" class="alt">${esc(x.b2)}</button>`:""}</span></div>${xo?`<div class="xd sqgrow">${xDetail(x.d)}</div>`:""}`;}
function zone(id,title,sub,body,cls){return body?`<details class="zone ${cls||""}" data-zone="${id}"${ui["z_"+id]?" open":""}><summary><span class="n">${title}</span><small>${sub||""}</small></summary><div class="zb">${body}</div></details>`:"";}
const carAct=c=>!c.state||c.state==="check"||c.state==="bad";
function elbitView(){const R=tripRows();if(!R.length)return "";
  const cur=R.filter(t=>lv(tState(t))<2),arc=R.filter(t=>lv(tState(t))>=2);
  const C=cars(),co=C.filter(carAct),cd=C.filter(c=>!carAct(c)),{A,K}=acts();
  const wait=cur.reduce((a,t)=>a+tripTot(t),0);
  let o=`<div class="box todo-box"><div class="bh"><span>📌 לעשות עכשיו</span><small>${A.length||""}</small></div>${A.length?A.map(acRow).join(""):'<div class="allok">✓ אין מה לעשות עכשיו</div>'}</div>`;
  if(K.length)o+=`<div class="box know"><div class="bh"><span>💡 חשוב לדעת</span></div>${K.map(acRow).join("")}</div>`;
  // 2.2 (Oren 16.11.2026): every item appears once. Open trips/charges live only in the boxes above (▾ פרטים opens their details in place).
  const arcBody=(arc.length?`<div class="lab">נסיעות</div>`+arc.map(tripCard).join(""):"")+(cd.length?`<div class="lab">חיובים חריגים</div><div class="list">${cd.map(carRow).join("")}</div>`:"");
  o+=zone("done","📦 ארכיון: הוגש וסגור",`${arc.length+cd.length}`,arcBody,"done");
  return o;}
function doAct(k){const [type,a,b2]=k.split(":");
  if(type==="ts")return setTripState(a,b2);
  if(type==="cv")return setVerdict(a,b2);
  if(type==="st"){const t=topics.find(x=>x.id===a);if(!t)return;const was=arr(t.steps);const S=was.map(s=>s.id===b2?{...s,done:true,done_at:nowIso()}:s);patchTopic(t,{steps:S},"שלב: "+b2);toast("✓ סומן טופל",()=>patchTopic(t,{steps:was},"בוטל"));return;}
  if(type==="open"){ui.xp="t:"+a;save();holdUntil=0;render();}}
function patchTopic(t,patch,logText){const now=nowIso(),p={...patch,updated_at:now};
  if(logText)p.log=[...arr(t.log),{at:now,text:"דשבורד ההוצאות: "+logText}].slice(-40);
  Object.assign(t,p);render();return db.collection("topics").doc(t.id).update(p).catch(()=>toast("השמירה נכשלה"));}
function tripPatch(t,st){const now=nowIso(),L=lv(st);let S=arr(t.steps).map(s=>({...s}));
  [["scan","לסרוק את הקבלות בצ׳אט (נשלחות למייל העבודה)"],["submit","להגיש באלביט"],["paid","ההחזר נכנס לבנק"]].forEach(([id,text])=>{if(!S.find(s=>s.id===id))S.push({id,who:"oren",done:false,text});});
  const need={scan:1,submit:2,paid:3};S=S.map(s=>need[s.id]?{...s,done:L>=need[s.id],done_at:L>=need[s.id]?(s.done_at||now):null}:s);
  const v=tripTot(t);
  return {steps:S,status:st==="received"?"done":st==="submitted"?"waiting_other":"waiting_me",waiting_for:st==="received"?"":st==="submitted"?"אלביט: העברת ההחזר":st==="scanned"?"אתה: להגיש באלביט":"אתה: לשלוח קבלות לצ׳אט",
    money_potential:st==="received"?0:v,money_expected:0,money_saved:0,money_note:st==="received"?"החזר הוצאות + אש״ל התקבל (לא הכנסה)":"החזר הוצאות + אש״ל צפוי (לא הכנסה)",...(st==="received"?{done_at:now}:{})};}
function setTripState(id,st){const t=topics.find(x=>x.id===id);if(!t||!db)return;const prev={steps:arr(t.steps),status:t.status,waiting_for:t.waiting_for};
  patchTopic(t,tripPatch(t,st),"סומן "+TS[st][0]);toast("✓ נשמר: "+TS[st][0],()=>{patchTopic(t,prev,"בוטל");});}
function setDecision(id,tx,d){const t=topics.find(x=>x.id===id);if(!t||!db)return;const dec={...(t.decisions||{})};const was=dec[tx];dec[tx]={decision:d,at:nowIso()};
  const p={decisions:dec};const it=itemsOf({...t,decisions:dec});const cl=stp(t,"classify");
  if(cl&&!cl.done&&it.length&&!it.some(i=>!fin(i)))p.steps=arr(t.steps).map(s=>s.id==="classify"?{...s,done:true,done_at:nowIso()}:s);
  patchTopic(t,p);const e=it.find(i=>i.tx===tx);
  if(e&&e.eid){const x=docs.find(y=>y.id===e.eid);const ns=d==="private"?"personal":(x&&x.st==="personal"?"open":x&&x.st);if(x&&ns!==x.st){x.st=ns;db.collection("expenses").doc(x.id).update({st:ns,st_at:nowIso()}).catch(()=>{});}}
  toast(d==="work"?"✓ נשמר: עבודה":"✓ נשמר: פרטי",()=>{const D={...(t.decisions||{})};if(was)D[tx]=was;else delete D[tx];patchTopic(t,{decisions:D});});}
function setVerdict(tx,state){const sc=scanRow();if(!sc||!db)return toast("חסרה משימת חיובי הרכב");const V={...(sc.verdicts||{})},was=V[tx];V[tx]={state,at:nowIso()};
  patchTopic(sc,{verdicts:V},"חיוב רכב: "+(VS[state]||state));
  const c=cars().find(x=>x.tx===tx);if(c){const row=topics.find(x=>x.id===c.row);const done=state==="ok"||state==="received";
    if(row){const S=arr(row.steps).map(s=>s.tx===tx?{...s,done,done_at:done?nowIso():null}:s);if(JSON.stringify(S)!==JSON.stringify(row.steps))patchTopic(row,{steps:S});}}
  toast("✓ נשמר: "+({ok:"תקין",check:"בבירור",bad:"לא תקין",submitted:"הוגש",received:"התקבל"}[state]),()=>{const W={...(sc.verdicts||{})};if(was)W[tx]=was;else delete W[tx];patchTopic(sc,{verdicts:W});});}
function confirmPast(){const R=tripRows().filter(t=>isPast(t)&&!t.confirmed_at),now=nowIso();
  R.forEach(t=>{const sel=(ui.past&&ui.past[t.id])||(tState(t)==="open"?"received":tState(t));patchTopic(t,{...tripPatch(t,sel),confirmed_at:now},"אישור עבר: "+TS[sel][0]);});
  toast(`אושרו ${R.length} נסיעות`);}
function setDeposit(id,d,ils){const t=topics.find(x=>x.id===id);if(!t)return;patchTopic(t,{...tripPatch(t,"received"),deposit:{d,ils:+ils,at:nowIso()}},"הותאמה הפקדה "+fdate(d));toast("ההחזר סומן כהתקבל");}
let holdUntil=0,rtm=null,pulseSel=null;
function setPendUI(k,on){document.querySelectorAll(`[data-act="${CSS.escape(k)}"].chk`).forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);const r=b.closest(".ac");if(r)r.classList.toggle("ok",on);});}
function cancelPend(k){if(!pend[k])return;clearTimeout(pend[k]);delete pend[k];setPendUI(k,false);}
function togglePend(k){if(pend[k]){cancelPend(k);$("toast").classList.remove("on");return;}
  pend[k]=setTimeout(()=>{delete pend[k];const r=document.querySelector(`.ac [data-act="${CSS.escape(k)}"].chk`);const row=r&&r.closest(".ac");if(row)row.classList.add("fold");setTimeout(()=>doAct(k),row?300:0);},5000);
  setPendUI(k,true);toast("✓ בוצע",()=>cancelPend(k));}
function render(){if(!loaded)return;const w=holdUntil-Date.now();if(w>0){clearTimeout(rtm);rtm=setTimeout(render,w+20);return;}$("hero").innerHTML=hero();$("bar").innerHTML=bar();$("app").innerHTML=tab();
  if(pulseSel){const el=document.querySelector(pulseSel);pulseSel=null;if(el){el.classList.remove("just");void el.offsetWidth;el.classList.add("just");}}
  $("foot").innerHTML=`${meta.scan_at?"סריקת אשראי אחרונה: "+esc(fdate(meta.scan_at))+"<br>":""}הוצאות ${esc(window.EX_BUILD)}`;}
let tt=null,undoFn=null;
function toast(msg,undo){$("tmsg").textContent=msg;$("toast").classList.toggle("good",/^(✓|סומן|נשמר|אושרו|ההחזר)/.test(msg));undoFn=undo||null;$("tundo").hidden=!undo;$("toast").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("on"),5000);}
$("tundo").onclick=()=>{const f=undoFn;$("toast").classList.remove("on");if(f)f();};
// the trip's Side Quests task follows its expenses (same idea as the cashflow app's sync)
async function syncTopic(tripId){const t=trips().find(x=>x.id===tripId);if(!t||!t.topic_id||!db||/^elbit-trip-/.test(t.topic_id))return;
  const L=exps().filter(x=>x.trip===tripId&&x.st!=="personal");if(!L.length)return;
  const due=L.filter(x=>toSubmit(x)||missing(x)),wait=L.filter(x=>x.st==="submitted"),now=new Date().toISOString();
  const status=due.length?"waiting_me":wait.length?"waiting_other":"done";
  const stand=due.length?`להגיש ${sumTxt(sums(due))} (${due.length})`:wait.length?`הוגש, מחכה להחזר ${sumTxt(sums(wait))}`:"ההחזר התקבל";
  try{await db.collection("topics").doc(t.topic_id).update({status,stand,waiting_for:due.length?"אתה: להגיש באלביט":wait.length?"אלביט: העברת ההחזר":"",...(status==="done"?{done_at:now}:{}),updated_at:now});}catch(e){}}
async function setSt(ids,st){if(!db)return;const now=new Date().toISOString(),prev=ids.map(id=>[id,(docs.find(x=>x.id===id)||{}).st||"open"]);
  const tripIds=new Set(ids.map(id=>(docs.find(x=>x.id===id)||{}).trip).filter(Boolean));
  try{await Promise.all(ids.map(id=>db.collection("expenses").doc(id).update({st,st_at:now})));
    tripIds.forEach(syncTopic);
    toast(ids.length>1?`${ids.length} סומנו: ${ST[st][0]}`:`סומן: ${ST[st][0]}`,async()=>{try{await Promise.all(prev.map(([id,s])=>db.collection("expenses").doc(id).update({st:s})));tripIds.forEach(syncTopic);toast("בוטל");}catch(e){toast("נכשל");}});
  }catch(e){toast("השמירה נכשלה");}}
document.addEventListener("click",e=>{
  const q=(a)=>e.target.closest("["+a+"]");let b;
  if((b=q("data-act"))){const k=b.dataset.act;if(k.startsWith("open:"))return doAct(k);if(!b.classList.contains("chk")){const c=b.closest(".ac")&&b.closest(".ac").querySelector(".chk");if(c)cancelPend(c.dataset.act);return doAct(k);}togglePend(k,b);return;}

  const tb=e.target.closest("[data-tab]");if(tb){ui.tab=tb.dataset.tab;openId=null;save();render();return;}
  const sb=e.target.closest("[data-st]");if(sb){const id=sb.dataset.id,x=docs.find(d=>d.id===id);if(x&&(x.st||"open")!==sb.dataset.st){x.st=sb.dataset.st;render();setSt([id],sb.dataset.st);}return;}

    const nb=document.querySelector(`[data-open="${CSS.escape(id)}"]`);if(nb){const d=nb.getBoundingClientRect().top-top;if(d)window.scrollBy(0,d);}}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.zone){ui["z_"+d.dataset.zone]=d.open;save();}if(d.dataset&&d.dataset.donefd){ui.doneOpen=d.open;save();}},true);
