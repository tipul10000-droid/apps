<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude · Side Quests</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude SQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="img/voice-icon-180.png">
<link rel="icon" href="img/voice-icon-180.png">
<link rel="manifest" href="voice.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--ink:#fff;--mute:rgba(255,255,255,.62);--acc:#D97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
.mark{width:84px;height:84px;border-radius:24px;background:var(--acc);display:grid;place-items:center;box-shadow:0 8px 30px rgba(217,119,87,.45)}
.mark svg{width:52px;height:52px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
h1{margin:0;font:700 26px/1.2 Rubik,system-ui,sans-serif}
p{margin:0;max-width:320px;color:var(--mute);font-size:16px;line-height:1.45}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:min(320px,100%);height:58px;border-radius:16px;background:var(--acc);color:#fff;font:700 19px/1 Rubik,system-ui,sans-serif;text-decoration:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 6px 20px rgba(217,119,87,.5)}
.go svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go:active{background:#C4643F}
.cp{width:min(320px,100%);height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:700 15px/1 Assistant,system-ui,sans-serif}
.cp.ok{border-color:#3BB273;color:#7CE0A8}
.back{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12.2 10.8 13.5 1.6M12.8 11.1 17.6 6.2M13.2 11.8 21.8 10.3M13.1 12.5 18.7 15.3M12.6 13.1 16.9 21.3M11.8 13.2 10.8 20.4M11.2 12.9 5.4 18.8M10.8 12.2 4.6 13.3M10.9 11.5 3.0 7.6M11.4 10.9 8.2 4.9"/></svg></div>
  <h1>שיחה עם Claude</h1>
  <p>נפתח צ׳אט חדש שקורא את הבריף של Side Quests. לשיחה בקול: ללחוץ שם על כפתור הקול.</p>
  <a class="go" id="go" href="https://claude.ai/new?q=Side%20Quests%20%D7%91%D7%A7%D7%95%D7%9C%3A%20%D7%A2%D7%9D%20%D7%94-Supabase%20connector%20%28%D7%A4%D7%A8%D7%95%D7%99%D7%A7%D7%98%20emgtyfksnofzzlutngbf%29%20%D7%AA%D7%A8%D7%99%D7%A5%3A%20select%20data%20from%20sq_docs%20where%20app%3D%27sidequests%27%20and%20collection%3D%27voice%27%20and%20id%3D%27briefing%27%3B%20%D7%AA%D7%A4%D7%A2%D7%9C%20%D7%9C%D7%A4%D7%99%20rules%20%D7%A9%D7%91%D7%95%2C%20%D7%95%D7%AA%D7%AA%D7%97%D7%99%D7%9C%20%D7%91%D7%91%D7%A8%D7%99%D7%A3%20%D7%A7%D7%A6%D7%A8%20%D7%91%D7%A2%D7%91%D7%A8%D7%99%D7%AA%20%D7%9E%D7%AA%D7%95%D7%9A%20headline%2C%20today%20%D7%95-open%2C%20%D7%9E%D7%95%D7%9B%D7%9F%20%D7%9C%D7%A9%D7%99%D7%97%D7%94%20%D7%A7%D7%95%D7%9C%D7%99%D7%AA." rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>להתחיל שיחה</span></a>
  <button class="cp" id="cp" type="button">להעתיק את משפט הפתיחה</button>
  <a class="back" href="./">Side Quests ›</a>
</main>
<script>
(function(){
  var go=document.getElementById("go"),cp=document.getElementById("cp");
  var q=decodeURIComponent(go.href.split("?q=")[1]||"");
  cp.onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(q):Promise.reject()).then(function(){cp.textContent="✓ הועתק";cp.classList.add("ok");},function(){prompt("להעתיק:",q);});};
  // from the home-screen icon: go straight to the chat
  var sa=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(sa||/[?&]go=1/.test(location.search))location.href=go.href;
})();
</script>
</body>
</html>
