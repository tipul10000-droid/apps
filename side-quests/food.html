<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js?v=1"></script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B8361F">
<script>window.SQ_APP="sidequests";window.SQ_PIN=true;window.FOOD_BUILD="1.2";</script>
<script src="sq-db.js?v=9"></script>
<title>אוכל ומסעדות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800&display=swap">
<style>
/* דשבורד אוכל ומסעדות: מתכונים שראיתי ברשת (לינק למקור, רשימת קניות לסופר ישראלי, מתכון מסודר), ובהמשך מסעדות.
   נתונים: sq_docs (app=sidequests, collection=food): מסמך לכל מתכון/מסעדה + _meta. סימוני "קניתי/יש בבית" נשמרים רק במכשיר. */
:root{
  --bg:#F6F7F2; --surface:#FFFFFF; --sunk:#ECEFE6; --ink:#1E2420; --muted:#5F6B62; --line:#DCE2D6;
  --hero:#B8361F; --hero2:#EE7A3B; --art:url(img/art-food.svg); --mark:#3E9B54; --hero-ink:#FFF6F1; --hero-muted:#FFD3C4; --accent:#FFC857; --accent-ink:#3A2200;
  --good:#2E8A4E; --good-soft:#E1F2E6; --warn:#B4610E; --warn-soft:#FBEAD3; --link:#C2402A; --tomato:#C8452B;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A201C; --sunk:#232A25; --ink:#EEF2EC; --muted:#A3AEA6; --line:#2E3731;
  --hero:#7A2416; --hero2:#A8401F; --hero-ink:#FFF1EA; --hero-muted:#F2B9A6; --accent:#FFC857; --accent-ink:#3A2200;
  --good:#5CC27E; --good-soft:#173022; --warn:#EBA654; --warn-soft:#3A2814; --link:#FF9A7A; --tomato:#EE7A60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A201C; --sunk:#232A25; --ink:#EEF2EC; --muted:#A3AEA6; --line:#2E3731;
  --hero:#7A2416; --hero2:#A8401F; --hero-ink:#FFF1EA; --hero-muted:#F2B9A6; --accent:#FFC857; --accent-ink:#3A2200;
  --good:#5CC27E; --good-soft:#173022; --warn:#EBA654; --warn-soft:#3A2814; --link:#FF9A7A; --tomato:#EE7A60; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700;background:none;border:0;padding:0;cursor:pointer}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14px;margin:0}
.chatbtn{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
/* one frame divided by lines (no frame inside a frame) */
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-display);white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chipsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px}
.chipsel::-webkit-scrollbar{display:none}
.chipsel button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.chipsel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:19px}
.sh small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:24px 12px;line-height:1.6}
/* recipe cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:start;padding:0;color:inherit}
.rcard .img{height:150px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;font-size:56px;position:relative}
.rcard .img .badge{position:absolute;top:8px;inset-inline-start:8px;font-size:12px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 9px}
.rcard .bd{padding:10px 12px 12px}
.rcard .t{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.3}
.rcard .s{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.addcard{border:2px dashed var(--line);border-radius:16px;background:none;min-height:120px;cursor:pointer;font-weight:800;font-size:16px;color:var(--muted);padding:12px}
.addcard small{display:block;font-weight:600;font-size:13px;margin-top:4px}
/* recipe page */
#app{min-height:calc(100vh - 60px)}
.photo{margin:12px 0 4px;border-radius:16px;overflow:hidden;aspect-ratio:3/2;background:rgba(255,255,255,.08) center/cover no-repeat;position:relative}
.photo small{position:absolute;bottom:6px;inset-inline-end:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;padding:1px 8px}
.src{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);color:var(--hero-ink)!important;font-weight:800}
.src small{display:block;color:var(--hero-muted);font-weight:600;font-size:12.5px}
.acts{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.acts button{flex:1;border:0;background:none;padding:10px 4px;font-weight:800;font-size:14.5px;cursor:pointer;white-space:nowrap}
.acts button+button{border-inline-start:1px solid var(--line)}
.acts button.on{background:var(--good-soft);color:var(--good)}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shop li+li{border-top:1px solid var(--line)}
.shop .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;font-weight:900;color:transparent}
.shop li.ok .bx{background:var(--good);border-color:var(--good);color:#fff}
.shop li.ok .it{text-decoration:line-through;opacity:.55}
.shop .it{flex:1;min-width:0;font-size:16.5px;font-weight:700;line-height:1.3}
.shop .it small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.shop .q{flex:none;font-weight:800;color:var(--tomato);font-size:14.5px;max-width:42%;text-align:end}
.aisle{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin:12px 2px 0}
.aisle:first-child{margin-top:0}
.bar2{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:10px}
.bar2 button{flex:1;border:0;background:none;padding:10px 4px;font-weight:800;font-size:14px;cursor:pointer}
.bar2 button+button{border-inline-start:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.meta div{flex:1 1 30%;padding:8px 10px;font-weight:800;font-size:15px;min-width:0}
.meta div span{display:block;color:var(--muted);font-weight:600;font-size:12px}
.meta div+div{border-inline-start:1px solid var(--line)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:16px}
.ing li+li{border-top:1px solid var(--line)}
.ing li b{color:var(--tomato);white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:10px 42px 10px 2px;font-size:16.5px;line-height:1.5;counter-increment:s}
.steps li+li{border-top:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;right:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:900;display:grid;place-items:center;font-family:var(--f-display)}
.tips{margin:0;padding-inline-start:20px}
.tips li{margin:5px 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:14px;line-height:1.45}
.soon{text-align:center;padding:28px 16px}
.soon .ic{font-size:54px}
.soon h3{font-size:20px;margin:8px 0 6px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:92vw}
.toast.on{display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:16px}.hero h1{font-size:22px}}
</style>
<link rel="stylesheet" href="dash-back.css?v=3">
<script>/* opened inside Side Quests (frame) = the app bar has the back button */if(window.self!==window.top)document.documentElement.classList.add("embed");</script>
</head>
<body>
<header class="hero"><div class="in" id="hero"></div></header>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="app"><div class="empty">טוען…</div></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const imgSrc=u=>/^food-img\/[\w.-]+$/.test(u||"")?u:safe(u);
const CHAT_FALLBACK="https://claude.ai/code/project/chan_01W6chmD4NUMHZzo1ehTjzCP?thread=cmsg_01W6chmD4NUMHZzo1ehTjzCPVaxKfpuhZBN5R4bcqVQKvM";
const CATS=[["all","הכול"],["sweet","🍫 מתוקים"],["main","🍲 עיקריות"],["side","🥗 סלטים ותוספות"],["breakfast","🍳 בוקר"],["baking","🥖 מאפים"],["drink","🥤 משקאות"],["other","🍴 אחר"]];
const PLAT={instagram:"אינסטגרם",tiktok:"טיקטוק",youtube:"יוטיוב",facebook:"פייסבוק",web:"אתר"};
let items={},meta={},db=null,loaded=false;
const UI_KEY="sq_food_ui";let ui={sec:"recipes",cat:"all",tab:"shop"};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UI_KEY)||"{}"));}catch(e){}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui));}catch(e){}}
// ticks ("got it") live only on this device
const CK_KEY="sq_food_chk";let chk={};try{chk=JSON.parse(localStorage.getItem(CK_KEY)||"{}");}catch(e){}
function saveChk(){try{localStorage.setItem(CK_KEY,JSON.stringify(chk));}catch(e){}}
const EMB=window.self!==window.top;function goHash(x){if(EMB)location.replace(location.pathname+location.search+"#"+x);else location.hash=x;}
function curId(){const m=location.hash.match(/^#r=(.+)$/);return m?decodeURIComponent(m[1]):null;}
function isCart(){return location.hash==="#cart";}

function list(kind){return Object.entries(items).map(([id,v])=>({id,...v})).filter(x=>!x._deleted&&x.title&&(x.kind||"recipe")===kind)
  .sort((a,b)=>(!!b.fav-!!a.fav)||String(b.created_at||"").localeCompare(String(a.created_at||"")));}
function plat(x){const s=x.source||{};if(s.platform)return s.platform;const u=s.url||"";return /instagram/.test(u)?"instagram":/tiktok/.test(u)?"tiktok":/youtu/.test(u)?"youtube":/facebook|fb\.watch/.test(u)?"facebook":"web";}
function shopOf(x){return (x.shop||[]).map((s,i)=>({...s,key:x.id+":"+i}));}
function leftToBuy(x){return shopOf(x).filter(s=>!chk[s.key]).length;}

// ---------- hero ----------
function heroHome(){const R=list("recipe"),cart=R.filter(x=>x.cart);
  return `<div class="top"><a class="sqhome" href="./"><span class="ar">→</span><img src="icon-192.png?v=2" alt=""><span>Side Quests</span></a><span class="back">${meta.updated?"עודכן "+esc(meta.updated):""}</span></div>
  <h1>🍽️ אוכל ומסעדות</h1><p class="sub">מתכונים שראיתי ברשת, עם רשימת קניות לסופר ומתכון מסודר. ובהמשך גם מסעדות.</p>
  <a class="chatbtn" href="${esc(safe(meta.chat_url)||CHAT_FALLBACK)}" target="_blank" rel="noopener"><span style="font-size:24px">💬</span><span>שלח לינק למתכון או מסעדה<small>רילס, טיקטוק, יוטיוב או אתר. אני מוציא קניות ומתכון</small></span></a>
  <div class="kpis"><div class="kpi"><b>${R.length}</b><span>מתכונים</span></div><div class="kpi"><b>${R.filter(x=>(x.made_count||0)>0).length}</b><span>כבר הכנתי</span></div><div class="kpi"><b>${cart.length}</b><span>ברשימת הקניות</span></div></div>`;}
function heroRecipe(x){const s=x.source||{},u=safe(s.url),im=imgSrc(x.img);
  return `<div class="top"><button class="back" data-home>→ כל המתכונים</button><span class="back">${x.fav?"⭐ מועדף":""}</span></div>
  <h1>${im?"":esc(x.icon||"🍴")+" "}${esc(x.title)}</h1><p class="sub">${esc(x.summary||"")}</p>
  ${im?`<div class="photo" role="img" aria-label="${esc(x.title)}" style="background-image:url('${esc(im)}')">${x.img_note?`<small>${esc(x.img_note)}</small>`:""}</div>`:""}
  ${u?`<a class="src" href="${esc(u)}" target="_blank" rel="noopener"><span style="font-size:22px">▶️</span><span>לסרטון / למקור${s.author?" של "+esc(s.author):""}<small>${esc(PLAT[plat(x)]||"")}${s.label?" · "+esc(s.label):""}</small></span></a>`:""}`;}

// ---------- home ----------
function renderHome(){$("hero").innerHTML=heroHome();
  const secs=[["recipes","🍳 אוכל ומתכונים"],["rest","🍽️ מסעדות"]];
  $("bar").innerHTML=`<div class="seg">${secs.map(([k,l])=>`<button data-sec="${k}" class="${ui.sec===k?"on":""}">${l}</button>`).join("")}</div>`
    +(ui.sec==="recipes"?`<div class="chipsel">${CATS.map(([k,l])=>`<button data-cat="${k}" class="${ui.cat===k?"on":""}">${l}</button>`).join("")}</div>`:"");
  $("app").innerHTML=ui.sec==="rest"?renderRest():renderRecipes();}
function card(x){const img=imgSrc(x.img),t=x.time||{},n=leftToBuy(x);
  return `<button class="rcard" data-open="${esc(x.id)}"><div class="img" ${img?`style="background-image:url('${esc(img)}')"`:""}>${img?"":esc(x.icon||"🍴")}${x.status==="new"?`<span class="badge">⏳ בעבודה</span>`:x.fav?`<span class="badge">⭐</span>`:""}</div><div class="bd">
    <div class="t">${esc(x.title)}</div>
    <div class="s">${[(x.source||{}).author,t.total,x.made_count?"הכנתי ×"+x.made_count:"",x.cart&&n?"🛒 "+n+" לקנות":""].filter(Boolean).map(esc).join(" · ")}</div></div></button>`;}
function renderRecipes(){const R=list("recipe").filter(x=>ui.cat==="all"||x.cat===ui.cat);const cart=list("recipe").filter(x=>x.cart);
  let h="";
  if(cart.length)h+=`<section><button class="chatbtn" data-cart style="width:100%;border:0;cursor:pointer;text-align:start;margin:0"><span style="font-size:24px">🛒</span><span>רשימת קניות משולבת<small>${cart.length} מתכונים: ${esc(cart.map(x=>x.title).join(", "))}</small></span></button></section>`;
  h+=`<section><div class="sh"><h2>המתכונים שלי</h2><small>${R.length}</small></div><div class="grid">${R.map(card).join("")}<button class="addcard" data-add>＋ מתכון מלינק<small>מדביקים לינק, ואני משלים קניות ומתכון</small></button></div></section>`;
  return loaded||R.length?h:`<div class="empty">טוען…</div>`;}
function renderRest(){const L=list("restaurant");
  if(!L.length)return `<div class="card soon"><div class="ic">🍽️</div><h3>מסעדות, בקרוב</h3><div class="muted">שולחים לי מסעדה או לינק מאפליקציית ההמלצות, והיא נכנסת לכאן עם מיקום, סגנון, מחירים ומה כדאי להזמין.</div></div>`;
  return `<div class="grid">${L.map(x=>`<div class="rcard" style="cursor:default"><div class="img">${esc(x.icon||"🍽️")}</div><div class="bd"><div class="t">${esc(x.title)}</div><div class="s">${esc([x.city,x.style,x.price].filter(Boolean).join(" · "))}</div>${safe(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px">לפרטים</a>`:""}</div></div>`).join("")}</div>`;}

// ---------- recipe ----------
function shopList(items2,showFrom){
  const row=s=>`<li class="${chk[s.key]?"ok":""}" data-ck="${esc(s.key)}"><span class="bx">✓</span><span class="it">${esc(s.item)}${s.note||(showFrom&&s.from)?`<small>${esc([s.note,showFrom?s.from:""].filter(Boolean).join(" · "))}</small>`:""}</span><span class="q">${esc(s.qty||"")}</span></li>`;
  const group=arr=>{const by={};arr.forEach(s=>{(by[s.aisle||"שונות"]=by[s.aisle||"שונות"]||[]).push(s);});const ks=Object.keys(by);
    return ks.map(k=>`${ks.length>1?`<div class="aisle">${esc(k)}</div>`:""}<ul class="shop">${by[k].map(row).join("")}</ul>`).join("");};
  // one list: buy or already at home doesn't matter (Oren 6.11.2026)
  return items2.length?`<section><div class="sh"><h2>🛒 רשימת מצרכים</h2><small>${items2.filter(s=>!chk[s.key]).length} נשארו</small></div><div class="card">${group(items2)}</div></section>`:"";}
function shopText(title,arr){const ln=s=>"• "+s.item+(s.qty?" ("+s.qty+")":"");
  return `🛒 ${title}\n\n${arr.map(ln).join("\n")}`;}
function tabShop(x){const s=shopOf(x);if(!s.length)return `<div class="empty">${x.status==="new"?"אני עובד על המתכון הזה. רשימת הקניות תופיע כאן.":"אין עדיין רשימת קניות."}</div>`;
  return shopList(s)+`<div class="bar2"><button data-copy>📋 העתק רשימה</button><button data-clear>↺ נקה סימונים</button></div>`;}
function tabRecipe(x){const t=x.time||{};let h="";
  if(x.accuracy)h+=`<div class="warnbox">${esc(x.accuracy)}</div>`;
  const m=[[t.total,"זמן כולל"],[x.servings,"כמות"],[x.nutrition,"ערך תזונתי"]].filter(a=>a[0]);
  if(m.length)h+=`<div class="meta">${m.map(([v,l])=>`<div><span>${l}</span>${esc(v)}</div>`).join("")}</div>`;
  if((x.ingredients||[]).length)h+=`<section><div class="sh"><h2>🥣 מצרכים</h2></div><div class="card"><ul class="ing">${x.ingredients.map(i=>`<li><span>${esc(i.item)}</span><b>${esc(i.qty||"")}</b></li>`).join("")}</ul></div></section>`;
  if((x.steps||[]).length)h+=`<section><div class="sh"><h2>👨‍🍳 הכנה</h2></div><div class="card"><ol class="steps">${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div></section>`;
  if((x.tips||[]).length)h+=`<section><div class="sh"><h2>💡 טיפים</h2></div><div class="card"><ul class="tips">${x.tips.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div></section>`;
  if((x.links||[]).length)h+=`<section><div class="sh"><h2>🔗 עוד מקורות</h2></div><div class="card">${x.links.filter(l=>safe(l.url)).map(l=>`<div><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></div>`).join("")}</div></section>`;
  return h||`<div class="empty">המתכון בדרך.</div>`;}
function renderRecipe(id){const x={id,...(items[id]||{})};if(!x.title){$("app").innerHTML=`<div class="empty">${loaded?"המתכון לא נמצא":"טוען…"}</div>`;$("bar").innerHTML="";return;}
  $("hero").innerHTML=heroRecipe(x);
  $("bar").innerHTML=`<div class="seg"><button data-tab="shop" class="${ui.tab!=="recipe"?"on":""}">🛒 מצרכים</button><button data-tab="recipe" class="${ui.tab==="recipe"?"on":""}">👨‍🍳 מתכון</button></div>`;
  const acts=`<div class="acts"><button data-tcart class="${x.cart?"on":""}">${x.cart?"✓ ברשימה":"🛒 לרשימה המשולבת"}</button><button data-made>✓ הכנתי${x.made_count?" ("+x.made_count+")":""}</button><button data-fav class="${x.fav?"on":""}">${x.fav?"⭐ מועדף":"☆ מועדף"}</button></div>`;
  $("app").innerHTML=acts+(ui.tab==="recipe"?tabRecipe(x):tabShop(x));}
function cartItems(){return list("recipe").filter(x=>x.cart).flatMap(x=>shopOf(x).map(s=>({...s,from:x.title})));}
function renderCart(){const C=list("recipe").filter(x=>x.cart);
  $("hero").innerHTML=`<div class="top"><button class="back" data-home>→ כל המתכונים</button></div><h1>🛒 רשימת קניות משולבת</h1><p class="sub">${esc(C.map(x=>x.title).join(" · ")||"אין מתכונים ברשימה")}</p>`;
  $("bar").innerHTML="";const s=cartItems();
  $("app").innerHTML=s.length?shopList(s,true)+`<div class="bar2"><button data-copy>📋 העתק רשימה</button><button data-clear>↺ נקה סימונים</button></div><div class="note">מוציאים מתכון מהרשימה מתוך דף המתכון.</div>`:`<div class="empty">אין עדיין מתכונים ברשימה. בדף מתכון לוחצים "🛒 לרשימה המשולבת".</div>`;}

function render(){if(isCart())renderCart();else{const id=curId();if(id)renderRecipe(id);else renderHome();}
  $("foot").innerHTML=`${esc(meta.sources||"")}<br>דשבורד אוכל ${esc(window.FOOD_BUILD)} · סימוני הקניות נשמרים רק במכשיר הזה`;}
let tt;function toast(t){$("toast").textContent=t;$("toast").className="toast on";clearTimeout(tt);tt=setTimeout(()=>$("toast").className="toast",3500);}
async function copy(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy");}catch(e2){}a.remove();return ok;}}
async function upd(id,patch,msg){const prev=JSON.parse(JSON.stringify(items[id]||{}));items[id]=Object.assign({},items[id],patch);const y=scrollY;render();scrollTo(0,y);
  if(!db){toast("אין חיבור, לא נשמר");return;}
  try{await db.collection("food").doc(id).update(patch);toast(msg||"נשמר");}catch(e){items[id]=prev;render();toast("לא נשמר, נסה שוב");}}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0);});
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let b;
  if(b=g("[data-sec]")){ui.sec=b.dataset.sec;saveUi();render();return;}
  if(b=g("[data-cat]")){ui.cat=b.dataset.cat;saveUi();render();return;}
  if(b=g("[data-open]")){ui.tab="shop";goHash("r="+encodeURIComponent(b.dataset.open));return;}
  if(g("[data-cart]")){goHash("cart");return;}
  if(g("[data-home]")){EMB?goHash(""):history.length>1&&(curId()||isCart())?history.back():(location.hash="");return;}
  if(b=g("[data-tab]")){const k=b.dataset.tab,top=b.getBoundingClientRect().top;ui.tab=k;saveUi();render();/* tapped tab stays put */const nb=document.querySelector(`[data-tab="${k}"]`);if(nb)scrollBy(0,nb.getBoundingClientRect().top-top);return;}
  if(b=g("[data-ck]")){const k=b.dataset.ck;if(chk[k])delete chk[k];else chk[k]=1;saveChk();const y=scrollY;render();scrollTo(0,y);return;}
  if(g("[data-copy]")){const id=curId();const t=isCart()?shopText("רשימת קניות",cartItems()):shopText((items[id]||{}).title||"",shopOf({id,...items[id]}));toast(await copy(t)?"הרשימה הועתקה":"לא הצלחתי להעתיק");return;}
  if(g("[data-clear]")){const keys=isCart()?cartItems().map(s=>s.key):shopOf({id:curId(),...items[curId()]}).map(s=>s.key);keys.forEach(k=>delete chk[k]);saveChk();render();toast("הסימונים נוקו");return;}
  const now=new Date().toISOString();
  if(g("[data-tcart]")){const id=curId();upd(id,{cart:!(items[id]||{}).cart,updated_at:now},(items[id]||{}).cart?"הוצא מהרשימה":"נוסף לרשימה המשולבת");return;}
  if(g("[data-fav]")){const id=curId();upd(id,{fav:!(items[id]||{}).fav,updated_at:now});return;}
  if(g("[data-made]")){const id=curId(),x=items[id]||{};upd(id,{made_count:(x.made_count||0)+1,made_at:now,updated_at:now},"בתיאבון! 😋");return;}
  if(g("[data-add]")){const u=(prompt("הדבק לינק למתכון (רילס, טיקטוק, יוטיוב או אתר)")||"").trim();if(!u)return;if(!db){toast("אין חיבור");return;}
    const m=u.match(/https:\/\/\S+/);const url=m?m[0]:"";const id="r"+Date.now().toString(36);
    try{await db.collection("food").doc(id).set({kind:"recipe",title:url?"מתכון חדש":u.slice(0,100),icon:"🍴",cat:ui.cat==="all"?"other":ui.cat,status:"new",source:{url},shop:[],ingredients:[],steps:[],created_at:now,updated_at:now,log:[{at:now,text:"נפתח מהדשבורד"}]});
      const ok=await copy(`מתכון חדש בדשבורד האוכל (id ${id}): ${u}\nתוציא ממנו רשימת מצרכים אחת לסופר ישראלי (עם כמויות, לפי מחלקה), מתכון מסודר ותמונה יפה של המנה (img), ותמלא את הכרטיס.`);
      toast(ok?"נוסף. הבקשה הועתקה, הדבק בשיחה":"נוסף");setTimeout(()=>window.open(safe(meta.chat_url)||CHAT_FALLBACK,"_blank","noopener"),700);goHash("r="+encodeURIComponent(id));}catch(err){toast("לא נשמר");}return;}
});
render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection("food").onSnapshot(s=>{loaded=true;const n={};s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted)return;if(x.id==="_meta")meta=v;else n[x.id]=v;});items=n;render();},()=>{});
});
})();
</script>
</body>
</html>
