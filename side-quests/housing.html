<head>

<style>
/* דשבורד דיור: הדירה במוצקין (שוכר, משכנתא, שווי), האם למכור, והבית השכור בכפר סבא.
   נתונים אישיים: sq_docs (app=sidequests, collection=housing): motzkin, home, _meta. אין כאן נתונים אישיים בקוד. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --sunk:#E6ECE5; --ink:#18211C; --muted:#5A6A60; --line:#D4DED5;
  --hero:#2F5A45; --hero2:#5E9271; --art:url(img/art-housing.svg); --mark:#E9785D; --hero-ink:#F3FAF5; --hero-muted:#C2DECD; --accent:#F08A6E; --accent-ink:#2B0F07;
  --good:#1E8A52; --good-soft:#DFF2E7; --warn:#B26A00; --warn-soft:#FBEBCF; --bad:#C2384A; --bad-soft:#FBE1E4; --link:#2F5BD3;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --sunk:#1F2A24; --ink:#E8F0EB; --muted:#9DB0A5; --line:#2B3832;
  --hero:#1F3D2F; --hero2:#2F5A45; --hero-ink:#EEF7F1; --hero-muted:#A7C9B6; --accent:#F29A80; --accent-ink:#2B0F07;
  --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CAAF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --sunk:#1F2A24; --ink:#E8F0EB; --muted:#9DB0A5; --line:#2B3832;
  --hero:#1F3D2F; --hero2:#2F5A45; --hero-ink:#EEF7F1; --hero-muted:#A7C9B6; --accent:#F29A80; --accent-ink:#2B0F07;
  --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CAAF5; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14px;margin:0}
.chatbtn{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:17.5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3}
.kpis.k2{grid-template-columns:repeat(2,1fr)}
.kpi.nx{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 12px}
.kpi.nx .when{flex:none;min-width:66px;text-align:center;padding-inline-end:12px;border-inline-end:1px solid rgba(255,255,255,.16)}
.kpi.nx .when small{display:block;color:var(--hero-muted);font-size:11.5px;line-height:1.3;white-space:nowrap}
.kpi.nx .when b{overflow:visible;text-overflow:clip}
.kpi.nx .what{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.kpi.nx .who{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:600;margin-bottom:2px}
.kpi.nx .who i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.kpi.nx .who .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kpi.nx .t{display:block}
.kpi.nx .t2{display:block;color:var(--hero-muted);font-size:12.5px;margin-top:1px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-display)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:19px}
.sh small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--sunk);border-radius:12px;padding:8px 10px;min-width:0}
.box span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.box b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.3}
.box.hi{background:var(--good-soft)}
.box.warn{background:var(--warn-soft)}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.issues li{padding:10px 12px;border-radius:12px;background:var(--warn-soft);font-size:14.5px}
.issues li.hi{background:var(--bad-soft)}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;font-weight:600}
.task .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:18px}
.task .t{font-weight:800;font-size:15.5px;line-height:1.3}
.task .s{color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.task .go{margin-inline-start:auto;color:var(--muted);font-size:18px}
table.steps{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.steps td{padding:7px 4px;border-top:1px solid var(--line)}
table.steps tr.now td{background:var(--good-soft);font-weight:800}
table.steps tr.opt td{color:var(--muted)}
table.steps td:last-child{text-align:left}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 22px 14px 0;font-size:14.5px}
.tl li:before{content:"";position:absolute;right:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li:after{content:"";position:absolute;right:9px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.done:before{background:var(--good)}
.tl li.now:before{background:var(--accent);box-shadow:0 0 0 4px rgba(240,138,110,.28)}
.tl li .d{font-weight:800;font-family:var(--f-display);font-size:13.5px;display:block}
.tl li.done{color:var(--muted)}
.q{margin-top:4px}
.qt{font-weight:800;margin-bottom:6px}
.qt small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rng{display:flex;align-items:center;gap:10px;margin:6px 0}
.rng input[type=range]{flex:1;accent-color:var(--accent);height:30px}
.rng b{font-family:var(--f-display);font-size:18px;min-width:104px;text-align:center}
.calc{list-style:none;margin:10px 0 0;padding:0;font-size:14.5px}
.calc li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.calc li.tot{font-weight:800;font-size:16px}
.calc li .neg{color:var(--bad)}
.inrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.inrow input{width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.more{display:none;margin-top:8px}
.more.on{display:block}
.check{margin:0;padding-inline-start:20px}
.check li{margin:5px 0;font-size:14.5px}
.links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-size:14.5px}
.bal{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex;margin:8px 0 4px}
.bal i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
svg.chart{width:100%;height:auto;display:block;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:20px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:17px}.box b{font-size:15.5px}.box span{font-size:12px}.grid3{gap:6px}.box{padding:7px 8px}}
</style>

<body>
<header class="hero"><div class="in">
  <div class="top"><a class="sqhome" href="./"><span class="ar">→</span><img src="icon-192.png?v=2" alt=""><span>Side Quests</span></a><span class="back" id="upd"></span></div>
  <h1>🏠 דיור</h1>
  <a class="chatbtn" id="chat" target="_blank" rel="noopener"><span>💬</span><span>צ׳אט</span></a>
  <div class="kpis k2">
    <div class="kpi"><b id="k-eq">…</b><span>ההון שלנו בדירה</span></div>
    <div class="kpi"><b id="k-net">…</b><span>נטו בחודש מהשכירות</span></div>
    <div class="kpi nx"><div class="when"><small>הבא בתור</small><b id="k-next">…</b><small id="k-next-in"></small></div><div class="what"><div class="who" id="k-next-who"></div><div class="t" id="k-next-l">…</div><div class="t2" id="k-next-2"></div></div></div>
  </div>

  <div class="bar"><div class="tabs" id="tabs">
    <button class="tab on" data-tab="motz">🏢 מוצקין</button>

    <button class="tab" data-tab="home">🏠 הבית שלנו</button>
  </div></div>

</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const CHAT_FALLBACK="https://claude.ai/code/project/chan_01BSiCy73LfhTPuMwCS8XKQD?thread=cmsg_01BSiCy73LfhTPuMwCS8XKQDBuxeyzjiW5Y5xcXGN4R4Qd";
const DEPOSIT_RATE=3.5; // ריבית פיקדון שנתית להשוואה גסה
let M={},H={},meta={},topics=[],db=null,loaded=false;
const UI_KEY="sq_housing_ui";let ui={tab:"motz",price:0,open:null};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UI_KEY)||"{}"));}catch(e){}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui));}catch(e){}}

// ---------- helpers ----------
const ils=v=>"₪"+Math.round(v).toLocaleString("he-IL");
const kk=v=>{const a=Math.abs(v);return (v<0?"-":"")+"₪"+(a>=1e6?(Math.round(a/1e4)/100).toLocaleString("he-IL")+"M":a>=1000?Math.round(a/1000)+"K":Math.round(a));};
function today(){const d=new Date();d.setHours(12,0,0,0);return d;}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseD(s){if(!s)return null;const p=String(s).split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1,12);}
function daysTo(s){const d=parseD(s);return d?Math.round((d-today())/86400000):null;}
function inDays(n){return n==null?"":n<0?"⚠️ באיחור":n===0?"היום":n===1?"מחר":"בעוד "+n+" ימים";}
function dm(s){const d=parseD(s);return d?`${d.getDate()}.${d.getMonth()+1}.${String(d.getFullYear()).slice(2)}`:"";}
function my(s){const d=parseD(s);return d?`${d.getMonth()+1}.${d.getFullYear()}`:"";}
function until(s){const n=daysTo(s);if(n==null)return "";if(n<0)return "עבר";if(n<45)return "בעוד "+n+" ימים";const m=Math.round(n/30.4);return m<24?"בעוד "+m+" חודשים":"בעוד "+(Math.round(m/12*10)/10)+" שנים";}
function stepNow(steps){const t=ds(today());let cur=null;(steps||[]).forEach(s=>{if(s.from<=t)cur=s;});return cur||(steps||[])[0]||null;}
function rentNow(){const t=M.tenant||{};const s=stepNow((t.steps||[]).filter(x=>!x.opt));return s?+s.rent:+t.rent||0;}
function homeRent(){const s=stepNow(H.steps);return s?+s.rent:0;}
function mort(){return M.mortgage||{};}
function est(){return +((M.val||{}).est)||0;}
function costs(){return Object.assign({broker_pct:1.5,lawyer_pct:0.5,prepay:20000},meta.costs||{});}
function saleCalc(price){const c=costs(),bal=+mort().balance||0;
  const broker=price*(+c.broker_pct||0)/100, lawyer=price*(+c.lawyer_pct||0)/100*1.18, prepay=+c.prepay||0;
  const hand=price-bal-broker-lawyer-prepay;return {bal,broker,lawyer,prepay,hand};}
function nextEvent(){const tl=(meta.timeline||[]).filter(x=>!x.done&&!x.now&&daysTo(x.d)>=0).sort((a,b)=>a.d<b.d?-1:1);return tl[0]||null;}
function openTasks(){return topics.filter(t=>t.status!=="done"&&t.status!=="archived"&&!t.merged_into);}

// ---------- tasks (from the Side Quests app) ----------
function tasksBlock(){const ts=openTasks();if(!ts.length)return "";
  const icon=t=>t.icon||(t.kind==="admin"?"📋":t.kind==="research"?"🧭":"📌");
  return `<section><div class="sh"><h2>📌 משימות</h2><small>${ts.length} פתוחות · נפתחות באפליקציה</small></div><div class="tasks">${ts.map(t=>{
    const st=t.waiting_for||t.stand||t.next_step||"";const steps=Array.isArray(t.steps)?t.steps:[];const dn=steps.filter(s=>s.done).length;
    return `<a class="task" href="./#t=${encodeURIComponent(t.id)}"><span class="ic">${esc(icon(t))}</span><span style="min-width:0"><span class="t">${esc(t.title)}</span>${st?`<span class="s" style="display:block">${esc(st)}</span>`:""}${steps.length?`<span class="s" style="display:block">שלבים: ${dn}/${steps.length}</span>`:""}</span><span class="go">‹</span></a>`;}).join("")}</div></section>`;}

// ---------- tab: Motzkin ----------
function valChart(){const pts=((M.val||{}).hist||[]).filter(x=>x.d&&+x.v).sort((a,b)=>a.d<b.d?-1:1);if(pts.length<2)return "";
  const W=320,Hh=120,p=28,xs=pts.map(x=>parseD(x.d).getTime()),ys=pts.map(x=>+x.v),bought=+((M.bought||{}).paid)||0;
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,bought)*0.95,y1=Math.max(...ys)*1.03;
  const X=t=>W-p-(t-x0)/(x1-x0||1)*(W-2*p),Y=v=>Hh-p-(v-y0)/(y1-y0||1)*(Hh-2*p);
  const path=pts.map((q,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+","+Y(ys[i]).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="שווי הדירה לאורך השנים">
    ${bought?`<line x1="${p}" x2="${W-p}" y1="${Y(bought).toFixed(1)}" y2="${Y(bought).toFixed(1)}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 4"/><text x="${W/2}" y="${(Y(bought)+12).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">שילמנו ${kk(bought)}</text>`:""}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((q,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="4" fill="var(--accent)"/><text x="${X(xs[i]).toFixed(1)}" y="${(Y(ys[i])-8).toFixed(1)}" font-size="10" text-anchor="middle" fill="currentColor">${kk(ys[i])}</text><text x="${X(xs[i]).toFixed(1)}" y="${Hh-2}" font-size="9.5" text-anchor="middle" fill="currentColor" opacity=".6">${parseD(q.d).getFullYear()}</text>`).join("")}
  </svg>`;}
// ---------- mortgage history ----------
function mParse(m){return parseD(m.length===7?m+"-10":m);}
function yearTicks(x0,x1,X,Hh){let o="";for(let y=new Date(x0).getFullYear()+1;y<=new Date(x1).getFullYear();y++){const t=new Date(y,0,1,12).getTime();o+=`<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="14" y2="${Hh-16}" stroke="currentColor" stroke-opacity=".08"/><text x="${X(t).toFixed(1)}" y="${Hh-3}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".55">${String(y).slice(2)}'</text>`;}return o;}
function payChart(){const m=mort(),pts=(m.pay_hist||[]).filter(x=>x.m&&+x.v).sort((a,b)=>a.m<b.m?-1:1);if(pts.length<3)return "";
  const rf=m.refi||{},W=340,Hh=150,p=30,xs=pts.map(x=>mParse(x.m).getTime()),ys=pts.map(x=>+x.v),rt=rf.d?parseD(rf.d).getTime():null;
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=0,y1=Math.max(...ys)*1.12;
  const X=t=>W-p+8-(t-x0)/(x1-x0||1)*(W-2*p),Y=v=>Hh-18-(v-y0)/(y1-y0||1)*(Hh-36);
  const gaps=(m.pay_gaps||[]);let segs=[],cur=[];pts.forEach((q,i)=>{if(i&&gaps.some(g=>pts[i-1].m<g.from&&q.m>g.to)){segs.push(cur);cur=[];}cur.push(i);});segs.push(cur);

    <div style="font-weight:800;font-size:17px">${esc(H.addr||"")}</div>
    <div class="grid3" style="margin-top:8px"><div class="box"><span>שכירות היום</span><b class="num">${ils(rent)}</b></div><div class="box"><span>החוזה עד</span><b>${esc(dm(H.end))}</b></div><div class="box"><span>נשאר</span><b>${esc(until(H.end).replace("בעוד ",""))}</b></div></div>
    <table class="steps">${(H.steps||[]).map(s=>`<tr class="${cur&&s.from===cur.from?"now":""}"><td>${esc(my(s.from))} · ${esc(s.l||"")}</td><td class="num">${ils(+s.rent)}</td></tr>`).join("")}</table>
    <div class="note">${esc(H.checks_note||"")}. ועד בית ${ils(+H.vaad||0)} (מ-2023). ביטוח ${esc(ins.co||"")} ${esc(ins.kind||"")}, ${ils(+ins.annual||0)} בשנה.</div></div></section>`;
  h+=`<section><div class="sh"><h2>💸 כמה עולה לנו לגור</h2><small>בחודש</small></div><div class="card">
    <div class="grid3"><div class="box"><span>שכירות כאן</span><b class="num">${ils(rent)}</b></div><div class="box hi"><span>פחות הנטו ממוצקין</span><b class="num">${ils(net)}</b></div><div class="box"><span>בפועל</span><b class="num">${ils(rent-net)}</b></div></div>
    <div class="note">בשנה: ${ils(rent*12)} שכירות. החוזה נגמר ב-${esc(dm(H.end))}, שנה לפני סוף האופציה של השוכר במוצקין (${esc(dm((M.tenant||{}).option_end))}).</div></div></section>`;
  h+=`<section><div class="sh"><h2>🧭 איפה גרנו</h2></div><div class="card"><ul class="tl">${[...(H.hist||[]),{y:"2016",l:"קנינו את הדירה במוצקין (בהגרלה; מושכרת מאז 2020)",own:1}].sort((a,b)=>a.y<b.y?-1:a.y>b.y?1:(a.own?1:-1)).map((x,i,a)=>`<li class="${i===a.length-1?"now":"done"}"><span class="d">${esc(x.y)}${x.own?" · 🏢":""}</span>${esc(x.l)}</li>`).join("")}</ul></div></section>`;
  return tasksBlock()+h;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
  $("chat").href=safe(meta.chat_url)||CHAT_FALLBACK;
  if(meta.updated)$("upd").textContent="עודכן "+meta.updated;
  if(!M.name){$("app").innerHTML=`<div class="empty">${loaded?"אין עדיין נתונים":"טוען…"}</div>`;return;}
  const E=est(),bal=+mort().balance||0,net=rentNow()-(+mort().monthly||0),nx=nextEvent();
  $("k-eq").textContent=kk(E-bal);$("k-net").textContent=ils(net);
  $("k-next").textContent=nx?dm(nx.d):"-";$("k-next-in").textContent=nx?inDays(daysTo(nx.d)):"";$("k-next-l").textContent=nx?nx.t:"אין אירוע קרוב";
  $("app").innerHTML=ui.tab==="sell"?renderSell():ui.tab==="home"?renderHome():renderMotz();
  $("foot").innerHTML=`${meta.sources?`<details class="more"><summary>מקורות</summary><div>${esc(meta.sources)}</div></details>`:""}דיור ${esc(window.HOUSING_BUILD)}`;
}
let tt;function toast(t){$("toast").textContent=t;$("toast").className="toast on";clearTimeout(tt);tt=setTimeout(()=>$("toast").className="toast",3500);}
async function upd(id,patch,msg){const tgt=id==="_meta"?meta:id==="home"?H:M;const prev=JSON.parse(JSON.stringify(tgt));Object.assign(tgt,patch);const y=scrollY;render();scrollTo(0,y);
  if(!db){toast("אין חיבור, לא נשמר");return;}
  try{await db.collection("housing").doc(id).update(patch);toast(msg||"נשמר");}catch(e){Object.assign(tgt,prev);render();toast("לא נשמר, נסה שוב");}}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="price"){ui.price=+t.value;saveUi();$("pv").textContent=kk(ui.price);$("calc").innerHTML=calcRows(ui.price);
  const c=saleCalc(ui.price),el=$("cmp-sell");if(el)el.textContent=ils(c.hand*DEPOSIT_RATE/100/12);}});
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b;
  if(b=g(".tab")){ui.tab=b.dataset.tab;saveUi();render();scrollTo(0,0);return;}
  if(b=g("[data-open]")){ui.open=ui.open===b.dataset.open?null:b.dataset.open;saveUi();const y=scrollY;render();scrollTo(0,y);return;}
  if(b=g("[data-dir]")){upd("_meta",{ans:{...(meta.ans||{}),direction:b.dataset.dir,direction_at:new Date().toISOString()}},"נשמר");return;}
  if(b=g("[data-save]")){const k2=b.dataset.save;
    if(k2==="val"){const v=+String($("val-in").value).replace(/[^\d]/g,"");if(!(v>=800000&&v<=5000000)){toast("הקלד שווי בשקלים, למשל 2100000");return;}
      const val=M.val||{},d=ds(today());ui.open=null;saveUi();upd("motzkin",{val:{...val,est:v,as_of:d,src:"עודכן ידנית ב-"+dm(d),hist:[...(val.hist||[]).filter(x=>x.d!==d),{d,v,src:"עודכן ידנית"}]}},"השווי עודכן");return;}
    if(k2==="costs"){const n=id=>{const x=parseFloat(String($(id).value).replace(/[^\d.]/g,""));return isNaN(x)?0:x;};
      upd("_meta",{costs:{broker_pct:n("c-broker"),lawyer_pct:n("c-lawyer"),prepay:n("c-prepay")}},"העלויות נשמרו");return;}}
});
render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection("housing").onSnapshot(s=>{loaded=true;s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted)return;if(x.id==="_meta")meta=v;else if(x.id==="motzkin")M=v;else if(x.id==="home")H=v;});render();},()=>{});
  db.collection("topics").onSnapshot(s=>{topics=s.docs.map(x=>({id:x.id,...x.data()})).filter(t=>!t._deleted&&t.dash==="housing");render();},()=>{});
});
})();
</script>
</body>
</html>
