<style>
/* דשבורד רכבים: הרכבים שלנו (שווי, ירידת ערך, תאריכים, ק"מ) + תומך החלטה לרכב חדש.
   נתונים אישיים: sq_docs (app=sidequests, collection=cars): מסמך לכל רכב + _meta. מחקר שוק ציבורי: cars-market.js */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E7EBF1; --ink:#141B26; --muted:#5B6678; --line:#D5DBE5;
  --hero:#16233A; --hero2:#2B4F86; --art:url(img/art-cars.svg); --hero-ink:#F1F5FB; --hero-muted:#A5B3C9; --accent:#F2A33A; --accent-ink:#22160A;
  --kia:#1F8A84; --ford:#7357C2; --good:#1E8A52; --good-soft:#DFF2E7; --warn:#B26A00; --warn-soft:#FBEBCF; --bad:#C2384A; --bad-soft:#FBE1E4;
  --link:#2F5BD3;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --sunk:#1E2734; --ink:#E8EDF5; --muted:#9AA7BB; --line:#2A3443;
  --hero:#111B2C; --hero2:#1E3558; --hero-ink:#EEF3FA; --hero-muted:#93A3BC; --accent:#F4B154; --accent-ink:#22160A;
  --kia:#42B8B0; --ford:#9C85E6; --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CAAF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --sunk:#1E2734; --ink:#E8EDF5; --muted:#9AA7BB; --line:#2A3443;
  --hero:#111B2C; --hero2:#1E3558; --hero-ink:#EEF3FA; --hero-muted:#93A3BC; --accent:#F4B154; --accent-ink:#22160A;
  --kia:#42B8B0; --ford:#9C85E6; --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CAAF5; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14px;margin:0}
.chatbtn{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:17.5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3}
.kpis.k2{grid-template-columns:repeat(2,1fr)}
.kpi.nx{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 12px}
.kpi.nx .when{flex:none;min-width:66px;text-align:center;padding-inline-end:12px;border-inline-end:1px solid rgba(255,255,255,.16)}
.kpi.nx .when small{display:block;color:var(--hero-muted);font-size:11.5px;line-height:1.3;white-space:nowrap}
.kpi.nx .when b{overflow:visible;text-overflow:clip}
.kpi.nx .what{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.kpi.nx .who{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:600;margin-bottom:2px}
.kpi.nx .who i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.kpi.nx .who .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kpi.nx .t{display:block}
.kpi.nx .t2{display:block;color:var(--hero-muted);font-size:12.5px;margin-top:1px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-display)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:19px}
.sh small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* time slider */
.tl{display:flex;align-items:center;gap:10px}
.tl input[type=range]{flex:1;accent-color:var(--accent);height:30px}
.tl .when{font-family:var(--f-display);font-weight:800;font-size:17px;min-width:96px;text-align:center}
.marks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 2px}
.marks button{border:0;background:none;padding:4px 2px;color:inherit;cursor:pointer;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sum div{background:var(--sunk);border-radius:12px;padding:8px 10px}
.sum b{display:block;font-family:var(--f-display);font-size:18px}
.sum span{font-size:12.5px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
/* car card */
.car{padding:0;overflow:hidden;border-top:5px solid var(--cc,#888)}
.car .ph{position:relative;aspect-ratio:16/8;background:var(--sunk) center/cover no-repeat}
.car .ph .tag{position:absolute;bottom:8px;right:8px;background:rgba(10,14,20,.72);color:#fff;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.car .bd{padding:12px 14px 14px}
.car h3{font-size:21px}
.chipsr{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.chipsr span{font-size:12.5px;font-weight:700;background:var(--sunk);padding:2px 8px;border-radius:999px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.val{border:1px solid var(--line);border-radius:12px;padding:8px 8px}
.val.w{border-color:var(--cc);border-width:2px}
.val b{display:block;font-family:var(--f-display);font-size:17px}
.val span{font-size:12px;color:var(--muted);display:block;line-height:1.25}
.val em{font-style:normal;font-size:12px;font-weight:700}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dt{border-radius:12px;padding:7px 9px;background:var(--sunk);min-width:0}
.dt b{display:block;font-size:15px;font-family:var(--f-display)}
.dt span{display:block;font-size:12px;color:var(--muted)}
.dt.ok{background:var(--good-soft)} .dt.soon{background:var(--warn-soft)} .dt.bad{background:var(--bad-soft)}
.dt.bad b{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px;flex-wrap:wrap}
.row .k{flex:none;width:86px;color:var(--muted);font-weight:700;font-size:13.5px}
.row .v{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700;cursor:pointer}
.mini.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edit{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.edit.on{display:flex}
.edit input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;width:120px}
.iss{margin:8px 0 0;padding-inline-start:18px;font-size:14px}
.iss li{margin:3px 0}
.iss .hi{color:var(--bad);font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;background:var(--sunk);padding:4px 10px;border-radius:999px;color:var(--ink)}
.q{border-top:1px solid var(--line);padding:9px 0}
.q:first-child{border-top:0;padding-top:2px}
.q .qt{font-weight:700;font-size:15px;margin-bottom:6px}
.q .qt small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.task{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{font-weight:700;line-height:1.3}
.task .s{color:var(--muted);font-size:13.5px}
/* decision */
.ctrl{display:grid;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.wt{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:14px}
.wt input{accent-color:var(--accent)}
.lead{background:linear-gradient(135deg,var(--hero),#24406B);color:var(--hero-ink);border:0}
.lead .lbl{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--accent)}
.lead h3{font-size:22px;margin:2px 0}
.lead p{margin:6px 0 0;color:var(--hero-muted);font-size:14.5px}
.opt-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right}
.opt-row:first-child{border-top:0}
.opt-row .rk{font-family:var(--f-display);font-weight:800;color:var(--muted);text-align:center}
.opt-row .nm{font-weight:800;line-height:1.25}
.opt-row .nm small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.opt-row .sc{text-align:left;min-width:86px}
.opt-row .sc b{font-family:var(--f-display);font-size:17px;display:block}
.opt-row .sc span{font-size:12px;color:var(--muted)}
.fuel{font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-inline-start:4px;vertical-align:1px;background:var(--sunk)}
.f-EV{background:#DDF3E6;color:#13663B} .f-PHEV{background:#E1EBFC;color:#244FA8} .f-HEV{background:#E9E4FA;color:#5232A8} .f-ICE{background:#EFEFEF;color:#555}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-EV{background:#163024;color:#7FD9A6}:root:not([data-theme="light"]) .f-PHEV{background:#1A2A4A;color:#9CB8F5}:root:not([data-theme="light"]) .f-HEV{background:#261F45;color:#B9A6F2}:root:not([data-theme="light"]) .f-ICE{background:#2A2F38;color:#BBB}}
.sbar{height:6px;border-radius:3px;background:var(--sunk);margin-top:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.orow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}.orow .opt-row{border-top:0}
.orow.off .opt-row{opacity:.45}
.inc{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap;min-height:32px}
.inc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rv h4{margin:10px 0 4px;font-size:15px}.rv ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px}.rv p{margin:6px 0;font-size:14.5px}
.rv .gen{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:8px}
.rv .chk{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.det{background:var(--sunk);border-radius:14px;padding:12px;margin:2px 0 10px}
.det img{width:100%;border-radius:10px;display:block;margin-bottom:8px;aspect-ratio:16/9;object-fit:cover}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.pc ul{margin:4px 0 0;padding-inline-start:16px}
.pc h4{margin:0;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:12.5px;margin:10px 0}
.fin{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.fin table{width:100%;border-collapse:collapse;font-size:12.5px}
.fin th,.fin td{white-space:nowrap;padding:5px 3px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
.fin th{font-weight:700;color:var(--muted);font-size:12.5px}
.fin tr.best td{background:var(--good-soft)}
.fin td b{font-family:var(--f-display)}
.note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.exp{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:20px}
.exp .w{font-weight:800}
.exp .p{font-size:13px;margin-top:3px}
.check li{margin:4px 0}
.empty{color:var(--muted);text-align:center;padding:20px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:17px}.val b{font-size:17px}.pc{grid-template-columns:1fr}.dt b{font-size:14px}}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const M=window.CARS_MARKET||{options:[],experts:[],energy:{fuel:7.3,kwh:.64},rates:{loan:7.5,dealer:5.9,deposit:3.5,lease_discount:12,lease_margin:6.5}};
const CHAT_FALLBACK="https://claude.ai/code/project/chan_01BSiCy73LfhTPuMwCS8XKQD?thread=cmsg_01BSiCy73LfhTPuMwCS8XKQDEbG74ydUeN96CFiXcu5JbH";
const NORM_KM_MONTH=1250; // ממוצע שהמחירונים מניחים (~15 אלף בשנה)
let cars=[],meta={},topics=[],db=null;
// per-viewer UI state (sq_ prefix)
const UI_KEY="sq_cars_ui";let ui={tab:"mine",m:0,kind:"all",seven:false,budget:400000,open:null,trim:{},path:"loan",years:4,kmY:18000,sellKia:true,sellFord:true,buyIn:0,excl:{},rev:null,
  w:{space:25,comfort:20,rel:20,resale:10,cost:15,tech:10}};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UI_KEY)||"{}"));}catch(e){}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui));}catch(e){}}

// ---------- helpers ----------
const ils=v=>"₪"+Math.round(v).toLocaleString("he-IL");
const k=v=>Math.abs(v)>=1000?(Math.round(v/100)/10).toLocaleString("he-IL")+"K":Math.round(v)+"";
const ilsK=v=>"₪"+k(v);
function today(){const d=new Date();d.setHours(12,0,0,0);return d;}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseD(s){if(!s)return null;const p=String(s).split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||15,12);}
function monthsBetween(a,b){return (b-a)/(1000*60*60*24*30.4375);}
function daysTo(s){const d=parseD(s);return d?Math.round((d-today())/86400000):null;}
function inDays(n){return n==null?"":n<0?"⚠️ באיחור":n===0?"היום":n===1?"מחר":"בעוד "+n+" ימים";}
function dm(s){const d=parseD(s);return d?`${d.getDate()}.${d.getMonth()+1}.${String(d.getFullYear()).slice(2)}`:"";}
function addMonths(d,m){const x=new Date(d);x.setMonth(x.getMonth()+Math.floor(m));x.setDate(x.getDate()+Math.round((m%1)*30));return x;}
function whenTxt(m){if(m===0)return "היום";if(m<12)return m===1?"עוד חודש":"עוד "+m+" חודשים";const y=m/12;return "עוד "+(y===1?"שנה":y===2?"שנתיים":(Math.round(y*10)/10)+" שנים");}
function monthName(d){return ["ינו׳","פבר׳","מרץ","אפר׳","מאי","יוני","יולי","אוג׳","ספט׳","אוק׳","נוב׳","דצמ׳"][d.getMonth()]+" "+String(d.getFullYear()).slice(2);}

// ---------- km ----------
function logs(c){return (c.km_log||[]).filter(x=>x&&x.d&&x.km).sort((a,b)=>a.d<b.d?-1:1);}
function lastLog(c){const l=logs(c);return l[l.length-1]||null;}
// קצב חודשי: ידני אם נקבע, אחרת לפי השימוש בפועל (בין שתי קריאות, או מהעלייה לכביש עד הקריאה האחרונה)
function kmMonth(c){if(+c.km_month_manual)return +c.km_month_manual;const l=logs(c);
  if(l.length>=2){const a=l[l.length-2],b=l[l.length-1],mo=monthsBetween(parseD(a.d),parseD(b.d));if(mo>=3&&b.km>a.km)return (b.km-a.km)/mo;}
  if(l.length){const b=l[l.length-1],mo=monthsBetween(parseD(c.on_road),parseD(b.d));if(mo>6)return b.km/mo;}
  return +c.km_month||NORM_KM_MONTH;}
function kmAt(c,mFromNow){const now=today();const L=lastLog(c);
  if(L)return Math.max(+L.km,+L.km+kmMonth(c)*(monthsBetween(parseD(L.d),now)+mFromNow));
  return kmMonth(c)*(monthsBetween(parseD(c.on_road),now)+mFromNow);}
function normKmAt(c,mFromNow){return NORM_KM_MONTH*(monthsBetween(parseD(c.on_road),today())+mFromNow);}

// ---------- value model ----------
const ADJ={ // [יד2, לוי יצחק] as fractions
  hand:{1:[.06,.02],2:[0,-.02],3:[-.05,-.05],4:[-.09,-.08]},
  origin:{private:[0,0],leasing:[-.06,-.08],rental:[-.10,-.12],unknown:[0,0]},
  accidents:{none:[0,0],minor:[-.05,-.05],major:[-.18,-.18]},
  service:{agency:[.03,0],garage:[0,0],irregular:[-.05,-.02]},
  mech:{great:[.02,0],ok:[0,0],issues:[-.08,-.04]},
  cosmetic:{like_new:[.03,0],normal:[0,0],scratches:[-.04,-.01]},
  tires:{new:[.01,0],ok:[0,0],replace:[-.02,0]}
};
const ROUTE={private:{l:"מכירה פרטית",f:0},dealer:{l:"מכירה לסוחר",f:-.09},tradein:{l:"טרייד-אין אצל היבואן",f:-.12}};
function licenseBad(c){const d=daysTo(c.dates&&c.dates.license);return d!=null&&d<0;}
function adjFor(c,src,m){const i=src==="levi"?1:0,a=c.ans||{},out=[];
  const push=(lbl,v)=>{if(v)out.push([lbl,v]);};
  const km=kmAt(c,m),norm=normKmAt(c,m),per10=src==="levi"?.015:.02;
  push("ק״מ "+(km>norm?"מעל":"מתחת")+" לממוצע",Math.max(-.25,Math.min(.15,-(km-norm)/10000*per10)));
  const h=ADJ.hand[Math.min(4,+c.hand||2)];push("יד "+(c.hand||2),h?h[i]:0);
  for(const key of ["origin","accidents","service","mech","cosmetic","tires"]){const v=a[key];if(v&&ADJ[key][v])push(QL[key]+": "+(QO[key].find(o=>o[0]===v)||[,v])[1],ADJ[key][v][i]);}
  return out;}
function baseAt(c,src,m){const v=c.val||{},b=+(src==="levi"?v.levi:v.yad2)||0,dep=c.dep||{},r=(+dep.r||10)/100,fl=+dep.floor||10000;
  // מחירון של היום ← ירידה שנתית עד רצפה (ערך גרוטאה/מסחר)
  return fl+(b-fl)*Math.pow(1-r,m/12);}
function valueOf(c,src,m,weighted){const b=baseAt(c,src,m);if(!weighted)return b;const s=adjFor(c,src,m).reduce((t,x)=>t+x[1],0);return Math.max(+((c.dep||{}).floor)||8000,b*(1+s));}
function marketAt(c,m){const mk=(c.val||{}).market;if(!mk||!+mk.v)return 0;const b0=baseAt(c,"yad2",0);return b0?+mk.v*baseAt(c,"yad2",m)/b0:+mk.v;}
function central(c,m){const w=valueOf(c,"yad2",m,true),mk=marketAt(c,m);return mk?(w+mk)/2:w;}
function routeF(){return (ROUTE[(meta.ans||{}).route]||ROUTE.private).f;}
function inHand(c,m){return central(c,m)*(1+routeF());}

// ---------- questions (weighting) ----------
const QL={origin:"מקור",accidents:"תאונות",service:"טיפולים",mech:"מצב מכני",cosmetic:"מראה",tires:"צמיגים"};
const QO={
  origin:[["private","פרטי מההתחלה"],["leasing","היה ליסינג/חברה"],["rental","היה השכרה"],["unknown","לא יודע"]],
  accidents:[["none","בלי תאונות"],["minor","פח קל / שריטות"],["major","תאונה עם נזק שלדה"]],
  service:[["agency","כל הטיפולים ביבואן"],["garage","מוסך קבוע, בזמן"],["irregular","לא תמיד בזמן"]],
  mech:[["great","מצוין"],["ok","תקין, בלי בעיות"],["issues","יש תקלה ידועה"]],
  cosmetic:[["like_new","כמו חדש"],["normal","בלאי רגיל"],["scratches","שריטות/מכות"]],
  tires:[["new","חדשים"],["ok","בסדר"],["replace","צריך להחליף"]]
};
const QT={origin:"מאיפה הרכב הגיע לפני שקנית?",accidents:"היו תאונות?",service:"איפה עשו את הטיפולים?",mech:"איך הוא מבחינה מכנית?",cosmetic:"איך הוא נראה?",tires:"מה מצב הצמיגים?"};
const QH={origin:"ליסינג או השכרה מורידים 6-12% במחירון",accidents:"נזק שלדה מוריד עד 18%",service:"ספר טיפולים ביבואן מעלה מחיר ביד2",mech:"",cosmetic:"",tires:""};

function dateBox(lbl,s,note){const d=daysTo(s);const cls=d==null?"":d<0?"bad":d<=45?"soon":"ok";
  const rel=d==null?"לא ידוע":d<0?"פג לפני "+(-d)+" ימים":d===0?"היום":d<=60?"בעוד "+d+" ימים":"עד "+dm(s);
  return `<div class="dt ${cls}"><span>${esc(lbl)}</span><b>${d==null?"?":esc(dm(s))}</b><span>${esc(note||rel)}</span></div>`;}
function nextService(c){const s=c.service||{};if(!s.d)return null;const d=addMonths(parseD(s.d),12);const kmLeft=s.km?(+s.km+15000)-kmAt(c,0):null;
  let byKm=null;if(kmLeft!=null){byKm=addMonths(today(),Math.max(0,kmLeft/kmMonth(c)));}
  return ds(byKm&&byKm<d?byKm:d);}

function questionsFor(c){const a=c.ans||{};
  const keys=Object.keys(QO).filter(k2=>!(k2==="origin"&&c.bought_new));
  const open=keys.filter(k2=>!a[k2]);
  return `<div class="card" style="border-top:4px solid ${esc(c.color_css||"#888")}"><div class="sh" style="margin:0 0 4px"><h3 style="font-size:16px">${esc(c.emoji)} ${esc(c.name)}</h3><small>${open.length?open.length+" פתוחות":"הכל נענה ✓"}</small></div>
    ${keys.map(k2=>`<div class="q"><div class="qt">${esc(QT[k2])}${QH[k2]?`<small>${esc(QH[k2])}</small>`:""}</div><div class="opts">${QO[k2].map(([v,l])=>`<button class="opt${a[k2]===v?" on":""}" data-ans="${esc(c.id)}|${k2}|${v}">${esc(l)}</button>`).join("")}</div></div>`).join("")}
  </div>`;}
function chart(){
  const W=380,H=210,P={l:44,r:10,t:12,b:24},N=36;
  const ser=cars.map(c=>({c,pts:Array.from({length:N+1},(_,i)=>central(c,i))}));
  const tot=Array.from({length:N+1},(_,i)=>ser.reduce((s,x)=>s+x.pts[i],0));
  const all=ser.flatMap(x=>x.pts),max=Math.max(...tot)*1.04,min=Math.max(0,Math.min(...all)*.75);
  const X=i=>W-P.r-(i/N)*(W-P.l-P.r); // RTL: time flows right→left
  const Y=v=>P.t+(1-(v-min)/(max-min))*(H-P.t-P.b);
  const path=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const ticks=[min,(min+max)/2,max].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(v)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${ilsK(v)}</text>`).join("");
  const xt=[0,12,24,36].map(i=>`<text x="${X(i)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${i===0?"היום":i/12===1?"שנה":i/12===2?"שנתיים":"3 שנים"}</text>`).join("");
  const mk=ui.m;
  const lines=ser.map(s=>`<path d="${path(s.pts)}" fill="none" stroke="${esc(s.c.color_css)}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(mk)}" cy="${Y(s.pts[mk])}" r="4.5" fill="${esc(s.c.color_css)}" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const totL=`<path d="${path(tot)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/><circle cx="${X(mk)}" cy="${Y(tot[mk])}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף ירידת הערך של הרכבים ב-3 השנים הקרובות">${ticks}${xt}<line x1="${X(mk)}" x2="${X(mk)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--accent)" stroke-width="2"/>${totL}${lines}</svg>
    <div class="legend">${cars.map(c=>`<span><i style="background:${esc(c.color_css)}"></i>${esc(c.name)}</span>`).join("")}<span><i style="background:var(--ink);opacity:.7"></i>שניהם יחד</span></div>`;
}
function mineTop(){
  const m=ui.m,tot=cars.reduce((s,c)=>s+central(c,m),0),tot0=cars.reduce((s,c)=>s+central(c,0),0);
  const hand=cars.reduce((s,c)=>s+inHand(c,m),0);
  return `<div class="sum"><div><span>שניהם (משוקלל)</span><b class="num">${ils(tot)}</b></div><div><span>${m?"ירידה מהיום":"בעוד שנה"}</span><b class="num" style="color:var(--bad)">${ils(m?tot-tot0:cars.reduce((s,c)=>s+central(c,12),0)-tot0)}</b></div><div><span>ביד, ב${esc((ROUTE[(meta.ans||{}).route]||ROUTE.private).l)}</span><b class="num">${ils(hand)}</b></div></div>${chart()}`;}
function mineCars(){return cars.map(carCard).join("");}

  return h;

// ---------- decision model ----------
function licFee(p){return p<150000?1500:p<200000?2100:p<250000?2700:p<300000?3300:3900;}
function energyY(o,kmY){const c=o.cons||{},F=M.energy.fuel,E=M.energy.kwh;
  if(o.fuel==="EV")return kmY*(c.kwh||18)/100*E*1.15;
  if(o.fuel==="PHEV"){const ev=c.ev!=null?c.ev:.6;return kmY*(ev*(c.kwh||22)/100*E*1.1+(1-ev)*(c.l||7)/100*F);}
  return kmY*(c.l||7)/100*F;}
function resale(o,P,Y){return P*(1-o.dep1/100)*Math.pow(1-o.depY/100,Math.max(0,Y-1));}
function pmt(L,ratePct,n,balloon){const r=ratePct/100/12;if(L<=0)return 0;const pvB=(balloon||0)/Math.pow(1+r,n);return r?(L-pvB)*r/(1-Math.pow(1+r,-n)):(L-(balloon||0))/n;}
function tradeVal(){const m=+ui.buyIn||0;return cars.filter(c=>(c.id==="kia"&&ui.sellKia)||(c.id==="ford"&&ui.sellFord)).reduce((s,c)=>s+inHand(c,m),0);}
function priceOf(o){const t=o.trims[Math.min(ui.trim[o.id]||0,o.trims.length-1)];return t.price;}
function finance(o,path,P){
  const Y=+ui.years,n=Y*12,R=M.rates,kmY=+ui.kmY;
  const RV=resale(o,P,Y);
  const ins=Math.max(3800,.022*(P+RV)/2+1500),lic=licFee(P),mnt=o.maint||1500,en=energyY(o,kmY);
  const run=(ins+lic+mnt)*Y,enT=en*Y;
  const T=Math.min(tradeVal(),P);
  if(path==="lease"){
    const Pf=P*(1-R.lease_discount/100);const mon=Math.max(0,(Pf-RV)/n)+(Pf+RV)/2*R.lease_margin/100/12+(ins+lic+mnt)/12;
    const total=mon*n+enT;return {path,label:"ליסינג תפעולי",down:0,mon,total,RV:0,cashFree:T,interest:0,note:"כולל ביטוח, רישוי וטיפולים. בסוף מחזירים את הרכב. מגבלת ק״מ בשנה."};}
  if(path==="cash"){const opp=P*R.deposit/100*Y*.6;const total=P+run+enT+opp-RV;return {path,label:"מזומן",down:P,mon:(ins+lic+mnt)/12,total,RV,cashFree:T-P,interest:0,opp,note:"כולל ריבית שהכסף היה מרוויח בפיקדון."};}
  if(path==="dealer"){const L=P-T,B=Math.min(P*.5,Math.max(0,L));const mp=pmt(L,R.dealer,n,B);const interest=mp*n+B-L;const total=P+interest+run+enT+T*R.deposit/100*Y*.6-RV;
    return {path,label:"מימון יבואן (בלון)",down:T,mon:mp+(ins+lic+mnt)/12,total,RV,interest,balloon:B,cashFree:0,note:"החזר נמוך, אבל בסוף משלמים בלון של "+ilsK(B)+" (או מוכרים את הרכב)."};}

  if(b=g("[data-incall]")){ui.excl={};if(b.dataset.incall==="0")shown().forEach(o=>ui.excl[o.id]=true);saveUi();const y=scrollY;render();scrollTo(0,y);return;}
  if(b=g("[data-rev]")){ui.rev=ui.rev===b.dataset.rev?null:b.dataset.rev;saveUi();const y=scrollY;render();scrollTo(0,y);return;}
  if(b=g("[data-revonly]")){const v=(M.reviews||[]).find(x=>x.id===b.dataset.revonly);if(!v)return;ui.excl={};M.options.forEach(o=>{if(!v.opts.includes(o.id))ui.excl[o.id]=true;});ui.kind="all";ui.budget=Math.max(ui.budget,330000);saveUi();render();toast("בשקלול עכשיו רק סורנטו. ״הכל לשקלול״ מחזיר את כולם");return;}
  if(b=g("[data-open]")){ui.open=ui.open===b.dataset.open?null:b.dataset.open;saveUi();const y=scrollY;render();scrollTo(0,y);return;}
  if(b=g("[data-trim]")){const [id,i]=b.dataset.trim.split("|");ui.trim[id]=+i;saveUi();const y=scrollY;render();scrollTo(0,y);return;}
  if(b=g("[data-ans]")){const [id,key,v]=b.dataset.ans.split("|");const c=cars.find(x=>x.id===id);if(!c)return;const y=scrollY;upd(id,{ans:{...(c.ans||{}),[key]:v}},"נשמר. המשוקלל עודכן");scrollTo(0,y);return;}
  if(b=g("[data-route]")){const y=scrollY;upd("_meta",{ans:{...(meta.ans||{}),route:b.dataset.route}},"נשמר");scrollTo(0,y);return;}
  if(b=g("[data-km]")){$("km-"+b.dataset.km).classList.toggle("on");return;}
  if(b=g("[data-svc]")){$("svc-"+b.dataset.svc).classList.toggle("on");return;}
  if(b=g("[data-kmsave]")){const id=b.dataset.kmsave,v=+$("kmv-"+id).value;if(!(v>1000)){toast("הקלד את המספר שבמד");return;}const c=cars.find(x=>x.id===id);upd(id,{km_log:[...(c.km_log||[]).filter(x=>x.d!==ds(today())),{d:ds(today()),km:v,src:"manual"}]},"נשמר. מעכשיו ההערכה ממשיכה מכאן");return;}
  if(b=g("[data-kmmsave]")){const id=b.dataset.kmmsave,v=+$("kmm-"+id).value;if(!(v>=100&&v<=6000)){toast("מספר ק״מ בחודש לא סביר");return;}upd(id,{km_month_manual:v},"נשמר. הקצב הזה גובר על החישוב");return;}
  if(b=g("[data-svcsave]")){const id=b.dataset.svcsave,d=$("svcd-"+id).value,km=+$("svck-"+id).value||null;if(!d){toast("בחר תאריך");return;}upd(id,{service:{d,km}},"נשמר. הטיפול הבא חושב");return;}
  if(b=g("[data-copy]")){try{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);toast("השאלה הועתקה, הדבק בצ׳אט");}catch(x){}}
});
render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection("cars").onSnapshot(s=>{const cs=[];meta={};
    s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted)return;if(x.id==="_meta")meta=v;else if(v.name)cs.push({id:x.id,...v});});
    cars=cs.sort((a,b)=>(a.order||9)-(b.order||9));render();},()=>{});
  db.collection("topics").onSnapshot(s=>{topics=s.docs.map(x=>({id:x.id,...x.data()})).filter(t=>!t._deleted&&(t.dash==="cars"||t.car));render();},()=>{});
});
})();
</script>
</body>
</html>
