<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js?v=1"></script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#25272D">
<script>window.SQ_APP="sidequests";window.SQ_PIN=true;window.SHOP_BUILD="1.3";</script>
<script src="sq-db.js?v=9"></script>
<title>קניות ורכישות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800&display=swap">
<style>
/* דשבורד קניות ורכישות: כרטיסייה לכל קנייה (אפשרויות, השוואה, איפה הכי זול, ביקורות, יוטיוב, מועצת 5 המומחים).
   נתונים: sq_docs (app=sidequests, collection=shopping): מסמך לכל קנייה + _meta. אין כאן נתונים אישיים בקוד. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --sunk:#ECECE7; --ink:#1E1F23; --muted:#62656E; --line:#E2E2DC;
  --hero:#25272D; --hero2:#4A4F5C; --art:url(img/art-shopping.svg); --hero-ink:#FFFFFF; --hero-muted:#D6D9E0; --accent:#F2B544; --accent-ink:#2B1D02;
  --good:#1E8A52; --good-soft:#DFF2E7; --warn:#B26A00; --warn-soft:#FBEBCF; --bad:#C2384A; --bad-soft:#FBE1E4; --link:#1F63C9; --pick:#0F7B6C; --pick-soft:#DDF3EE;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1C1D21; --sunk:#26282D; --ink:#EEEFF2; --muted:#A9ACB5; --line:#33363C;
  --hero:#1E2025; --hero2:#3A3E48; --hero-ink:#FFFFFF; --hero-muted:#C9CCD4; --accent:#F4C062; --accent-ink:#2B1D02;
  --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CB4F5; --pick:#4FD1B8; --pick-soft:#123029; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1C1D21; --sunk:#26282D; --ink:#EEEFF2; --muted:#A9ACB5; --line:#33363C;
  --hero:#1E2025; --hero2:#3A3E48; --hero-ink:#FFFFFF; --hero-muted:#C9CCD4; --accent:#F4C062; --accent-ink:#2B1D02;
  --good:#4CC384; --good-soft:#163024; --warn:#E9A945; --warn-soft:#3A2A12; --bad:#EE7A88; --bad-soft:#3B1E24; --link:#8CB4F5; --pick:#4FD1B8; --pick-soft:#123029; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700;background:none;border:0;padding:0;cursor:pointer}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14px;margin:0}
.chatbtn{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 4px;font-weight:800;font-size:14px;cursor:pointer;font-family:var(--f-display);white-space:nowrap}
.seg button:not(:nth-child(3n+1)){border-inline-start:1px solid var(--line)}
.seg button:nth-child(n+4){border-top:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chipsel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chipsel::-webkit-scrollbar{display:none}
.chipsel button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.chipsel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:19px}
.sh small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:20px}
/* topic cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:start;padding:0;color:inherit}
.tcard .img{height:130px;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line);position:relative}
.tcard .img .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;background:var(--sunk)}
.tcard .bd{padding:10px 12px 12px}
.tcard .t{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.3}
.tcard .s{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800;background:var(--sunk)}
.st.deciding{background:var(--warn-soft);color:var(--warn)}
.st.bought{background:var(--good-soft);color:var(--good)}
.st.dropped{background:var(--sunk);color:var(--muted)}
.st.research{background:var(--pick-soft);color:var(--pick)}
.addcard{border:2px dashed var(--line);border-radius:16px;background:none;min-height:120px;cursor:pointer;font-weight:800;font-size:16px;color:var(--muted)}
/* item */
.ihead{display:flex;gap:12px;align-items:center}
.ihead .pic{flex:none;width:92px;height:92px;border-radius:14px;background:#fff center/contain no-repeat;border:1px solid rgba(255,255,255,.2)}
.verdict{background:var(--pick-soft);border:1px solid var(--pick);border-radius:16px;padding:12px 14px}
.verdict .l{font-size:12.5px;font-weight:800;color:var(--pick);letter-spacing:.02em}
.verdict h3{font-size:19px;margin:2px 0 4px}
.verdict p{margin:0;font-size:14.5px}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ins li{padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14.5px}
.ins li.high{background:var(--warn-soft)}
.ins li b{font-family:var(--f-display)}
.req{margin:0;padding-inline-start:20px}
.req li{margin:4px 0;font-size:14.5px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
.offer.pick{border:2px solid var(--pick)}
.offer .top2{display:flex;gap:12px;padding:12px 14px 6px;align-items:flex-start}
.offer .ph{flex:none;width:86px;height:100px;border-radius:12px;background:#fff center/contain no-repeat;border:1px solid var(--line)}
.offer .nm{font-family:var(--f-display);font-weight:800;font-size:16.5px;line-height:1.3}
.offer .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--sunk);margin-bottom:4px}
.offer.pick .tag{background:var(--pick);color:#fff}
.offer .pr{font-family:var(--f-display);font-weight:800;font-size:18px;margin-top:4px}
.offer .pr small{font-family:var(--f-body);font-weight:600;font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.facts div{padding:7px 10px;min-width:0;border-inline-start:1px solid var(--line);font-size:13.5px}
.facts div:nth-child(3n+1){border-inline-start:0}
.facts div:nth-child(n+4){border-top:1px solid var(--line)}
.facts span{display:block;color:var(--muted);font-size:11.5px}
.pc{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pc ul{margin:0;padding:8px 12px 10px;padding-inline-start:28px;font-size:13.5px}
.pc ul+ul{border-inline-start:1px solid var(--line)}
.pc li{margin:3px 0}
.pc .p li::marker{content:"＋ ";color:var(--good)}
.pc .n li::marker{content:"− ";color:var(--bad)}
.olinks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px 12px;border-top:1px solid var(--line);font-size:14px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.cmp th{font-family:var(--f-display);font-size:13px;background:var(--sunk);position:sticky;top:0}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;right:0;background:var(--surface);font-weight:800;min-width:96px}
table.cmp th:first-child{background:var(--sunk)}
table.cmp td.pk{background:var(--pick-soft)}
.where{list-style:none;margin:0;padding:0}
.where li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.where li:first-child{border-top:0}
.where .w1{flex:1;min-width:0}
.where .w1 b{display:block;font-size:15px}
.where .w1 span{display:block;color:var(--muted);font-size:13px}
.where .w2{text-align:left;font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap}
.where .w2 small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
.where li.best .w2{color:var(--pick)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vid{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit}
.vid .th{aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative}
.vid .th:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vid .vt{padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.35}
.vid .vt small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.revs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.revs li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.revs li b{display:block;font-family:var(--f-display)}
.q{padding:10px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.qt{font-weight:800;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opt{flex:1 1 auto;border:0;background:var(--surface);padding:9px 10px;font-weight:700;font-size:14px;cursor:pointer}
.opt+.opt{border-inline-start:1px solid var(--line)}
.opt.on{background:var(--ink);color:var(--bg)}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;display:inline-block}
.btn.big{width:100%;padding:13px 16px;font-size:16px;font-family:var(--f-display)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.council{background:linear-gradient(135deg,#25272D,#4A4F5C);color:#fff;border-radius:16px;padding:14px}
.council h3{font-size:18px}
.council p{margin:6px 0 10px;font-size:14px;opacity:.9}
.council .btn{background:var(--accent);color:var(--accent-ink)}
.council .res{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14.5px}
.guide h3{font-size:16px;margin:10px 0 4px}
.guide h3:first-child{margin-top:0}
.guide ul{margin:0;padding-inline-start:20px}
.guide li{margin:4px 0;font-size:14.5px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:92vw}
.toast.on{display:flex;align-items:center;gap:12px}
.toast .un{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer}
/* 1.2: נרכש / אין צורך = מסגרת אחת מחולקת בקו */
.tcw{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tcw .tcard{border:0;border-radius:0;flex:1}
.fin{display:flex;border-top:1px solid var(--line)}
.fin button{flex:1;border:0;background:var(--surface);color:var(--ink);padding:11px 8px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px;transition:background .15s,color .15s}
.fin button+button{border-inline-start:1px solid var(--line)}
.fin button.on{background:var(--ink);color:var(--bg)}
.fin.solo{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.hero .fin.solo{border-color:rgba(255,255,255,.25)}
.arch{margin-top:6px}
.arch>summary{list-style:none;cursor:pointer;color:var(--muted);font-weight:800;font-size:14.5px;padding:10px 2px;user-select:none}
.arch>summary::-webkit-details-marker{display:none}
.arch[open]>.grid{animation:sqgrow .22s ease-out}
@keyframes sqgrow{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:17px}.offer .ph{width:72px;height:86px}.facts div{padding:6px 8px;font-size:13px}}
</style>
<link rel="stylesheet" href="dash-back.css?v=6">
<script src="dash-sub.js?v=1" defer></script>
<script src="fold.js?v=1" defer></script>
<script>/* 10.3: opened inside Side Quests (frame) = the app bar has the back button */if(window.self!==window.top)document.documentElement.classList.add("embed");</script>

<body>
<header class="hero"><div class="in" id="hero"></div></header>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="app"><div class="empty">טוען…</div></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const CHAT_FALLBACK="https://claude.ai/code/project/chan_01W6chmD4NUMHZzo1ehTjzCP?thread=cmsg_01W6chmD4NUMHZzo1ehTjzCPW9sB2rCbKzvKLip49DqLq9";
const CATS=[["all","הכול"],["travel","🧳 טיולים ונסיעות"],["tech","💻 טכנולוגיה"],["electronics","🔌 אלקטרוניקה"],["clothing","👕 ביגוד"],["outdoor","🏕️ ציוד שטח"],["home","🏠 בית"],["other","🛒 אחר"]];
// 1.3 (Oren 7.11.2026): no status. A purchase is open or archived (bought / not needed), nothing in between.
const ARCH={bought:"✅ נקנה",dropped:"✖️ אין צורך"};
const TABS=[["over","סקירה"],["opts","אפשרויות"],["cmp","השוואה"],["where","איפה לקנות"],["revs","ביקורות"],["council","🧠 מועצה"]];
let items={},meta={},db=null,loaded=false;
const UI_KEY="sq_shop_ui";let ui={cat:"all",tab:"over",view:"open"};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UI_KEY)||"{}"));}catch(e){}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui));}catch(e){}}
// inside Side Quests (frame): no own history entries, so the app's back button closes the dashboard
const EMB=window.self!==window.top;function goHash(x){if(EMB)location.replace(location.pathname+location.search+"#"+x);else location.hash=x;}
function curId(){const m=location.hash.match(/^#i=(.+)$/);return m?decodeURIComponent(m[1]):null;}

const rate=c=>c==="₪"||c==="ILS"?1:+((meta.fx||{})[c])||({EUR:3.8,USD:3.4,GBP:4.4})[c]||0;
const ils=v=>"₪"+Math.round(v).toLocaleString("he-IL");
const money=(v,c)=>c==="EUR"?"€"+(+v).toLocaleString("he-IL"):c==="USD"?"$"+(+v).toLocaleString("he-IL"):c==="GBP"?"£"+(+v).toLocaleString("he-IL"):ils(v);
function list(){return Object.entries(items).map(([id,v])=>({id,...v})).filter(x=>!x._deleted&&x.title).sort((a,b)=>(a.order??99)-(b.order??99)||String(b.updated_at||"").localeCompare(String(a.updated_at||"")));}
function isOpen(x){return !["bought","dropped"].includes(x.status);}
function pickOf(x){const o=(x.offers||[]);return o.find(y=>y.id===(x.verdict||{}).pick)||o.find(y=>y.pick)||null;}
function cheapest(x){const w=(x.where||[]).filter(r=>+r.price&&(!r.offer||!(x.verdict||{}).pick||r.offer===(x.verdict||{}).pick));if(!w.length)return null;return w.map(r=>({...r,ils:+r.price*rate(r.cur)})).sort((a,b)=>a.ils-b.ils)[0];}
function ytId(u){const m=String(u||"").match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);return m?m[1]:"";}

const FIN=x=>isOpen(x)?`<div class="fin"><button type="button" data-fin="bought" data-id="${esc(x.id)}">✅ נרכש</button><button type="button" data-fin="dropped" data-id="${esc(x.id)}">✖️ אין צורך</button></div>`:`<div class="fin"><button type="button" data-fin="back" data-id="${esc(x.id)}">↩ להחזיר לפתוחים</button></div>`;
// ---------- hero ----------
function heroHome(L){const open=L.filter(isOpen),qs=open.reduce((s,x)=>s+(x.questions||[]).filter(q=>!q.answer&&!q.superseded).length,0);
  return `<div class="top"><a class="sqhome" href="./"><span class="ar">→</span><img src="icon-192.png?v=2" alt=""><span>Side Quests</span></a><span class="back">${meta.updated?"עודכן "+esc(meta.updated):""}</span></div>
  <h1>🛍️ קניות ורכישות</h1>
  <a class="chatbtn" href="${esc(safe(meta.chat_url)||CHAT_FALLBACK)}" target="_blank" rel="noopener"><span>💬</span><span>צ׳אט</span></a>
  <div class="kpis"><div class="kpi"><b>${open.length}</b><span>פתוחות</span></div><div class="kpi"><b>${L.length-open.length}</b><span>בארכיון</span></div><div class="kpi"><b>${qs}</b><span>שאלות אליך</span></div></div>`;}
function heroItem(x){const p=pickOf(x),c=cheapest(x),img=safe(x.img)||(p&&safe(p.img));
  return `<div class="top"><button class="sqhome sqsub" type="button" data-home><span class="ar">→</span><span class="em">🛍️</span><span>כל הקניות</span></button></div>
  <div class="ihead" style="margin-top:10px">${img?`<div class="pic" style="background-image:url('${esc(img)}')"></div>`:""}<div style="min-width:0"><h1 style="margin:0">${esc(x.icon||"🛒")} ${esc(x.title)}</h1><p class="sub">${esc(x.summary||"")}</p></div></div>
  <div class="kpis"><div class="kpi"><b>${(x.offers||[]).length}</b><span>אפשרויות</span></div><div class="kpi"><b>${c?ils(c.ils):"—"}</b><span>${c?"הכי זול: "+esc(c.store):"מחיר"}</span></div><div class="kpi"><b style="font-size:16px">${p?esc(p.short||p.brand||""):"—"}</b><span>ההמלצה</span></div></div>
  ${FIN(x).replace('class="fin"','class="fin solo"')}`;}

// ---------- home ----------
function renderHome(){const L=list();$("hero").innerHTML=heroHome(L);
  $("bar").innerHTML=`<div class="chipsel">${CATS.map(([k,l])=>`<button data-cat="${k}" class="${ui.cat===k?"on":""}">${l}</button>`).join("")}</div>`;
  const vis=L.filter(x=>(ui.cat==="all"||x.cat===ui.cat));const open=vis.filter(isOpen),done=vis.filter(x=>!isOpen(x));
  const card=x=>{const p=pickOf(x),c=cheapest(x),img=safe(x.img)||(p&&safe(p.img));const nq=(x.questions||[]).filter(q=>!q.answer&&!q.superseded).length;
    return `<button class="tcard" data-open="${esc(x.id)}"><div class="img" ${img?`style="background-image:url('${esc(img)}')"`:""}>${img?"":`<span class="ic">${esc(x.icon||"🛒")}</span>`}</div><div class="bd">
      ${ARCH[x.status]?`<span class="st ${esc(x.status)}">${ARCH[x.status]}</span> `:""}${nq?`<span class="st deciding">? ${nq} שאלות</span>`:""}
      <div class="t"${ARCH[x.status]||nq?' style="margin-top:6px"':""}>${esc(x.icon||"")} ${esc(x.title)}</div>
      <div class="s">${p?"ההמלצה: "+esc(p.name):esc(x.summary||"")}${c?" · מ-"+ils(c.ils):""}</div></div></button>`;};
  const ocard=x=>`<div class="tcw">${card(x)}${FIN(x)}</div>`;
  let h=`<section><div class="sh"><h2>הקניות שלי</h2><small>${open.length}</small></div><div class="grid">${open.map(ocard).join("")}<button class="addcard" data-add>＋ נושא קנייה חדש</button></div></section>`;
  h+=guideBlock();
  if(done.length)h+=`<details class="arch"${ui.arch?" open":""}><summary>📦 ארכיון: נקנו או אין צורך · ${done.length}</summary><div class="grid">${done.sort((a,b)=>String(b.archived_at||"").localeCompare(String(a.archived_at||""))).map(card).join("")}</div></details>`;
  $("app").innerHTML=loaded||L.length?h:`<div class="empty">טוען…</div>`;}
function guideBlock(){const g=meta.guide;if(!Array.isArray(g)||!g.length)return "";
  return `<section><div class="sh"><h2>📚 ידע קבוע לקניות</h2></div><div class="card guide">${g.map(s=>`<h3>${esc(s.h)}</h3><ul>${(s.items||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`).join("")}${meta.guide_note?`<div class="note">${esc(meta.guide_note)}</div>`:""}</div></section>`;}

// ---------- item tabs ----------
function tabOver(x){const p=pickOf(x),v=x.verdict||{};let h="";
  if(v.text)h+=`<section><div class="verdict"><div class="l">ההכרעה${v.conf?" · ביטחון "+esc(v.conf):""}</div><h3>${esc(p?p.name:v.title||"")}</h3><p>${esc(v.text)}</p>${v.alt?`<p class="small" style="margin-top:6px">${esc(v.alt)}</p>`:""}</div></section>`;
  const qs=(x.questions||[]).filter(q=>!q.superseded);
  if(qs.length)h+=`<section><div class="sh"><h2>❓ שאלות אליך</h2></div><div class="card">${qs.map(q=>`<div class="q"><div class="qt">${esc(q.q)}</div><div class="opts">${(q.options||[]).map(o=>`<button class="opt ${q.answer===o?"on":""}" data-ans="${esc(q.id)}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}</div></section>`;
  if((x.insights||[]).length)h+=`<section><div class="sh"><h2>💡 מה חשוב לדעת</h2></div><ul class="ins">${x.insights.map(i=>`<li class="${esc(i.lvl||"")}">${i.h?`<b>${esc(i.h)}: </b>`:""}${esc(i.text)}</li>`).join("")}</ul></section>`;
  if((x.need||[]).length)h+=`<section><div class="sh"><h2>🎯 מה אני מחפש</h2></div><div class="card"><ul class="req">${x.need.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div></section>`;
  if((x.links||[]).length)h+=`<section><div class="sh"><h2>🔗 קישורים</h2></div><div class="card links">${x.links.filter(l=>safe(l.url)).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></section>`;
  return h;}
function offerCard(x,o){const pk=(x.verdict||{}).pick===o.id;const f=(o.facts||[]);
  return `<div class="offer ${pk?"pick":""}"><div class="top2">${safe(o.img)?`<div class="ph" style="background-image:url('${esc(o.img)}')"></div>`:""}<div style="min-width:0">
    ${o.tag||pk?`<span class="tag">${pk?"✓ ההמלצה":esc(o.tag)}</span>`:""}<div class="nm">${esc(o.name)}</div>
    ${o.price?`<div class="pr">${esc(o.price)} ${o.price_note?`<small>${esc(o.price_note)}</small>`:""}</div>`:""}${o.why?`<div class="small muted">${esc(o.why)}</div>`:""}</div></div>
    ${f.length?`<div class="facts">${f.map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div>`:""}
    ${(o.pros||[]).length||(o.cons||[]).length?`<div class="pc"><ul class="p">${(o.pros||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul><ul class="n">${(o.cons||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    ${(o.links||[]).length?`<div class="olinks">${o.links.filter(l=>safe(l.url)).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>`:""}</div>`;}
function tabOpts(x){const o=x.offers||[];if(!o.length)return `<div class="empty">עוד אין אפשרויות</div>`;
  const pk=(x.verdict||{}).pick;const s=[...o].sort((a,b)=>(b.id===pk)-(a.id===pk));return s.map(y=>offerCard(x,y)).join("");}
function tabCmp(x){const o=(x.offers||[]).filter(y=>!y.no_cmp);const rows=x.cmp_rows||[];if(!o.length||!rows.length)return `<div class="empty">אין עדיין טבלת השוואה.</div>`;
  const pk=(x.verdict||{}).pick;
  return `<div class="tblw"><table class="cmp"><thead><tr><th></th>${o.map(y=>`<th>${esc(y.short||y.name)}</th>`).join("")}</tr></thead><tbody>${rows.map(([k,l])=>`<tr><td>${esc(l)}</td>${o.map(y=>`<td class="${y.id===pk?"pk":""}">${esc((y.cmp||{})[k]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${x.cmp_note?`<div class="note">${esc(x.cmp_note)}</div>`:""}`;}
function tabWhere(x){const w=(x.where||[]).map(r=>({...r,ils:+r.price?+r.price*rate(r.cur):0}));if(!w.length)return `<div class="empty">אין עדיין מחירים.</div>`;
  const byOffer={};w.forEach(r=>{(byOffer[r.offer||""]=byOffer[r.offer||""]||[]).push(r);});
  const offers=x.offers||[];const name=id=>(offers.find(o=>o.id===id)||{}).name||"";
  return Object.entries(byOffer).map(([oid,rs])=>{rs.sort((a,b)=>(a.ils||9e9)-(b.ils||9e9));const best=rs.find(r=>r.ils);
    return `<section><div class="sh"><h2>${esc(name(oid)||"מחירים")}</h2></div><div class="card"><ul class="where">${rs.map(r=>`<li class="${r===best&&rs.length>1?"best":""}"><div class="w1"><b>${safe(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.store)}</a>`:esc(r.store)}</b><span>${esc(r.note||"")}</span></div><div class="w2">${r.ils?`${esc(money(r.price,r.cur))}${r.cur&&r.cur!=="ILS"?`<small>≈ ${ils(r.ils)}</small>`:""}`:`<small>${esc(r.price_txt||"לבדוק")}</small>`}</div></li>`).join("")}</ul></div></section>`;}).join("")
    +`${x.where_note?`<div class="note">${esc(x.where_note)}</div>`:""}<details class="more"><summary>שערים</summary><div>€1≈₪${rate("EUR")} · $1≈₪${rate("USD")} · £1≈₪${rate("GBP")}</div></details>`;}
function tabRevs(x){let h="";const v=x.videos||[];
  if(v.length)h+=`<section><div class="sh"><h2>▶️ סקירות ביוטיוב</h2><small>${v.length}</small></div><div class="vids">${v.filter(y=>safe(y.url)).map(y=>{const id=ytId(y.url);
    return `<a class="vid" href="${esc(y.url)}" target="_blank" rel="noopener"><div class="th" ${id?`style="background-image:url('https://i.ytimg.com/vi/${id}/mqdefault.jpg')"`:""}></div><div class="vt">${esc(y.title)}<small>${esc(y.for||"")}${y.ch?" · "+esc(y.ch):""}</small></div></a>`;}).join("")}</div></section>`;
  const r=x.reviews||[];
  if(r.length)h+=`<section><div class="sh"><h2>⭐ ביקורות וקהילה</h2></div><ul class="revs">${r.map(y=>`<li><b>${safe(y.url)?`<a href="${esc(y.url)}" target="_blank" rel="noopener">${esc(y.src)}</a>`:esc(y.src)}</b>${esc(y.text)}</li>`).join("")}</ul></section>`;
  return h||`<div class="empty">עוד אין ביקורות.</div>`;}
function councilPrompt(x){const o=(x.offers||[]).filter(y=>!y.no_cmp).map(y=>`- ${y.name}${y.price?" ("+y.price+")":""}: ${(y.pros||[]).join("; ")} | חסרונות: ${(y.cons||[]).join("; ")}`).join("\n");
  const ans=(x.questions||[]).filter(q=>q.answer).map(q=>`${q.q} → ${q.answer}`).join("\n");
  return `council this: החלטת קנייה, "${x.title}" (דשבורד הקניות ב-Side Quests, נושא ${x.id}).\n\nמה אני מחפש:\n${(x.need||[]).map(n=>"- "+n).join("\n")}\n${ans?"\nתשובות שלי:\n"+ans+"\n":""}\nהמועמדים:\n${o}\n\nההמלצה הנוכחית: ${(pickOf(x)||{}).name||"אין"}. תן הכרעה אחת, והכנס את התוצאה לשדה council של הנושא בדשבורד.`;}
function tabCouncil(x){const c=x.council||{};
  return `<section><div class="council"><h3 style="display:flex;align-items:center;justify-content:space-between;gap:8px">🧠 מועצת המומחים <button class="btn" data-council style="flex:none;padding:7px 14px;font-size:14px">▶ הרץ</button></h3>
    ${c.verdict?`<div class="res"><b>${esc(c.at?"הכרעת המועצה ("+c.at+")":"הכרעת המועצה")}:</b> ${esc(c.verdict)}${c.summary?`<div style="margin-top:6px;opacity:.9">${esc(c.summary)}</div>`:""}${safe(c.url)?`<div style="margin-top:6px"><a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:#FFE3A3">הדוח המלא</a></div>`:""}</div>`:""}
  </div></section>`;}
function renderItem(id){const x={id,...(items[id]||{})};if(!x.title){$("app").innerHTML=`<div class="empty">${loaded?"הנושא לא נמצא":"טוען…"}</div>`;return;}
  $("hero").innerHTML=heroItem(x);
  $("bar").innerHTML=`<div class="seg">${TABS.map(([k,l])=>`<button data-tab="${k}" class="${ui.tab===k?"on":""}">${l}</button>`).join("")}</div>`;
  const t=ui.tab;$("app").innerHTML=t==="opts"?tabOpts(x):t==="cmp"?tabCmp(x):t==="where"?tabWhere(x):t==="revs"?tabRevs(x):t==="council"?tabCouncil(x):tabOver(x);}

function render(){const id=curId();if(id)renderItem(id);else renderHome();
  $("foot").innerHTML=`${meta.sources?`<details class="more"><summary>מקורות</summary><div>${esc(meta.sources)}</div></details>`:""}קניות ${esc(window.SHOP_BUILD)}`;}
let tt,undoFn=null;function toast(t,undo){const el=$("toast");el.innerHTML=`<span>${esc(t)}</span>${undo?'<button class="un" type="button" data-undo>ביטול</button>':""}`;undoFn=undo||null;el.className="toast on";clearTimeout(tt);tt=setTimeout(()=>{el.className="toast";undoFn=null;},undo?5000:3500);}
async function copy(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy");}catch(e2){}a.remove();return ok;}}
async function upd(id,patch,msg,undo){const prev=JSON.parse(JSON.stringify(items[id]||{}));items[id]=Object.assign({},items[id],patch);const y=scrollY;render();scrollTo(0,y);
  if(!db){toast("אין חיבור, לא נשמר");return;}
  try{await db.collection("shopping").doc(id).update(patch);toast(msg||"נשמר",undo);}catch(e){items[id]=prev;render();toast("לא נשמר, נסה שוב");}}
window.addEventListener("hashchange",()=>{ui.tab="over";render();scrollTo(0,0);});
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let b;
  if(g("[data-undo]")){const f=undoFn;undoFn=null;$("toast").className="toast";if(f)f();return;}
  if(b=g("[data-fin]")){const id=b.dataset.id,x=items[id]||{},k=b.dataset.fin,now=new Date().toISOString();if(b.classList.contains("on"))return;b.classList.add("on");
    const prev={status:x.status||"open",archived_at:x.archived_at||null,log:x.log||[]};
    const txt=k==="bought"?"סומן נרכש, עבר לארכיון":k==="dropped"?"סומן אין צורך, עבר לארכיון":"הוחזר לבירור";
    const patch=k==="back"?{status:"open",archived_at:null,updated_at:now,log:[...prev.log,{at:now,text:txt}]}
      :{status:k,prev_status:prev.status,archived_at:now,updated_at:now,log:[...prev.log,{at:now,text:txt+" (מהדשבורד)"}]};
    setTimeout(()=>{if(k!=="back"&&curId()===id)goHash("");upd(id,patch,txt,()=>upd(id,{status:prev.status,archived_at:prev.archived_at,updated_at:new Date().toISOString(),log:prev.log},"בוטל"));},300);return;}
  if(b=g(".arch>summary")){setTimeout(()=>{ui.arch=b.parentElement.open;saveUi();},0);}
  if(b=g("[data-cat]")){ui.cat=b.dataset.cat;saveUi();render();return;}
  if(b=g("[data-open]")){goHash("i="+encodeURIComponent(b.dataset.open));return;}
  if(g("[data-home]")){EMB?goHash(""):history.length>1&&curId()?history.back():(location.hash="");return;}
  if(b=g("[data-tab]")){ui.tab=b.dataset.tab;saveUi();render();scrollTo(0,0);return;}
  if(b=g("[data-ans]")){const id=curId(),x=items[id]||{};const now=new Date().toISOString();
    const qs=(x.questions||[]).map(q=>q.id===b.dataset.ans?{...q,answer:q.answer===b.dataset.v?"":b.dataset.v,answered_at:now}:q);
    b.classList.add("on");setTimeout(()=>upd(id,{questions:qs,updated_at:now},"התשובה נשמרה"),300);return;}
  if(g("[data-council]")){const id=curId(),x={id,...items[id]};const ok=await copy(councilPrompt(x));
    toast(ok?"הועתק. מדביקים בשיחה ושולחים":"לא הצלחתי להעתיק");setTimeout(()=>window.open(safe(x.chat_url)||safe(meta.chat_url)||CHAT_FALLBACK,"_blank","noopener"),600);return;}
  if(g("[data-add]")){const t=(prompt("מה אתה רוצה לקנות?")||"").trim();if(!t)return;if(!db){toast("אין חיבור");return;}
    const id="p"+Date.now().toString(36),now=new Date().toISOString();
    try{await db.collection("shopping").doc(id).set({title:t.slice(0,120),icon:"🛒",cat:ui.cat==="all"?"other":ui.cat,status:"open",created_at:now,updated_at:now,offers:[],log:[{at:now,text:"נפתח מהדשבורד"}]});
      const ok=await copy(`נושא קנייה חדש בדשבורד הקניות (id ${id}): "${t}". תבדוק אפשרויות, מחירים (כולל אמזון איטליה), ביקורות ויוטיוב, ותמלא את הכרטיסייה.`);
      toast(ok?"נפתח. הבקשה הועתקה, הדבק בשיחה":"נפתח");goHash("i="+encodeURIComponent(id));}catch(err){toast("לא נשמר");}return;}
});
render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection("shopping").onSnapshot(s=>{loaded=true;const n={};s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted)return;if(x.id==="_meta")meta=v;else n[x.id]=v;});items=n;render();},()=>{});
});
})();
</script>
</body>
</html>
