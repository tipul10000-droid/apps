<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js?v=1"></script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#203A4C">
<script>window.SQ_APP="sidequests";window.SQ_PIN=true;window.CR_BUILD="1.1";</script>
<script src="sq-db.js?v=9"></script>
<title>כרטיסי אשראי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800&display=swap">
<style>
/* דשבורד כרטיסי אשראי: כל הכרטיסים (מהתזרים ומהמייל), דמי כרטיס, עמלת המרת מט"ח, ביטוחים שבכרטיס (נסיעות, תאונות אישיות, רכב שכור),
   ואיסוף מסמכים (ביטוח, פנסיה, אשראי). נתונים: sq_docs (app=sidequests, collection=credit): מסמך לכל כרטיס (kind:"card") + _meta. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --sunk:#E7EDF1; --ink:#15212A; --muted:#5A6873; --line:#D6DFE5;
  --hero:#203A4C; --hero2:#3E7C8C; --art:url(img/art-credit.svg); --mark:#E2A93B; --hero-ink:#F2F8FB; --hero-muted:#BFD6E0; --accent:#F4C152; --accent-ink:#3A2700;
  --good:#23855A; --good-soft:#DDF1E6; --warn:#A8600E; --warn-soft:#FBEAD3; --bad:#B83A2E; --bad-soft:#F8E0DD; --link:#2C6E86; --hi:#3E7C8C; --hi-soft:#E2F0F3;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161A; --surface:#182127; --sunk:#212C33; --ink:#EAF1F5; --muted:#9FB0BA; --line:#2A3740;
  --hero:#152836; --hero2:#2A5966; --hero-ink:#EEF6FA; --hero-muted:#A9C6D2; --good:#5CC88E; --good-soft:#163024; --warn:#EBA654; --warn-soft:#3A2814; --bad:#F07A6E; --bad-soft:#3A1E1B; --link:#7FC4DA; --hi:#7FC4DA; --hi-soft:#1D3640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161A; --surface:#182127; --sunk:#212C33; --ink:#EAF1F5; --muted:#9FB0BA; --line:#2A3740;
  --hero:#152836; --hero2:#2A5966; --hero-ink:#EEF6FA; --hero-muted:#A9C6D2; --good:#5CC88E; --good-soft:#163024; --warn:#EBA654; --warn-soft:#3A2814; --bad:#F07A6E; --bad-soft:#3A1E1B; --link:#7FC4DA; --hi:#7FC4DA; --hi-soft:#1D3640; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{background:var(--hero);color:var(--hero-ink);padding:16px 16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .in{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);font-size:14px;font-weight:700}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14.5px;margin:0}
.chatbtn{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:13px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--hero-muted);font-size:12.5px;display:block;line-height:1.3}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-display);white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.docsbtn{display:block;text-align:center;margin-top:8px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:19px}.sh small{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:20px 12px}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
/* one frame, rows split by lines (no frame in frame) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;padding:12px 14px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:46px;height:30px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:12px;color:#fff;letter-spacing:.5px}
.row .b{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:700;font-size:16.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:none;text-align:left;font-family:var(--f-display);font-weight:800;font-size:15px}
.row .v small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:600;font-size:12px}
.row.off{opacity:.55}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-hi{background:var(--hi-soft);color:var(--hi)}
.cal{background:#1A5FB4}.isracard{background:#0B7A3E}.max{background:#E4362E}.leumi{background:#1F4E9A}.other{background:#6B7780}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cmp th,.cmp td{padding:8px 8px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
.cmp th{background:var(--sunk);font-family:var(--f-display);font-size:13px;border-top:0}
.cmp td b{font-family:var(--f-display)}
.yes{color:var(--good);font-weight:800}.no{color:var(--muted);font-weight:700}.unk{color:var(--warn);font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv div{padding:9px 2px;border-top:1px solid var(--line);font-size:15px}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--muted);font-weight:700;padding-inline-end:14px;white-space:nowrap}
.ins li{padding:9px 2px;font-size:15px;line-height:1.45}.ins li+li{border-top:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
.q h3{font-size:16.5px;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opts button{background:var(--surface);border:0;padding:11px 12px;text-align:right;font-weight:700;font-size:15px;cursor:pointer}
.opts button:active{background:var(--hi-soft)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;font-size:15px}
.todo+.todo{border-top:1px solid var(--line)}
.todo .w{flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--sunk)}
.btns{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.btns button,.btns a{flex:1;background:var(--surface);border:0;padding:10px 6px;text-align:center;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink)}
pre.req{white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;line-height:1.55;margin:0;max-height:220px;overflow:auto}
details.more{margin-top:8px}details.more summary{cursor:pointer;font-weight:800;color:var(--link);font-size:14px}
details.more>div{padding-top:6px;font-size:14px;color:var(--muted);line-height:1.55}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:92vw}
.toast.on{display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:16px}.hero h1{font-size:22px}.cmp{font-size:13px}.cmp th,.cmp td{padding:7px 5px}}
</style>
<link rel="stylesheet" href="dash-back.css?v=6">
<script src="dash-sub.js?v=1" defer></script>
<script src="fold.js?v=1" defer></script>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed");</script>
</head>
<body>
<header class="hero"><div class="in" id="hero"></div></header>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="app"><div class="empty">טוען…</div></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="credit.js?v=2"></script>
</body>
</html>
