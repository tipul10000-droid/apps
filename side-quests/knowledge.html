/* דשבורד ידע ותחומי עניין (Knowledge & Interests): טיקטי מידע שאורן שולח (לינקים, כתבות, פוסטים) נשמרות כטיקטים לפי תחום,
   עם הטקסט המלא באנגלית ובעברית, תובנות ומה לעשות עם זה. בלי דשבורדים פנימיים: רק טיקטים, מסודרות לפי תחום (1.2).

:root{

}

  --hero:#1F275E; --hero2:#43378A; --hero-ink:#F4F2FF; --hero-muted:#C2BAEE; --accent:#FFC857; --accent-ink:#3A2200;
  --good:#5CC27E; --good-soft:#173022; --warn:#EBA654; --warn-soft:#3A2814; --link:#B2A6FF; --en:#AEB8FF; --hi:#B2A6FF; --hi-soft:#2A2550; color-scheme:dark}}

  --hero:#1F275E; --hero2:#43378A; --hero-ink:#F4F2FF; --hero-muted:#C2BAEE; --accent:#FFC857; --accent-ink:#3A2200;
  --good:#5CC27E; --good-soft:#173022; --warn:#EBA654; --warn-soft:#3A2814; --link:#B2A6FF; --en:#AEB8FF; --hi:#B2A6FF; --hi-soft:#2A2550; color-scheme:dark}
*{box-sizing:border-box}

.ins li{padding:11px 2px}

.todo{list-style:none;margin:0;padding:0}

.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;line-height:1.5}
.warnbox ul{margin:4px 0 0;padding-inline-start:18px}

.lang button+button{border-inline-start:1px solid var(--line)}
.lang button.on{background:var(--hi);color:#fff}
.part{padding:12px 2px}
.part+.part{border-top:1px solid var(--line)}
.srch{margin:6px -14px 0;padding:8px 14px;background:var(--hi-soft);color:var(--hi);font-weight:800;font-size:14px;font-family:var(--f-display)}
.srch:first-child{margin-top:-12px;border-radius:16px 16px 0 0}
.src+.src{margin-top:8px}
/* 2.0: ticket banner (from sq_gfx, never in the repo) + deck card with send-to-work-mail */
.kban{margin:12px 0 4px;aspect-ratio:3/1;border-radius:14px;overflow:hidden;background:#060B18}
.kban img{width:100%;height:100%;object-fit:cover;display:block}
.kdeck{margin:10px 0 4px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);color:var(--hero-ink)}
.kdeck .dh{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--hero-ink)!important;font-weight:800}
.kdeck .dh small{display:block;color:var(--hero-muted);font-weight:600;font-size:12.5px}
.kdeck .dh .v{margin-inline-start:auto;flex-shrink:0;font-family:var(--f-display);font-size:13px;padding:3px 9px;border-radius:20px;background:var(--accent);color:var(--accent-ink)}
.kdeck .send{display:block;width:100%;margin-top:10px;min-height:44px;border:0;border-radius:12px;background:#fff;color:#0F3B66;font:800 15px var(--f-body);cursor:pointer}
.kdeck .send[disabled]{opacity:.75;cursor:default}
.kdeck .st{margin-top:6px;min-height:18px;font-size:12.5px;color:var(--hero-muted);font-weight:600}
.part .hd{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--hi);margin-bottom:4px}
.part .he{font-size:16px;line-height:1.6;white-space:pre-line}
.part .en{direction:ltr;text-align:left;font-size:15px;line-height:1.55;color:var(--en);white-space:pre-line;font-family:var(--f-body)}
.part .he+.en{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.kimg{margin:0}.kimg+.kimg{margin-top:12px}.kimg img{display:block;width:100%;height:auto;border-radius:12px;background:#fff}.kimg figcaption{font-size:14px;line-height:1.5;margin-top:6px;color:var(--muted,#666)}
.glos{list-style:none;margin:0;padding:0}
.glos li{padding:8px 2px;font-size:15px;line-height:1.5}
.glos li+li{border-top:1px solid var(--line)}
.glos b{font-family:var(--f-display)}
.hsec{padding:10px 2px}
.hsec+.hsec{border-top:1px solid var(--line)}
.hsec h3{font-size:16.5px;margin-bottom:4px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;display:none;max-width:92vw}
.toast.on{display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:16px}.hero h1{font-size:22px}}
/* 1.5: work mode (knowledge.html?w=1 = "ידע עבודה", Work Quest, collection work_knowledge) */
:root.work{--hero:#0F3B66;--hero2:#2E6FB0;--mark:#2E6FB0;--hi:#2E6FB0;--hi-soft:#E3EEF9;--link:#1F5C99}
@media (prefers-color-scheme: dark){:root.work:not([data-theme="light"]){--hero:#0C2A49;--hero2:#1E4F80;--hi:#8CC0F2;--hi-soft:#16304A;--link:#9CCBF5}}
:root.work[data-theme="dark"]{--hero:#0C2A49;--hero2:#1E4F80;--hi:#8CC0F2;--hi-soft:#16304A;--link:#9CCBF5}
/* guide tab: structured sections (rows/steps/list/text/img) */
.gsec{margin-bottom:18px}
.gsec .intro{font-size:15.5px;line-height:1.55;margin:0 2px 8px}
.rows{display:flex;flex-direction:column}
.rows .r{padding:9px 2px}.rows .r+.r{border-top:1px solid var(--line)}
.rows .k{font-family:var(--f-display);font-weight:800;font-size:15px}

.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{display:flex;gap:10px;padding:9px 2px;font-size:15.5px;line-height:1.5;counter-increment:st}
.steps li+li{border-top:1px solid var(--line)}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--hi);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}

details.fx>summary{list-style:none;cursor:pointer}details.fx>summary::-webkit-details-marker{display:none}
details.fx>summary .mo{flex:none;font-family:var(--f-body);font-size:12.5px;font-weight:800;color:var(--hi);background:var(--hi-soft);border-radius:999px;padding:1px 9px;margin-inline-start:auto;align-self:center;white-space:nowrap}

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 1.6: Latin/number runs inside Hebrew ("31 mV/Pa", "1.23 V ÷ 0.031") are isolated in <bdi> so they don't flip */
const BXR=/(?:[+−±\u200e]|-(?=\d))?[A-Za-z0-9][A-Za-z0-9 .,:\/+\-−±×÷≈%°Ω'"]*[A-Za-z0-9%°Ω]/g;
function bx(t){t=String(t==null?"":t);let o="",i=0;for(const m of t.matchAll(BXR)){o+=esc(t.slice(i,m.index));o+=/[A-Za-z]|\d\s/.test(m[0])?`<bdi dir="ltr">${esc(m[0])}</bdi>`:esc(m[0]);i=m.index+m[0].length;}return o+esc(t.slice(i));}
const safe=u=>/^https:\/\//.test(u||"")?u:"";

async function upd(id,patch,msg){const prev=JSON.parse(JSON.stringify(items[id]||{}));items[id]=Object.assign({},items[id],patch);const y=scrollY;render();scrollTo(0,y);
  if(!db){toast("אין חיבור, לא נשמר");return;}
  try{await db.collection(COLL).doc(id).update(patch);toast(msg||"נשמר");}catch(e){items[id]=prev;render();toast("לא נשמר, נסה שוב");}}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0);});
function keepPut(sel,fn){/* a tapped button stays put (rule 6.11) */const b=document.querySelector(sel),top=b?b.getBoundingClientRect().top:0;fn();const nb=document.querySelector(sel);if(b&&nb)scrollBy(0,nb.getBoundingClientRect().top-top);}
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let b;
  if(b=g("[data-topic]")){ui.topic=b.dataset.topic;saveUi();render();return;}
  if(b=g("[data-got]")){ui.tab="ins";goHash("t="+encodeURIComponent(b.dataset.got));return;}
  if(g("[data-home]")){EMB?goHash(""):history.length>1&&route()?history.back():(location.hash="");return;}
  if(b=g("[data-cart],[data-nocart],[data-uncart]")){const r=route(),tid=r&&r.id;if(!tid)return;const rid=b.dataset.cart||b.dataset.nocart||b.dataset.uncart,c=Object.assign({},(items[tid]||{}).cart||{});
    if(b.dataset.cart!=null){if(c[rid]==="cart")delete c[rid];else c[rid]="cart";}else if(b.dataset.nocart!=null)c[rid]="no";else delete c[rid];
    const sel=b.dataset.nocart!=null?null:`[data-${b.dataset.cart!=null?"cart":"uncart"}="${rid}"]`;
    const run=()=>upd(tid,{cart:c},c[rid]==="cart"?"🛒 נוסף לעגלה":c[rid]==="no"?"🗄️ עבר ל\"לא צריך\"":"הוחזר לרשימה");
    sel&&b.dataset.cart!=null?keepPut(sel,run):run();return;}
  if(b=g("[data-tab]")){const k=b.dataset.tab;keepPut(`[data-tab="${k}"]`,()=>{ui.tab=k;saveUi();render();});return;}
  if(b=g("[data-lang]")){const k=b.dataset.lang;keepPut(`[data-lang="${k}"]`,()=>{ui.lang=k;saveUi();render();});return;}
  const now=new Date().toISOString();
  if(g("[data-senddeck]")){const id=route().id,x=items[id]||{},d=x.deck||{};if(!db){toast("אין חיבור");return;}
    const iid="sd-"+Date.now().toString(36);
    try{await db.collection("instructions").doc(iid).set({kind:"send_deck",via:"app",coll:COLL,ticket:id,ver:d.ver||"",file:d.file||"",text:"לשלוח את המצגת "+(d.title||"")+" (גרסה "+(d.ver||"")+") למייל העבודה",at:now,status:"pending"});}
    catch(err){toast("לא נשלח, נסה שוב");return;}
    keepPut("[data-senddeck]",()=>upd(id,{deck:Object.assign({},d,{req:{at:now,ver:d.ver||"",iid}})},"📧 בתור. יגיע למייל העבודה עד שעה"));return;}
  if(g("[data-fav]")){const id=route().id;upd(id,{fav:!(items[id]||{}).fav,updated_at:now});return;}
  if(g("[data-share]")){const id=route().id;const t=shareText({id,...items[id]});
    if(navigator.share){try{await navigator.share({text:t});return;}catch(err){if(err&&err.name==="AbortError")return;}}
    toast(await copy(t)?"הסיכום הועתק, אפשר להדביק בוואטסאפ":"לא הצלחתי להעתיק");return;}
  if(g("[data-add]")){const u=(prompt("הדבק לינק או טקסט (פוסט, כתבה, סרטון)")||"").trim();if(!u)return;if(!db){toast("אין חיבור");return;}
    const m=u.match(/https:\/\/\S+/);const url=m?m[0]:"";const id="k"+Date.now().toString(36);
    try{await db.collection(COLL).doc(id).set({kind:"ticket",title:url?"טיקט מידע חדש":u.slice(0,100),icon:"💡",topic:ui.topic==="all"?"other":ui.topic,status:"new",source:{url},parts:[],insights:[],created_at:now,updated_at:now,log:[{at:now,text:"נפתח מהדשבורד"}]});
      const ok=await copy(`טיקט מידע חדש בדשבורד ${NAME} (id ${id}): ${u}\nתקרא את כל המקור, תביא את הטקסט המלא באנגלית ובעברית בצורה סדורה, תסכם, תוציא תובנות ומה אפשר לעשות עם זה, ותמלא את הטיקט.`);
      toast(ok?"נוסף. הבקשה הועתקה, הדבק בשיחה":"נוסף");setTimeout(()=>window.open(safe(meta.chat_url)||CHAT_FALLBACK,"_blank","noopener"),700);goHash("t="+encodeURIComponent(id));}catch(err){toast("לא נשמר");}return;}
});
if(W){document.querySelector('meta[name="theme-color"]').content="#0F3B66";}
render();
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.collection(COLL).onSnapshot(s=>{loaded=true;const n={};s.docs.forEach(x=>{const v=x.data();if(!v||v._deleted)return;if(x.id==="_meta")meta=v;else n[x.id]=v;});items=n;render();},()=>{});
});
})();
</script>

<script src="sq-calm.js?v=3"></script>
