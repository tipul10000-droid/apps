<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="robots" content="noindex">

<script>window.SQ_APP="sidequests";window.SQ_PIN=true;window.INS_BUILD="3.4";</script>
<script>/* 3.0 (Oren 17.11): ?w=1 = the second dashboard "פנסיה, חסכונות ונכסים" (same data). Asset sub pages (#a=) belong to it. */window.INS_W=/[?&]w=1(&|$)/.test(location.search)||/^#a=/.test(location.hash);if(window.INS_W){document.documentElement.classList.add("wealth");document.title="פנסיה, חסכונות ונכסים";}</script>
<script src="sq-db.js?v=10"></script>
<script src="dash-lock.js?v=1"></script>
<title>ביטוחים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* דשבורד ביטוח משפחתי. הנתונים לא בקוד: הם ב-sq_docs (app=sidequests, collection=insurance), נקראים דרך sq-db.js עם הקוד של Side Quests. */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --sunk:#E6ECF3; --ink:#141E2B; --muted:#5A6779; --line:#D5DDE8;
  --hero:#154A86; --hero2:#2F7BCF; --art:url(img/art-insurance.svg); --hero-ink:#F2F7FD; --hero-muted:#B5CDEB; --accent:#F2A93B;
  --ok:#2E8B57; --ok-soft:#E1F1E7; --mid:#B86A10; --mid-soft:#FBEBD3; --bad:#C8414B; --bad-soft:#FBE3E4; --unk:#7C8A83; --unk-soft:#E9ECEA;
  --c-health:#2C6BB5; --c-life:#7A52B3; --c-nursing:#245E73; --c-car:#D08419; --c-home:#2E8B57; --c-travel:#C8414B; --c-pension:#8C3B2E; --c-other:#5E6B64;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --sunk:#1E2734; --ink:#E6EDF6; --muted:#9AA8BB; --line:#2A3445;
  --hero:#10345E; --hero2:#1D5596; --hero-ink:#EEF4FB; --hero-muted:#9DB8DC; --accent:#F4B451;
  --ok:#62C08A; --ok-soft:#183126; --mid:#EBA74A; --mid-soft:#3A2A14; --bad:#EE7A82; --bad-soft:#3B1E21; --unk:#97A69E; --unk-soft:#232C28;
  --c-health:#6FA6E8; --c-life:#B293E6; --c-nursing:#7DC0D6; --c-car:#EBA74A; --c-home:#62C08A; --c-travel:#EE7A82; --c-pension:#D98C7E; --c-other:#97A69E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --sunk:#1E2734; --ink:#E6EDF6; --muted:#9AA8BB; --line:#2A3445;
  --hero:#10345E; --hero2:#1D5596; --hero-ink:#EEF4FB; --hero-muted:#9DB8DC; --accent:#F4B451;
  --ok:#62C08A; --ok-soft:#183126; --mid:#EBA74A; --mid-soft:#3A2A14; --bad:#EE7A82; --bad-soft:#3B1E21; --unk:#97A69E; --unk-soft:#232C28;
  --c-health:#6FA6E8; --c-life:#B293E6; --c-nursing:#7DC0D6; --c-car:#EBA74A; --c-home:#62C08A; --c-travel:#EE7A82; --c-pension:#D98C7E; --c-other:#97A69E; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:18px 16px 20px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.hero .in{max-width:980px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--hero-muted);text-decoration:none;font-size:14px;font-weight:700}
.hero h1{font-size:26px;margin:10px 0 2px;display:flex;align-items:center;gap:10px}
.hero .sub{color:var(--hero-muted);font-size:14px;margin:0}
.chatbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 2px;padding:14px 16px;border-radius:14px;background:var(--accent);color:#1F1606;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chatbtn small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;opacity:.8}
.chatbtn[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.2;direction:ltr;text-align:right}
.kpi span{color:var(--hero-muted);font-size:13px}
.kpi.warn b{color:var(--accent)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:20px}}

/* filters */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-weight:500;font-size:12.5px;opacity:.75;margin-inline-start:4px}

section{margin-bottom:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font-size:19px}
.sh .hint{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;width:100%}
.al .dot{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.al.high .dot{background:var(--bad-soft)} .al.mid .dot{background:var(--mid-soft)} .al.low .dot{background:var(--unk-soft)}
.al b{display:block;font-size:15px}
.al small{color:var(--muted);font-size:13.5px}
.al .save{font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:2px 7px;max-width:96px;text-align:center;line-height:1.3}
.more{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:9px;font-weight:700;color:var(--muted)}

/* two-up */
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* cost bars */
.bars{padding:14px}
.brow{display:grid;grid-template-columns:92px 1fr 70px;gap:10px;align-items:center;padding:5px 0;font-size:14.5px}
.brow .track{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.brow .fill{display:block;height:100%;border-radius:7px}
.brow .v{font-family:var(--f-mono);font-size:13.5px;text-align:left;direction:ltr}
.bnote{color:var(--muted);font-size:13px;margin-top:8px}

/* renewals */
.ren{padding:6px 14px}
.rrow{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.rrow:last-child{border-bottom:0}
.rrow .d{font-family:var(--f-mono);font-size:13px;text-align:center;border-radius:8px;padding:4px 0;background:var(--sunk);direction:ltr}
.rrow .d.soon{background:var(--mid-soft);color:var(--mid)}
.rrow .d.past{background:var(--bad-soft);color:var(--bad)}
.rrow b{font-size:14.5px;display:block}
.rrow small{color:var(--muted);font-size:13px}

/* coverage matrix */
.mx{overflow-x:auto}
table.cov{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.cov th,.cov td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cov th{font-size:13px;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
.cov td:first-child,.cov th:first-child{text-align:start;font-weight:700;position:sticky;right:0;background:var(--surface);z-index:1}
.cov tr:last-child td{border-bottom:0}
.st{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 6px;border-radius:999px;font-size:12.5px;font-weight:700;border:0;cursor:pointer}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.partial{background:var(--mid-soft);color:var(--mid)} .st.gap{background:var(--bad-soft);color:var(--bad)} .st.unknown{background:var(--unk-soft);color:var(--unk)} .st.dup{background:var(--mid-soft);color:var(--mid)} .st.dupok{background:var(--ok-soft);color:var(--ok)} .st.na{background:transparent;color:var(--muted);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend .st{min-width:0;cursor:default}
.covnote{padding:0 12px 12px;font-size:13.5px;color:var(--ink)}

/* policies */
.grp{margin-bottom:16px}
.gh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-family:var(--f-display);font-weight:700;font-size:16px}
.gh .sw{width:10px;height:10px;border-radius:3px}
.gh .s{margin-inline-start:auto;font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted);direction:ltr}
.inv-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 2px 10px}.inv-top b{font-size:28px;line-height:1.1}.inv-top span{display:block;font-size:12.5px;color:var(--muted)}.inv-d{font-weight:800}.inv-d.up{color:#1E8E4E}.inv-d.dn{color:#C0392B}
.lnr{display:flex;gap:10px;justify-content:space-between;padding:10px 2px}.lnr+.lnr{border-top:1px solid var(--line)}.lnb{min-width:0}.lnb b{display:block;font-size:15px}.lnb span,.lnv span{display:block;font-size:12.5px;color:var(--muted)}.lnv{text-align:left;flex:none}.lnv b{display:block}
.pol{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 13px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px;border-inline-start:4px solid var(--cc,var(--line))}
.pol .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--sunk)}
.pol .t{font-weight:700;font-size:15.5px;line-height:1.3}
.pol .m{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.pol .p{text-align:left;direction:ltr}
.pol .p b{font-family:var(--f-mono);font-weight:500;font-size:16px;display:block}
.pol .p small{color:var(--muted);font-size:12px;direction:rtl;display:block;text-align:left}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;line-height:20px}
.tag.high{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:var(--mid-soft);color:var(--mid)} .tag.low{background:var(--unk-soft);color:var(--unk)} .tag.okk{background:var(--ok-soft);color:var(--ok)}
.who{display:inline-flex;gap:3px}
.who i{font-style:normal;font-size:11.5px;font-weight:700;border-radius:5px;padding:0 5px;background:var(--sunk);color:var(--ink);line-height:19px}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14.5px}
.task .stage{font-family:var(--f-mono);font-size:12px;border-radius:6px;padding:0 6px;background:var(--sunk);height:20px;line-height:20px;margin-top:1px}
.task small{color:var(--muted);display:block;font-size:13px}
.task.done{opacity:.55}.task.done b{text-decoration:line-through}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:none}
.sheet{position:fixed;z-index:41;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.open .scrim{display:block}.open .sheet{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;display:flex;align-items:center;gap:8px}
.sheet .x{position:absolute;top:12px;left:12px;border:0;background:var(--sunk);border-radius:999px;width:34px;height:34px;font-size:18px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:14px 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.box h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.box ul{margin:0;padding-inline-start:18px}.box li{margin:3px 0}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;text-decoration:none;background:var(--bg)}
.conf{font-size:12.5px;color:var(--muted);margin-top:12px}

/* stages */
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stg{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;min-width:0;border:1px solid transparent;font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%}
.stg em{display:block;font-style:normal;font-weight:800;font-size:12.5px;color:#fff;margin-top:2px}
.stg.sel{background:rgba(255,255,255,.18);box-shadow:inset 0 -3px 0 var(--accent)}
.stg.cur{border-color:var(--accent);background:rgba(242,169,59,.12)}
.stg b{display:block;font-size:13.5px;font-family:var(--f-display)}
.stg span{color:var(--hero-muted);font-size:12px}
.stg .pb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.stg .pb i{display:block;height:100%;background:var(--accent)}
.snote{display:none}
.stp{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px;display:grid;gap:8px;animation:stpin .2s ease}
@keyframes stpin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stp h2{margin:0;font-size:17px}.stp .sn{font-size:13px;color:var(--muted);margin:0}
.stp .tk{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.stp .tk:first-of-type{border-top:0}
.stp .tk .wh{font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;background:var(--bg);white-space:nowrap}
.stp .tk .wh.me{background:#fde7c4;color:#7a4a05}
.stp .tk b{font-size:14px}.stp .tk small{grid-column:2;color:var(--muted);font-size:12.5px}
.stp .tk.dn b{text-decoration:line-through;color:var(--muted);font-weight:600}
.stp details summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--muted);padding:4px 0}
.stp .ok{font-weight:800;color:#1d7a45}
.flcl summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--muted);padding:6px 2px}
.flcl .al{opacity:.7}
.pvr{width:100%;background:none;border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;align-items:center}.pvgo{font-size:22px;color:var(--muted);flex:none}
body.asub .bar,body.asub .kpis,body.asub #stages,body.asub #snote,body.asub .docsbtn{display:none!important}
.asum{margin:0 2px 12px;color:var(--muted);font-size:14.5px;line-height:1.5}
.akp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;padding:6px}.akp>div{padding:10px}.akp span{display:block;font-size:12.5px;color:var(--muted)}.akp b{display:block;font-size:22px;line-height:1.2}.akp small{display:block;font-size:12px;color:var(--muted)}
.ppc{padding:14px}.pps{display:flex;gap:10px;align-items:flex-end;height:190px}.pp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;text-align:center}.pb{width:70%;max-width:70px;background:color-mix(in srgb,var(--c-pension) 45%,transparent);border-radius:8px 8px 3px 3px}.pp.me .pb{background:var(--c-pension)}.pv{font-weight:800;font-size:14px;margin-bottom:3px}.pl{font-size:12.5px;font-weight:700;margin-top:5px}.pd{font-size:11.5px;color:var(--muted)}.pnote{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.fin{width:100%;border-collapse:collapse;font-size:14px}.fin th,.fin td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line)}.fin th{font-size:12.5px;color:var(--muted)}.fin td.neg{color:#C0392B}.fin td:last-child{color:var(--muted);font-size:12.5px}
.ains,.aups{padding:4px 12px}.ai,.au{display:flex;gap:10px;padding:10px 0}.ai+.ai,.au+.au{border-top:1px solid var(--line)}.aic{font-size:20px;flex:none}.ai b,.au b{display:block;font-size:14.5px}.ai span,.au span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}.aud{flex:none;width:58px;font-size:12.5px;color:var(--muted);font-weight:700;padding-top:2px}.au a{font-size:13px}.au .num{color:inherit;font-weight:700}
.akv{margin-top:16px;padding:12px}
.ggrp{font-size:13px;font-weight:900;letter-spacing:.02em;color:var(--muted);margin:14px 2px -4px;border-bottom:1px solid var(--line);padding-bottom:4px}


/* 3.0: wealth mode + pension simulator */
html.wealth{--hero:#1E4A3B;--hero2:#3E8C68;--hero-muted:#B9DCCB}
html.wealth #stages,html.wealth #snote,html.wealth #collect,html.wealth #cats{display:none!important}
.xw{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-decoration:none;color:inherit;border-inline-start:4px solid var(--c-pension)}
.xw .ic{font-size:26px}.xw b{display:block;font-size:16px}.xw span{display:block;font-size:13px;color:var(--muted)}.xw .go{margin-inline-start:auto;font-size:22px;color:var(--muted)}
.ovr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media (max-width:600px){.ovr{grid-template-columns:repeat(2,1fr)}}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:inherit;display:block}
.ov span{display:block;font-size:13px;color:var(--muted)}.ov b{display:block;font-family:var(--f-mono);font-weight:500;font-size:19px;direction:ltr;text-align:right}.ov small{display:block;font-size:11.5px;color:var(--muted)}
.ov.neg b{color:var(--bad)}.ovt{grid-column:1/-1;background:var(--sunk)}.ovt b{font-size:24px}
.smw{padding:14px;display:grid;gap:12px}
.smtop{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.smbig b{display:block;font-family:var(--f-mono);font-weight:500;font-size:34px;direction:ltr;text-align:right;line-height:1.1;color:var(--c-pension)}
.smbig span{display:block;font-size:13.5px;font-weight:700}.smbig small{display:block;font-size:12.5px;color:var(--muted)}
.smcmp{font-size:13px;color:var(--muted);margin-top:-6px}
.smbars{padding:0}.smbars .brow{grid-template-columns:118px 1fr 74px;font-size:13.5px}
.smtax .v{color:var(--bad)}

  <a class="docsbtn" id="docs" target="_blank" rel="noopener" hidden>📁 מסמכים</a>
  <a class="docsbtn" id="collect" target="_blank" rel="noopener" hidden>📥 שליפת מסמכים</a>

  </div>
</div></header>

<div class="wrap">
  <div class="bar"><div class="chips" id="who"></div><div class="chips" id="cats" style="margin-top:6px"></div><nav class="jump" id="jump"></nav></div>
  <main id="app"><div class="empty">טוען…</div></main>
  <footer id="foot"></footer>
</div>

<div id="sheetwrap"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const ils=n=>n==null||isNaN(n)?"?":"₪"+Math.round(n).toLocaleString("en-US");

const CATS={health:{l:"בריאות",i:"🩺",c:"--c-health"},life:{l:"חיים ומשכנתא",i:"🕊️",c:"--c-life"},nursing:{l:"סיעודי",i:"🤝",c:"--c-nursing"},car:{l:"רכב",i:"🚗",c:"--c-car"},home:{l:"דירה",i:"🏠",c:"--c-home"},travel:{l:"נסיעות",i:"✈️",c:"--c-travel"},hmo:{l:"קופת חולים",i:"🏥",c:"--c-nursing"},pension:{l:"פנסיה וחיסכון",i:"📈",c:"--c-pension"},private:{l:"השקעות פרטיות",i:"🌱",c:"--c-pension"},accident:{l:"תאונות",i:"🩹",c:"--c-other"},other:{l:"אחר",i:"📄",c:"--c-other"}};
const WHO={all:"כולם",oren:"אורן",lior:"ליאור",kids:"ילדים",family:"משפחתי",cars:"רכבים",home:"דירה"};
const WHO_TAG={oren:"אורן",lior:"ליאור",kids:"ילדים",family:"משפחה"};
const STATUS={active:["פעיל","okk"],check:["לבדוק","mid"],ended:["הסתיים","low"],per_trip:["לפי נסיעה","low"],unknown:["לא ידוע","low"],cancel:["בביטול","mid"]};
const COV={ok:"מכוסה",partial:"חלקי",gap:"חסר",unknown:"לא ידוע",dup:"כפל?",dupok:"כפל תקין",na:"—"};
const LVL={high:"🔴",mid:"🟠",low:"⚪"};
const TYPE_I={dup:"⧉",cost:"₪",gap:"⚠️",renew:"📅",check:"🔍",pay:"💳"};

const W=!!window.INS_W;
let showAll=false, showDone=false, stSel=null, fWho=W?"all":(localStorage.getItem("ins_who")||"all"), fCat="all", data={pol:[],meta:{}};

function monthly(p){if(p.status==="ended")return 0;if(p.monthly!=null)return +p.monthly;if(p.annual!=null)return +p.annual/12;return 0;}
function matchWho(p){
  if(fWho==="all")return true;
  if(fWho==="cars")return p.cat==="car";
  if(fWho==="home")return p.cat==="home";
  const w=p.who||[];return w.includes(fWho)||(fWho!=="family"&&w.includes("family"));
}
function visible(){return data.pol.filter(p=>matchWho(p)&&(fCat==="all"||p.cat===fCat));}
function daysTo(d){if(!d)return null;const t=new Date(d+"T00:00:00");return Math.round((t-new Date())/864e5);}
function fmtD(d){if(!d)return "";const [y,m,dd]=d.split("-");return dd?`${+dd}.${+m}.${y.slice(2)}`:`${+m}.${y.slice(2)}`;}

function chips(){
  const all=data.pol.filter(p=>p.status!=="ended");
  $("who").innerHTML=(W?["all","oren","lior","kids"]:Object.keys(WHO)).map(k=>{const n=k==="all"?all.length:all.filter(p=>{const s=fWho;fWho=k;const r=matchWho(p);fWho=s;return r;}).length;return `<button class="chip" data-w="${k}" aria-pressed="${fWho===k}">${WHO[k]}<span class="n">${n}</span></button>`;}).join("");
  const cs=["all",...Object.keys(CATS).filter(c=>all.some(p=>p.cat===c))];
  $("cats").innerHTML=cs.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${fCat===c}">${c==="all"?"כל התחומים":CATS[c].i+" "+CATS[c].l}</button>`).join("");
  $("who").querySelectorAll("button").forEach(b=>b.onclick=()=>{fWho=b.dataset.w;try{localStorage.setItem("ins_who",fWho)}catch(e){}render();});
  $("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{fCat=b.dataset.c;render();});
}

// קרן ההשתלמות: משיכה מול הלוואה. מנגנון החישוב מדשבורד התזרים (lib/finance/study-fund.ts), נתונים ב-fund של המסמך
const FS={track:null,sc:4,amt:null,mo:36};
function hfCalc(F){
  const R=Math.round, net=(a)=>(a-F.fee)/100/12;
  const pay=(P,rate,n)=>{if(n<=0)return P;const r=rate/100/12;return r?R(P*r/(1-(1+r)**-n)):R(P/n);};
  const bal=(P,rate,n,k)=>{const r=rate/100/12,p=pay(P,rate,n);if(!r)return Math.max(0,P-p*k);return Math.max(0,R(P*(1+r)**k-p*(((1+r)**k-1)/r)));};
  const loansAt=m=>F.loans.reduce((t,l)=>m>=l.left?t:t+(l.kind==="balloon"?l.balance:bal(l.balance,F.prime+l.margin,l.left,m)),0);
  const fundAt=(m,a)=>{const r=net(a);let v=F.balance;for(let i=0;i<m;i++)v=v*(1+r)+F.deposit;return R(v);};
  const avail=(m,a,tr)=>Math.max(0,R(fundAt(m,a)*F.share[tr])-loansAt(m));
  return {pay,loansAt,fundAt,avail};
}
function drawFund(VV){if(VV)FS.V=VV;
  const box=$("hfund");if(!box)return;const p=(FS.V||[]).find(x=>x.fund);if(!p){box.remove();return;}
  const F=p.fund,C=hfCalc(F),tr=FS.track||F.track,L0=C.loansAt(0);
  const wNet=F.free-L0, aEq=C.avail(0,FS.sc,"equity"), aSo=C.avail(0,FS.sc,"solid"), aNow=tr==="equity"?aEq:aSo;
  const step=5000,maxA=Math.max(step,Math.floor(Math.max(wNet,aNow)/step)*step);
  if(FS.amt==null)FS.amt=Math.min(100000,maxA);const A=Math.min(FS.amt,maxA),M=FS.mo;
  const rate=F.prime+F.margin, sp=C.pay(A,rate,M), spInt=sp*M-A, blM=Math.round(A*rate/100/12), blInt=blM*M;
  const r=(FS.sc-F.fee)/100/12, lost=Math.round(A*((1+r)**M-1));
  const yrs=(M/12).toLocaleString("he-IL",{maximumFractionDigits:1});
  const over=A>aNow;
  const verdict=over?`<span class="hwarn">${ils(A)} זה יותר ממה שאפשר ללוות היום במסלול הזה (${ils(aNow)}). אפשר רק במשיכה${tr==="equity"&&A<=aSo?", או במעבר למסלול סולידי":""}.</span>`
    :FS.sc===0?`בלי תשואה, משיכה זולה יותר: ההלוואה עולה ${ils(spInt)} ריבית, והכסף בקרן לא היה גדל.`
    :lost>blInt?`בתרחיש ${FS.sc}% הלוואה עדיפה: הכסף בקרן צומח (כ-${ils(lost)} ב-${yrs} שנים) יותר ממה שעולה הריבית (${ils(blInt)} אם כל הסכום בחוץ כל התקופה). כלל אצבע: תשואה נטו ${(FS.sc-F.fee).toFixed(1)}% מול ריבית ${rate.toFixed(2)}%.`
    :`בתרחיש ${FS.sc}% משיכה עדיפה: הצמיחה שמפסידים (כ-${ils(lost)}) קטנה מהריבית (${ils(blInt)} אם כל הסכום בחוץ כל התקופה). כלל אצבע: תשואה נטו ${(FS.sc-F.fee).toFixed(1)}% מול ריבית ${rate.toFixed(2)}%.`;
  const seg=(items,cur,key)=>`<div class="hseg">${items.map(([v,l])=>`<button type="button" data-hf="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`;
  const H=[[0,"היום"],[1,"בעוד חודש"],[6,"בעוד חצי שנה"],[12,"בעוד שנה"],[24,"בעוד שנתיים"]];
  const monthly=F.loans.reduce((t,l)=>t+(l.monthly||0),0), balloons=F.loans.filter(l=>l.kind==="balloon"&&l.left<=12);
  const fd=d=>d.split("-").reverse().join(".");
  box.innerHTML=`<h3>🏦 קרן ההשתלמות בהראל: שתי דרכים לכסף<span>${ils(F.balance)}</span></h3>
  <div class="hf2"><div class="w"><span class="lb">💸 משיכה מלאה</span><b>${ils(wNet)}</b><small>החלק הפטור (${ils(F.free)}) פחות סגירת ההלוואות (${ils(L0)}). בלי מס. הכסף יוצא מהקרן ומפסיק לצמוח.</small><small>+ עוד ${ils(F.over)} מעל התקרה, עם 25% מס על הרווח בלבד</small></div>
  <div class="l"><span class="lb">🏦 הלוואה מהקרן</span><b>${ils(aNow)}</b><small>היום, במסלול ${tr==="equity"?"מנייתי (עד 50%)":"סולידי (עד 80%)"}, אחרי ההלוואות הקיימות. הכסף נשאר מושקע וממשיך לצמוח.</small><small>${tr==="equity"?`במסלול סולידי: ${ils(aSo)}`:`במסלול מנייתי: ${ils(aEq)}`}</small></div></div>
  <div class="hfl">מסלול השקעה בקרן (קובע כמה אפשר ללוות)</div>${seg([["equity","מנייתי · 50%"],["solid","סולידי · 80%"]],tr,"track")}
  ${tr!==F.track?`<div class="nt">כדי לקבל את זה צריך לעבור מסלול: ${esc(F.switch_note)}. מסלול סולידי צפוי להרוויח פחות לאורך זמן.</div>`:`<div class="nt">היום: ${esc(F.track_name)} (מנייתי). מעבר מסלול ${esc(F.switch_note)}.</div>`}
  <div class="hfl">🧮 מחשבון: כמה צריך ולכמה זמן</div>
  <label class="hrng">סכום: <b>${ils(A)}</b><input type="range" data-hr="amt" min="${step}" max="${maxA}" step="${step}" value="${A}"></label>
  <label class="hrng">תקופה: <b>${M}</b> חודשים (${yrs} שנים)<input type="range" data-hr="mo" min="12" max="120" step="6" value="${M}"></label>
  <div class="hfl">תשואה שנתית צפויה בקרן</div>${seg([[0,"אפס"],[4,"זהיר 4%"],[8,"ממוצע 8%"]],FS.sc,"sc")}
  <div class="hf2"><div class="l"><span class="lb">הלוואה, שפיצר</span><b>${over?"—":ils(sp)}</b><small>בחודש, קבוע. ריבית כוללת ${ils(spInt)}</small><small>בלון: ${ils(blM)} בחודש ו-${ils(A)} בסוף. ריבית כוללת ${ils(blInt)}</small></div>
  <div class="w"><span class="lb">משיכה: צמיחה שמפסידים</span><b>${ils(lost)}</b><small>מה שהסכום היה מרוויח בקרן ב-${yrs} שנים. אין החזר חודשי.</small><small>ריבית ההלוואה: פריים ${F.margin<0?"פחות":"ועוד"} ${Math.abs(F.margin)}% = ${rate.toFixed(2)}%</small></div></div>
  <div class="hver">${verdict}</div>
  <details><summary>📈 כמה אפשר ללוות היום ובהמשך</summary><div class="htab">${H.map(([m,l])=>`<div><span>${l}<br><small>קרן ${ils(C.fundAt(m,FS.sc))} · הלוואות ${ils(C.loansAt(m))}</small></span><b>${ils(C.avail(m,FS.sc,tr))}</b></div>`).join("")}</div><div class="nt">תשואה ${FS.sc}% פחות דמי ניהול ${F.fee}%, ועוד הפקדה של ${ils(F.deposit)} בחודש (${esc(F.deposit_note)}). הערכה בלבד.</div></details>
  <details><summary>🧾 ההלוואות הקיימות: ${ils(monthly)} בחודש, ב-14 לחודש</summary><div class="htab">${F.loans.map(l=>`<div><span>${esc(l.label)}<br><small>פריים ${l.margin<0?"פחות":"ועוד"} ${Math.abs(l.margin)}% · עוד ${l.left} תשלומים, עד ${fd(l.end)} · ${ils(l.monthly)} בחודש</small></span><b>${ils(l.balance)}</b></div>`).join("")}</div>${balloons.map(l=>`<div class="nt hwarn">⚠️ ב-${fd(l.end)} מסתיימת הלוואת בלון: צריך להחזיר ${ils(l.balance)} בבת אחת.</div>`).join("")}</details>
  <div class="nt">${esc(F.src)}. ריבית פריים ${F.prime}%: ${esc(F.prime_src)}. בלי הצמדה ועמלות. משיכה חלקית: הראל מקזזת או מבקשת לסגור קודם את ההלוואות.</div>`;
  box.querySelectorAll("[data-hf]").forEach(b=>b.onclick=()=>{const k=b.dataset.hf,v=b.dataset.v;if(k==="track")FS.track=v;else FS.sc=+v;drawFund();});
  box.querySelectorAll("[data-hr]").forEach(i=>{i.oninput=()=>{const b=i.parentNode.querySelector("b");if(b)b.textContent=i.dataset.hr==="amt"?ils(+i.value):i.value;};i.onchange=()=>{FS[i.dataset.hr]=+i.value;drawFund();};});
}
function render(){
  const am=location.hash.match(/^#a=([\w-]+)/), ap=am&&data.pol.find(p=>p.id===am[1]&&p.inv);
  document.body.classList.toggle("asub",!!ap);
  if(ap){renderAsset(ap);return;}
  {const b=document.querySelector(".hero .sqsub");if(b)b.remove();}
  chips();
  const V=visible(), act=V.filter(p=>p.status!=="ended");
  const m=act.reduce((s,p)=>s+monthly(p),0);
  // רשימת "דורש תשומת לב" מגיעה מ-_meta.flags (רשימה מנופה). ממצאים לכל פוליסה מוצגים בכרטיס שלה.
  const flags=[];
  (data.meta.flags||[]).forEach(f=>{if(fWho==="all"||!f.who||f.who.includes(fWho)){const p=f.pid&&data.pol.find(x=>x.id===f.pid);
    const fw=f.area?f.area==="wealth":!!(p&&(p.cat==="pension"||p.cat==="private")); // 3.0: each finding shows in its own dashboard
    if(fw===W)flags.push(p?{...f,p}:f);}});
  const rank={high:0,mid:1,low:2};flags.sort((a,b)=>(rank[a.lvl]??3)-(rank[b.lvl]??3));
  if(!W){$("k-month").textContent=ils(m);$("k-year").textContent=ils(m*12);$("k-count").textContent=act.filter(p=>p.status!=="per_trip"&&p.cat!=="private").length;$("k-alerts").textContent=flags.filter(f=>!f.closed&&f.lvl!=="low").length;}
  const meta=data.meta;
  if(meta.updated)$("upd").textContent="עודכן "+meta.updated;
  // הלינק לשיחה נשמר בנתונים (_meta.chat_url), לא בקוד.
  $("h1t").textContent=W?"💼 פנסיה, חסכונות ונכסים":"🛡️ ביטוחים";
  const chat=safe(W&&meta.wealth_chat_url||meta.chat_url);if(chat){$("chat").href=chat;$("chat").hidden=false;}
  const docs=safe(meta.docs_url);if(docs){$("docs").href=docs;$("docs").hidden=false;}
  const col=safe(meta.collect_url);if(col){$("collect").href=col;$("collect").hidden=false;}

  // שלבים: התקדמות לפי המשימות ב-_meta.tasks
  const T=meta.tasks||[], cur=String(meta.stage||1);
  const SN={"1":"איסוף ותמונת מצב","2":"חורים בכיסוי","3":"כפלים וחיסכון"};
  $("stages").innerHTML=["1","2","3"].map(k=>{const ts=T.filter(t=>String(t.stage)===k),d=ts.filter(t=>t.done).length;return `<button type="button" class="stg ${k===cur?"cur":""} ${k===stSel?"sel":""}" data-stg="${k}"><b>שלב ${k}${k===cur?" · עכשיו":""}</b><span>${SN[k]}</span><em>${ts.length-d?ts.length-d+" פתוחות":"✓ הכול סגור"}</em><div class="pb"><i style="width:${ts.length?Math.round(d/ts.length*100):0}%"></i></div></button>`;}).join("");
  $("stages").querySelectorAll("[data-stg]").forEach(b=>b.onclick=()=>{stSel=stSel===b.dataset.stg?null:b.dataset.stg;render();});
  $("snote").textContent=meta.stage_note||"";
  let h="";
  // שלב שנבחר: מה עוד פתוח, ומקופל מה נסגר
  if(stSel&&!W){
    const ts=T.filter(t=>String(t.stage)===stSel), op=ts.filter(t=>!t.done), dn=ts.filter(t=>t.done);
    const row=t=>{const m=(t.text||"").match(/^(אורן|ליאור|פיננסי|ילדים)[:：]\s*(.*)$/);return `<div class="tk ${t.done?"dn":""}"><span class="wh ${m&&m[1]==="אורן"?"me":""}">${m?esc(m[1]):"Claude"}</span><b>${esc(m?m[2]:t.text)}</b>${t.sub?`<small>${esc(t.sub)}</small>`:""}</div>`;};
    h+=`<section id="s-stage" class="stp"><h2>שלב ${stSel}: ${SN[stSel]}</h2>${stSel===cur&&meta.stage_note?`<p class="sn">${esc(meta.stage_note)}</p>`:""}`+
      (op.length?op.map(row).join(""):`<div class="ok">✓ אין משימות פתוחות בשלב הזה</div>`)+
      (dn.length?`<details><summary>✓ נסגרו (${dn.length})</summary>${dn.map(row).join("")}</details>`:"")+`</section>`;
  }
  // כסף נזיל: אזור ראשון. כל מסמך עם liquid [{label,amount,tier:now|tax|later|locked,when,tax,advice,how,net,new}]
  const LQ=[];V.forEach(p=>(p.liquid||[]).forEach(l=>LQ.push({...l,tier:l.tier||(l.now?"now":l.locked?"locked":"later"),p})));
  if(LQ.length){
    const TI={now:["🟢","אפשר למשוך עכשיו, בלי מס"],tax:["🟡","אפשר עכשיו, אבל עם מס או תנאים"],later:["⏳","משתחרר בהמשך"],locked:["🔒","נעול (פרישה / ילדים)"]};
    const sum=t=>LQ.filter(l=>l.tier===t).reduce((s,l)=>s+(+(l.net??l.amount)||0),0);
    const card=l=>`<button class="lq t-${l.tier}" data-p="${esc(l.p.id)}"><span>${l.new?'<i class="nw">חדש</i> ':""}${esc(l.label||l.p.short||l.p.title)}</span><b>${ils(+l.amount||0)}</b><small>${[l.when?`<span class="when">${esc(l.when)}</span>`:"",l.tax?esc(l.tax):"",l.net!=null&&+l.net!==+l.amount?`נטו בערך ${ils(+l.net)}`:""].filter(Boolean).join(" · ")}</small>${l.advice?`<em class="adv">${esc(l.advice)}</em>`:""}</button>`;
    const grp=t=>{const L=LQ.filter(l=>l.tier===t&&!l.p.fund);return L.length?`<div class="lqg"><div class="lqh">${TI[t][0]} ${TI[t][1]}${t==="now"&&V.some(x=>x.fund)?" (חוץ מהקרן)":""}<span>${ils(L.reduce((s,l)=>s+(+(l.net??l.amount)||0),0))}</span></div>${L.map(card).join("")}</div>`:"";};
    const lk=LQ.filter(l=>l.tier==="locked");
    h+=`<section id="s-liq" class="liqbox"><div class="sh"><h2>💰 כסף נזיל למשיכה</h2><span class="hint">אורן וליאור</span></div>`+
      `<div class="lqk"><div><b>${ils(sum("now"))}</b><span>עכשיו, בלי מס</span></div><div><b>${ils(sum("tax"))}</b><span>עכשיו, עם מס (נטו)</span></div><div><b>${ils(sum("later"))}</b><span>משתחרר בהמשך</span></div></div>`+

const SM_END=82;
function smNeed(R,s){
  const TX=smTX(R), r=MK[s.mk].r, g=SG[s.sg].g, rd=Math.max(.5,r-1.5), im=Math.pow(1+rd/100,1/12)-1, lv=(+s.lv||100)/100, t0=smT0(R);
  const P=(R.people||[]).filter(p=>s.who==="both"||p.id===s.who).map(p=>{
    const x=smPerson(R,p,s.age[p.id],r,g,TX,0,p.career?(s.car||"deputy"):null);return {p,x,tgt:(+p.net_now||0)*lv};});
  const m0=Math.min(...P.map(o=>o.x.n));let need=0;
  P.forEach(o=>{const {p,x,tgt}=o,end=Math.max(0,(SM_END-x.A)*12),sg={gap:[0,0,x.A,x.S],early:[0,0,Math.max(x.A,x.S),p.ret],old:[0,0,Math.max(x.A,p.ret),SM_END]};let pv=0;
    for(let k=0;k<end;k++){const a=x.A+k/12,key=a<x.S?"gap":a<p.ret?"early":"old",inc=key==="gap"?-TX.ne:key==="early"?x.n0:x.n1,sf=Math.max(0,tgt-inc);
      sg[key][0]+=sf;sg[key][1]++;pv+=sf/Math.pow(1+im,x.n-m0+k);}
    o.pv=pv;o.sg=sg;o.inc={gap:-TX.ne,early:x.n0,old:x.n1};need+=pv;});
  // what we have, valued at the first retirement (today's money)
  const A=window.SMA||{}, yrs=m0/12, gr=Math.pow(1+rd/100,yrs), ga=Math.pow(1.01,yrs);
  let study=0;P.forEach(o=>o.x.funds.filter(f=>f.kind==="lump").forEach(f=>{study+=(f.fv-(+f.debt||0))/Math.pow(1+im,o.x.n-m0);}));
  const pfNet=(A.pfv||0)-Math.max(0,(A.pfv||0)-(A.pfc||A.pfv||0))*.25, liq=study+(pfNet+(A.priv||0))*gr;
  const C=A.costs||{}, sell=((+C.broker_pct||2)+(+C.lawyer_pct||.5))/100, home=A.est?A.est*ga*(1-sell)-(A.bal||0):0;
  const all=liq+home-(A.debt||0);
  const pmt=gap=>gap<=0||m0<=0?0:gap*im/(Math.pow(1+im,m0)-1);
  return {rd,lv,P,need,m0,yrs,date:new Date(t0.getFullYear(),t0.getMonth()+m0,1),study,pfNet:pfNet*gr,priv:(A.priv||0)*gr,home,debt:A.debt||0,liq,all,pmt,tgt:P.reduce((a,o)=>a+o.tgt,0),

  ${L.length?`<div class="lnks">${L.map(l=>`<a class="lnk" href="${esc(safe(l.url))}" target="_blank" rel="noopener">${({mail:"✉️",login:"🔑",chat:"💬",page:"🌐"})[l.kind]||"🔗"} ${esc(l.label)}</a>`).join("")}</div>`:""}</div>
  </section>`;
  $("jump").innerHTML="";
}
addEventListener("hashchange",()=>{if(data)render();scrollTo(0,0);});
function openPol(id){
  const p=data.pol.find(x=>x.id===id);if(!p)return;
  const c=CATS[p.cat]||CATS.other, st=STATUS[p.status]||STATUS.unknown, m=monthly(p);
  const row=(k,v)=>v==null||v===""?"":`<dt>${k}</dt><dd>${v}</dd>`;
  const links=(p.links||[]).filter(l=>safe(l.url));
  $("sheet").innerHTML=`<div class="grab"></div><button class="x" id="sx" aria-label="סגירה">✕</button>
  <h3><span>${esc(p.icon||c.i)}</span>${esc(p.title)}</h3>
  <dl class="kv">
    ${row("סטטוס",`<span class="tag ${st[1]}">${st[0]}</span>`)}
    ${row("מבטחת",esc(p.insurer))}
    ${row("מספר פוליסה",p.policy_no?`<span class="num">${esc(p.policy_no)}</span>`:"")}
    ${row("מבוטחים",(p.who||[]).map(w=>WHO_TAG[w]||w).join(", "))}
    ${row("נכס",esc(p.asset))}
    ${row("צבירה",p.balance!=null?`<span class="num">${ils(p.balance)}</span>${p.balance_note?" · "+esc(p.balance_note):""}`:"")}
    ${row("עלות",p.status==="per_trip"?ils(p.annual)+" בשנה האחרונה":m?`<span class="num">${ils(m)}</span> לחודש · <span class="num">${ils(m*12)}</span> לשנה`:"לא ידוע")}
    ${row("אופן תשלום",esc(p.freq_label||""))}
    ${row("כרטיס",esc(p.card))}
    ${row("יום חיוב",esc(p.charge_day))}
    ${row("התחלה",esc(p.start))}
    ${row("חידוש / תפוגה",p.renew?`${fmtD(p.renew)}${p.renew_note?" · "+esc(p.renew_note):""}`:esc(p.renew_note||""))}
    ${row("סוכן",esc(p.agent))}
  </dl>
  ${(p.flags||[]).length?`<div class="box"><h4>ממצאים</h4><ul>${p.flags.map(f=>`<li>${LVL[f.lvl]||""} ${esc(f.text)}${f.save?` <b>(${esc(f.save)})</b>`:""}</li>`).join("")}</ul></div>`:""}
  ${(p.coverage||[]).length?`<div class="box"><h4>מה מכוסה (לפי מה שידוע)</h4><ul>${p.coverage.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  ${(p.liquid||[]).length?`<div class="box"><h4>משיכת כסף</h4><ul>${p.liquid.map(l=>`<li><b>${esc(l.label||"")} ${ils(+l.amount||0)}</b>: ${[l.when,l.tax].filter(Boolean).map(esc).join(" · ")}${l.advice?`<br><b>${esc(l.advice)}</b>`:""}${l.how?`<br>${esc(l.how)}`:""}</li>`).join("")}</ul></div>`:""}
  ${p.notes?`<div class="box"><h4>הערות</h4>${esc(p.notes)}</div>`:""}
  ${p.charges?`<div class="box"><h4>חיובים שנמצאו באשראי</h4>${esc(p.charges)}</div>`:""}
  ${links.length?`<div class="lnks">${links.map(l=>`<a class="lnk" href="${esc(safe(l.url))}" target="_blank" rel="noopener">${({policy:"📄",login:"🔑",mail:"✉️",agent:"☎️",folder:"📁"})[l.kind]||"🔗"} ${esc(l.label)}</a>`).join("")}</div>`:""}
  <div class="conf">מקור: ${esc(p.source||"")}${p.confidence?` · רמת ודאות: ${esc(({confirmed:"מאומת",likely:"סביר",guess:"השערה"})[p.confidence]||p.confidence)}`:""}</div>`;
  document.getElementById("sheetwrap").className="open";
  $("sx").onclick=close;$("sx").focus();
}
function close(){document.getElementById("sheetwrap").className="";}
$("scrim").onclick=close;document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

window.claude.use("db").then(db=>{
  if(!db)return;
  db.collection("insurance").onSnapshot(s=>{
    const pol=[],meta={};
    s.docs.forEach(d=>{const x=d.data();if(d.id==="_meta")Object.assign(meta,x);else if(x&&x.title&&!x.merged_into)pol.push({id:d.id,...x});});
    data={...data,pol,meta};render();
  },()=>{});
  if(W)db.collection("housing").onSnapshot(s=>{const H={};s.docs.forEach(d=>{const x=d.data();if(x&&!x._deleted)H[d.id]=x;});data.house=H;if(data.meta&&data.meta.retire)render();},()=>{});
});
})();
</script>
