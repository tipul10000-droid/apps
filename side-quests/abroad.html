<title>כל הנסיעות לחו״ל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800&display=swap">
<style>
/* כל הנסיעות לחו״ל (Travel Quest, 25.7, אורן 21.11.2026). הנתונים: sq_docs settings/travel_history (מהאקסל V8-AI)
   + trips (נסיעות שהוזמנו ובתכנון). שום מידע אישי בקוד, הכול מהמסד. */
:root{
  --bg:#EEF6F5; --surface:#FFFFFF; --sunk:#E2EFED; --ink:#10282B; --muted:#557074; --line:#CFE2DF;
  --hero:#0B4F57; --hero2:#0E7C86; --hero-ink:#F0FAF9; --hero-muted:#A9D3D2; --accent:#FFC857; --accent-ink:#3A2600;
  --link:#0E6E78; --hi:#0E6E78; --hi-soft:#DDF1EF;
  --c-fam:#E0703C; --c-cpl:#D6457A; --c-fr:#7B5CD6; --c-ext:#C49A1F; --c-work:#2F80C9; --c-army:#5E8C3A;
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1415; --surface:#122022; --sunk:#1A2C2E; --ink:#E6F2F1; --muted:#9DB8B6; --line:#28403F; --hero:#08363B; --hero2:#0B5A61; --link:#7FD3CF; --hi:#7FD3CF; --hi-soft:#173634; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1415; --surface:#122022; --sunk:#1A2C2E; --ink:#E6F2F1; --muted:#9DB8B6; --line:#28403F; --hero:#08363B; --hero2:#0B5A61; --link:#7FD3CF; --hi:#7FD3CF; --hi-soft:#173634; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--link);text-decoration:none;font-weight:700}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{position:relative;overflow:hidden;background:radial-gradient(110% 90% at 90% 0%,rgba(255,200,87,.28),transparent 55%),linear-gradient(160deg,var(--hero2),var(--hero));color:var(--hero-ink);padding:16px 16px 18px;padding-top:max(16px,env(safe-area-inset-top))}
.hero .in{max-width:880px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-size:25px;margin:10px 0 2px}
.hero .sub{color:var(--hero-muted);font-size:14.5px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 10px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2}
.kpi span{color:var(--hero-muted);font-size:12px;display:block;line-height:1.3}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.chips button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
.flt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;font-weight:700}
.flt button{border:0;background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;cursor:pointer}
section{margin-bottom:18px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sh h2{font-size:18px}.sh small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:18px 12px;font-size:14.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
/* countries */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.cg{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;min-width:0}
.cg.on{border-color:var(--hi);background:var(--hi-soft)}
.cg .f{display:block;font-size:28px;line-height:1.15}
.cg .n{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg .c{display:block;font-size:12px;color:var(--muted)}
/* years chart */
.yc{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:8px;direction:ltr}
.yc .y{flex:1;min-width:0;display:flex;flex-direction:column-reverse;gap:1px;cursor:pointer;height:100%;justify-content:flex-start;position:relative}
.yc .y u{display:block;border-radius:2px}
.yc .y.on{outline:2px solid var(--hi);outline-offset:1px;border-radius:3px}
.yx{display:flex;justify-content:space-between;direction:ltr;font-size:11.5px;color:var(--muted);margin-top:4px}
.ytip{margin-top:8px;font-size:13.5px;min-height:21px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
/* trip rows */
.yr{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--muted);padding:8px 14px 4px;background:var(--sunk)}
.tr .row{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;padding:10px 14px;cursor:pointer}
.tr .fl{flex:none;width:46px;font-size:21px;line-height:1.1;text-align:center;letter-spacing:1px;overflow:hidden}
.tr .b{flex:1;min-width:0}
.tr .t{font-family:var(--f-display);font-weight:700;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .s{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:13px;color:var(--muted);align-items:center}
.tr .s bdi{color:var(--ink);font-weight:700}
.tp{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:0 7px;color:#fff}
.tr .ch{flex:none;color:var(--muted);font-size:14px;transition:transform .2s}
.tr.open .ch{transform:rotate(-90deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.tr.open .det{grid-template-rows:1fr}
.det>div{overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;padding:0 14px 12px 14px;margin:0}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.new{font-size:11.5px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
/* costs */
.cr{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:14px}
.cr .fl{flex:none;width:30px;font-size:19px;text-align:center}
.cr .b{flex:1;min-width:0}.cr .b b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr .b small{color:var(--muted)}
.cr .v{flex:none;text-align:left;font-family:var(--f-display);font-weight:800}
.cr .v small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
/* insights */
.ins{display:grid}.ins details{border-top:1px solid var(--line)}.ins details:first-child{border-top:0}
.ins summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14.5px}
.ins summary::-webkit-details-marker{display:none}
.ins p{margin:0;padding:0 14px 12px;font-size:14px;line-height:1.55;color:var(--ink)}
.lnk{display:flex;flex-wrap:wrap;gap:8px}
.lnk a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
/* 1.1: Excel sync + trip-type icons (Oren 22.11.2026) */
.xl{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.xl a,.xl button{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:var(--hero-ink);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none}
.xl button{width:168px;justify-content:center}
.xl button[disabled]{opacity:.75;cursor:default}
.xl small{flex-basis:100%;color:var(--hero-muted);font-size:12.5px}
.ti{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ti svg{width:15px;height:15px;color:var(--tc,var(--muted))}
.tr .fi{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--hi)}
.tr .fi svg{width:20px;height:20px}
.ucd{flex:none;min-width:52px;text-align:center;border-radius:11px;background:var(--sunk);color:var(--hi);padding:4px 6px;line-height:1.05;font-variant-numeric:tabular-nums}
.ucd b{display:block;font-family:var(--f-display);font-size:20px}.ucd small{font-size:11.5px;font-weight:700}
.ucd.soon{background:var(--accent);color:var(--accent-ink)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
@media (max-width:420px){.kpi b{font-size:17px}.hero h1{font-size:22px}.kpis{gap:6px}.kpi{padding:8px 7px}}
</style>

<body>
<header class="hero"><div class="in" id="hero"></div></header>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="app"><div class="empty">טוען…</div></main>
  <footer id="foot"></footer>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u||"")?u:"";
const arr=a=>Array.isArray(a)?a:[];
const F=window.SQFlags,TI=window.SQTripIcons;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const isD=s=>/^\d{4}-\d\d-\d\d$/.test(s||"");
const yearOf=t=>{const m=/(\d{4})/.exec(String(t.from||""));return m?+m[1]:0;};
function rng(a,b){if(!isD(a))return String(a||"");const [ya,ma,da]=a.split("-").map(Number);if(!isD(b)||a===b)return `${da}.${ma}.${String(ya).slice(2)}`;const [yb,mb,db]=b.split("-").map(Number);
  return ma===mb&&ya===yb?`${da}–${db}.${mb}.${String(yb).slice(2)}`:`${da}.${ma}–${db}.${mb}.${String(yb).slice(2)}`;}
const nf=n=>Math.round(n).toLocaleString("en-US");
/* trip types as Oren names them in the Excel */
const TY={"המשפחה שלי":["המשפחה שלי","var(--c-fam)"],"ליאורי":["ליאורי","var(--c-cpl)"],"חברים":["חברים","var(--c-fr)"],"משפחה":["משפחה מורחבת","var(--c-ext)"],"עבודה":["עבודה","var(--c-work)"],"צבא":["צבא","var(--c-army)"]};
const TORD=["המשפחה שלי","ליאורי","חברים","משפחה","עבודה","צבא"];
const UI="sq_ab_ui";let ui={ty:"all",c:"",y:0,open:{}};try{Object.assign(ui,JSON.parse(sessionStorage.getItem(UI)||"{}"));}catch(e){}
function save(){try{sessionStorage.setItem(UI,JSON.stringify(ui));}catch(e){}}
let H=null,TR=[],db=null;
function ctry(t){return String(t.countries||"").split(/[,،]/).map(c=>c.replace(/\(.*?\)/g,"").trim()).filter(Boolean);}
function flags(t){return F?F.all(t.countries||"").join(""):"";}
/* history + booked trips that ended and are not in the Excel yet */
function all(){const T=arr(H&&H.trips).filter(t=>t&&t.n);const froms=new Set(T.map(t=>t.from));
  const extra=TR.filter(t=>t.stage==="booked"&&isD(t.to)&&t.to<today()&&!froms.has(t.from)).map(t=>({n:"",from:t.from,to:t.to,days:Math.round((new Date(t.to)-new Date(t.from))/864e5)+1,type:"המשפחה שלי",countries:t.country||"",cities:t.short||t.title,who:t.who,_new:1}));
  return T.concat(extra);}
function abroad(t){return ctry(t).length>0;}
function filt(L){return L.filter(t=>(ui.ty==="all"||(ui.ty==="vac"?t.type!=="עבודה"&&t.type!=="צבא":t.type===ui.ty))&&(!ui.c||ctry(t).includes(ui.c))&&(!ui.y||yearOf(t)===ui.y));}
function hero(L){const A=L.filter(abroad),cc=new Set();A.forEach(t=>ctry(t).forEach(c=>cc.add(c)));
  const y0=Math.min(...A.map(yearOf).filter(Boolean)),days=A.reduce((s,t)=>s+(+t.days||0),0);
  const vac=A.filter(t=>t.type!=="עבודה"&&t.type!=="צבא").length;
  const K=[[A.length,"נסיעות"],[cc.size,"מדינות"],[nf(days),"ימים בחו״ל"],[vac,"חופשות"]];
  return `<div class="top"><a class="sqhome" href="./"><span class="ar">→</span><img src="icon-192.png?v=2" alt=""><span>Side Quests</span></a></div>
  <h1>🌍 כל הנסיעות לחו״ל</h1>
  <p class="sub">מאז ${isFinite(y0)?y0:""} · ${esc(H&&H.source||"")}${H&&H.imported_at?" · עודכן "+esc(H.imported_at.split("-").reverse().join(".")):""}</p>
  <div class="kpis">${K.map(k=>`<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>${xlRow()}`;}
/* 1.1 (Oren 22.11.2026): the list IS the Excel. "⟳ עדכון מהאקסל" asks the server (sq-travel-sync) to read the file from
   Dropbox now; the same function runs by itself every morning and imports 5 days after he is back from any trip. */
const SYNC_URL="https://emgtyfksnofzzlutngbf.supabase.co/functions/v1/sq-travel-sync?action=sync",ANON="sb_publishable_Pa6-CuUavcT0rpD8ei_cxA_8oZ-Ykku";
let xlBusy=false,xlMsg="";
function dmy(iso){const d=new Date(iso);if(isNaN(d))return "";return d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric",timeZone:"Asia/Jerusalem"})+" "+d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"});}
function xlRow(){const u=safe(H&&H.excel_url)||safe((arr(H&&H.links).find(l=>/dropbox/.test(l.url||""))||{}).url),sy=H&&H.synced;
  const last=sy&&sy.at?`עודכן מהאקסל ${dmy(sy.at)}${sy.by==="auto"?" (אוטומטית, אחרי חזרה)":""}`:"";
  return `<div class="xl">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">📗 האקסל</a>`:""}<button type="button" id="xlb"${xlBusy?" disabled":""}>${xlBusy?"⏳ מעדכן…":"⟳ עדכון מהאקסל"}</button>
  <small>${esc(xlMsg||last)}${xlMsg?"":" · מתעדכן לבד 5 ימים אחרי כל חזרה"}</small></div>`;}
async function xlSync(){if(xlBusy)return;xlBusy=true;xlMsg="";render();
  try{const r=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON},body:"{}"});const j=await r.json().catch(()=>({}));
    xlMsg=j&&j.ok?(j.skip?"✓ עודכן לפני רגע":`✓ עודכן: ${j.n} נסיעות${j.added>0?`, ${j.added} חדשות`:""}`):"לא הצלחתי לקרוא את האקסל: "+((j&&j.err)||r.status);}
  catch(e){xlMsg="אין חיבור לשרת. נסה שוב עוד רגע";}
  xlBusy=false;render();}
function bar(L){const cnt=k=>L.filter(t=>abroad(t)&&(k==="all"||(k==="vac"?t.type!=="עבודה"&&t.type!=="צבא":t.type===k))).length;
  const B=[["all","הכול",""],["vac","חופשות",""],...TORD.map(k=>[k,TY[k][0],TY[k][1]])].filter(b=>cnt(b[0]));
  let o=`<div class="chips">${B.map(([k,l,c])=>`<button data-ty="${esc(k)}" class="${ui.ty===k?"on":""}">${c?`<i style="background:${c}"></i>`:""}${esc(l)} · ${cnt(k)}</button>`).join("")}</div>`;
  if(ui.c||ui.y)o+=`<div class="flt">${ui.c?`<span>${esc(F?F.of(ui.c):"")} ${esc(ui.c)}</span><button data-clr="c">✕</button>`:""}${ui.y?`<span>${ui.y}</span><button data-clr="y">✕</button>`:""}</div>`;
  return o;}
function upcoming(){const U=TR.filter(t=>(t.stage==="booked"||t.stage==="plan")&&!(isD(t.to)&&t.to<today())).sort((a,b)=>String(a.from).localeCompare(String(b.from)));
  if(!U.length)return "";
  // 1.1: same calm look as the cards in Travel: type icon, dates, and the countdown in days (hours under 24h)
  const cd=t=>{if(t.stage==="plan"||!TI||!isD(t.from))return "";const f=(Array.isArray(t.flights)?t.flights:[])[0];
    const [y,m,d]=t.from.split("-").map(Number),[hh,mm]=f&&/^\d{1,2}:\d\d$/.test(f.dep||"")?f.dep.split(":").map(Number):[0,0];
    const L=TI.left(Date.UTC(y,m-1,d,hh,mm)-2*36e5);return L?`<span class="ucd${L.soon?" soon":""}"><b>${L.v}</b><small>${L.u}</small></span>`:"";};
  return `<section class="calm-off"><div class="sh"><h2>✈️ הנסיעות הבאות</h2><small>${U.length}</small></div><div class="list">${U.map(t=>`<div class="tr"><div class="row" style="cursor:default"><span class="fi">${TI?TI.svg(TI.key(t)):""}</span><span class="b"><span class="t">${esc(t.title||"")} ${esc(String(t.flag||"").match(/(?:[\u{1F1E6}-\u{1F1FF}]{2})/gu)?.join("")||"")}</span><span class="s">${t.stage==="plan"?`<span>${esc(t.when||"בתכנון")}</span>`:`<bdi dir="ltr">${esc(rng(t.from,t.to))}</bdi>`}${t.who?`<span>${esc(t.who)}</span>`:""}</span></span>${cd(t)}</div></div>`).join("")}</div></section>`;}
function countries(L){const M={};L.filter(abroad).forEach(t=>ctry(t).forEach(c=>{M[c]=(M[c]||0)+1;}));
  const C=Object.entries(M).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"he"));
  return `<section><div class="sh"><h2>🗺️ מדינות</h2><small>${C.length}</small></div><div class="cgrid">${C.map(([c,n])=>`<button class="cg${ui.c===c?" on":""}" data-c="${esc(c)}"><span class="f">${esc(F?F.of(c)||"🏳️":"")}</span><span class="n">${esc(c)}</span><span class="c">${n} ${n===1?"נסיעה":"נסיעות"}</span></button>`).join("")}</div></section>`;}
function years(L){const A=L.filter(t=>abroad(t)&&yearOf(t)),ys=A.map(yearOf);if(!ys.length)return "";
  const y0=Math.min(...ys),y1=Math.max(new Date().getFullYear(),...ys);const by={};A.forEach(t=>{const y=yearOf(t);(by[y]=by[y]||[]).push(t);});
  const mx=Math.max(...Object.values(by).map(a=>a.length));let cols="";
  for(let y=y0;y<=y1;y++){const a=by[y]||[];cols+=`<div class="y${ui.y===y?" on":""}" data-y="${y}" title="${y}">${TORD.map(k=>{const n=a.filter(t=>t.type===k).length;return n?`<u style="height:${n/mx*100}%;background:${TY[k][1]}"></u>`:"";}).join("")}</div>`;}
  const top=Object.entries(by).sort((a,b)=>b[1].length-a[1].length)[0];
  return `<section><div class="sh"><h2>📈 לפי שנים</h2><small>שיא: ${top?top[0]+" ("+top[1].length+")":""}</small></div><div class="card"><div class="yc">${cols}</div><div class="yx"><span>${y0}</span><span>${Math.round((y0+y1)/2)}</span><span>${y1}</span></div>
  <div class="legend">${TORD.filter(k=>A.some(t=>t.type===k)).map(k=>`<span><i style="background:${TY[k][1]}"></i>${TY[k][0]}</span>`).join("")}</div>
  <div class="ytip">${ui.y&&by[ui.y]?`<b>${ui.y}</b>: ${by[ui.y].length} נסיעות, ${by[ui.y].reduce((s,t)=>s+(+t.days||0),0)} ימים · ${[...new Set(by[ui.y].flatMap(ctry))].map(c=>(F?F.of(c):"")).join(" ")}`:"לחיצה על שנה מסננת את הרשימה"}</div></div></section>`;}
function costs(L){const C=L.filter(t=>+t.cost_total>0).sort((a,b)=>String(b.from).localeCompare(String(a.from)));if(!C.length)return "";
  const sum=C.reduce((s,t)=>s+(+t.cost_total),0);
  return `<section><div class="sh"><h2>💰 עלויות חופשות</h2><small>${C.length} עם עלות · ₪${nf(sum)}</small></div><div class="list">${C.map(t=>`<div class="cr"><span class="fl">${esc(flags(t))}</span><span class="b"><b>${esc(t.cities||t.countries)}</b><small><bdi dir="ltr">${esc(rng(t.from,t.to))}</bdi> · ${esc((TY[t.type]||[t.type])[0])}</small></span><span class="v">₪${nf(+t.cost_total)}${+t.cost_key?`<small>₪${nf(+t.cost_key)} לאדם ליום</small>`:""}</span></div>`).join("")}</div></section>`;}
function row(t){const k=String(t.n||t.from),o=ui.open[k],ty=TY[t.type]||[t.type||"",""];
  const kv=[["עם מי",t.who],["ערים",t.cities],["עצירות בדרך",t.stops],["לינה",t.stay],["הערה",t.note],["אלבום",t.album],["עלות",+t.cost_total?"₪"+nf(+t.cost_total)+(+t.cost_key?" · ₪"+nf(+t.cost_key)+" לאדם ליום":""):""]].filter(x=>x[1]);
  const city=String(t.cities||"").split(/[,،.]/)[0].trim();
  return `<div class="tr${o?" open":""}" data-sq-item="${esc(k)}"><button class="row" data-x="${esc(k)}"><span class="fl">${esc(flags(t)||"🏳️")}</span>
  <span class="b"><span class="t">${t.n?"#"+esc(t.n)+" ":""}${esc(ctry(t).join(", "))}${city?" · "+esc(city):""}</span>
  <span class="s"><bdi dir="ltr">${esc(rng(t.from,t.to))}</bdi>${+t.days?`<span>${+t.days} ימים</span>`:""}${ty[0]?`<span class="ti" style="--tc:${ty[1]||"var(--muted)"}">${TI?TI.svg(TI.key(t)):""}${esc(ty[0])}</span>`:""}${t._new?'<span class="new">חדש, עוד לא באקסל</span>':""}</span></span><span class="ch">‹</span></button>
  <div class="det"><div><dl class="kv">${kv.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div></div></div>`;}
function list(L){const A=filt(L).filter(abroad).sort((a,b)=>String(b.from).localeCompare(String(a.from)));
  if(!A.length)return `<section><div class="sh"><h2>🧳 כל הנסיעות</h2></div><div class="list"><div class="empty">אין נסיעות בסינון הזה</div></div></section>`;
  let o="",y=null;A.forEach(t=>{const yy=yearOf(t);if(yy!==y){y=yy;o+=`<div class="yr">${yy||"?"}</div>`;}o+=row(t);});
  return `<section id="all"><div class="sh"><h2>🧳 כל הנסיעות</h2><small>${A.length}</small></div><div class="list">${o}</div></section>`;}
function insights(){const I=arr(H&&H.insights).filter(x=>x&&x.title&&x.text);if(!I.length)return "";
  return `<section><div class="sh"><h2>💡 תובנות</h2><small>${I.length}</small></div><div class="list ins">${I.map(x=>`<details><summary>${esc(x.title)}</summary><p>${esc(x.text)}</p></details>`).join("")}</div></section>`;}
function links(){const L=arr(H&&H.links).filter(l=>safe(l.url));if(!L.length)return "";
  return `<section class="calm-off"><div class="lnk">${L.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></section>`;}
function render(){if(!H)return;const L=all();
  $("hero").innerHTML=hero(L);$("bar").innerHTML=bar(L);
  $("app").innerHTML=upcoming()+list(L)+countries(filt(L))+years(ui.y?L:filt(L))+costs(filt(L))+insights()+links();
  $("foot").innerHTML=`כל הנסיעות ${esc(window.AB_BUILD)} · מהאקסל של אורן (Dropbox) ומהנסיעות שהוזמנו`;
  if(window.SQCalm&&SQCalm.refresh)try{SQCalm.refresh();}catch(e){}}
document.addEventListener("click",e=>{
  if(e.target.closest("#xlb")){xlSync();return;}
  const t=e.target.closest("[data-ty]");if(t){ui.ty=t.dataset.ty;save();render();return;}
  const c=e.target.closest("[data-c]");if(c){ui.c=ui.c===c.dataset.c?"":c.dataset.c;save();render();const a=$("all");if(a)a.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const y=e.target.closest("[data-y]");if(y){ui.y=ui.y===+y.dataset.y?0:+y.dataset.y;save();render();return;}
  const r=e.target.closest("[data-clr]");if(r){ui[r.dataset.clr]=r.dataset.clr==="y"?0:"";save();render();return;}
  const x=e.target.closest("[data-x]");if(x){const k=x.dataset.x;ui.open[k]=!ui.open[k];save();x.parentElement.classList.toggle("open",!!ui.open[k]);}
});
window.claude.use("db").then(d=>{db=d;if(!db)return;
  db.doc("settings/travel_history").onSnapshot(x=>{H=x&&x.exists?x.data():{trips:[]};render();},()=>{});
  db.collection("trips").onSnapshot(q=>{TR=[];q.docs.forEach(x=>{const v=x.data();if(v&&!v._deleted)TR.push(Object.assign({id:x.id},v));});render();},()=>{});
});
})();
</script>
<script src="sq-tel.js?v=3" defer></script>
<script src="sq-calm.js?v=3"></script>
