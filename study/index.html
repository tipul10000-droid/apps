<style>
:root{--bg:#eef1f5;--fg:#1f2933;--mut:#5b6675;--card:#fff;--bd:#d3d9e2;--ac:#2f5d9e;--sh:0 1px 2px rgba(31,41,51,.06),0 4px 14px rgba(31,41,51,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;color:var(--fg);font:18px system-ui,Arial,sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(47,93,158,.058) 1px,transparent 1px),linear-gradient(90deg,rgba(47,93,158,.058) 1px,transparent 1px);background-size:24px 24px}
main{max-width:560px;margin:0 auto;padding:12px 16px;min-height:calc(100vh - 36px);display:flex;flex-direction:column;justify-content:safe center;box-sizing:border-box}
header{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
header img{display:block;width:100%;max-width:400px;height:auto;aspect-ratio:1200/398;margin:0 auto}
h1{margin:0;font-size:0;line-height:0}header{flex:none;display:block!important}@media(max-height:700px){header img{max-width:290px}}@media(max-height:640px){header img{max-width:240px}}
.grp{margin:0;padding:12px 0;display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.kids{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.kw{flex:0 1 150px;height:150px;min-height:80px;position:relative;display:flex}.kid{flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 16px 8px 12px;box-shadow:var(--sh);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transition:background-color .12s}
.kid:active{background:#f1f4f8}
.kid img{height:100%;width:80px;flex:none;object-fit:contain;object-position:center bottom;pointer-events:none;-webkit-user-drag:none}
.kid .tx{flex:1;min-width:0}
.kid b{display:block;font-size:24px}
.kid small{display:block;font-size:15px;color:var(--mut);margin-top:3px}
.kid .go{color:var(--ac);font-size:26px}
.kid.soon small{color:#8a94a3}
.rq{position:absolute;left:12px;top:50%;margin-top:-14px;height:28px;box-sizing:border-box;font:inherit;font-size:13px;line-height:1;padding:6px 10px;border-radius:12px;border:1px solid #c9d7ee;background:#eef3fb;color:var(--ac);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}.rq:active{background:#dfe8f6}.kw .kid .go{display:none}.kw .kid{padding-left:16px}.kw.hq .kid{padding-left:136px}.rq{display:none;width:118px;text-align:center}.kw.hq .rq{display:block}.kw:not(.hq) .kid .go{display:block}.rq.lk{background:#f3f4f6;color:#6b7280;border-color:#d1d5db;font-variant-numeric:tabular-nums}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0;flex:none}
.tb{height:66px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;box-shadow:var(--sh);font:inherit;text-align:right;cursor:pointer}
.tb{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}.tb:active{background:#f1f4f8}.tb svg,.tb .gi{pointer-events:none}.tb svg{width:46px;height:36px;flex:none}.tb .gi{font-size:26px;width:40px;text-align:center;flex:none}
.tb>span{flex:1 1 0;min-width:0}.tb b,.tb small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb b{font-size:16px;line-height:21px}.tb small{font-size:12px;line-height:16px;color:var(--mut)}
@media(max-width:360px){.tb{padding:8px 6px;gap:4px}.tb svg{width:34px;height:28px}.tb .gi{width:26px;font-size:21px}.tb b{font-size:14px}.tb small{font-size:11px}}
.ov{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:16px}.ov.on{display:flex}
.pn{background:var(--card);border-radius:20px;padding:18px 16px;width:100%;max-width:420px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pn img{width:80px;height:150px;object-fit:contain;object-position:center bottom}
.pn h2{margin:6px 0 6px;font-size:22px}.pn p{margin:4px 0;font-size:16px;line-height:1.45;color:var(--mut)}.pn p b{color:var(--fg)}
.pn .bt{display:block;width:100%;margin-top:10px;padding:13px;font:inherit;font-size:17px;border-radius:14px;cursor:pointer;border:1px solid var(--bd);background:#f4f6f9;color:var(--fg)}
.pn .bt.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.pn .bt.g{background:#fff7e6;border-color:#fcd9a8;color:#9a3412}
.qpn{height:min(560px,calc(100dvh - 32px));display:flex;flex-direction:column;text-align:center}
.qh{display:flex;align-items:center;gap:10px;text-align:right;flex:none}.qh img{width:46px;height:80px;object-fit:contain;object-position:center bottom}.qh b{display:block;font-size:19px}.qh small{display:block;font-size:14px;color:var(--mut)}
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0 6px;flex:none}.dots i{width:30px;height:7px;border-radius:4px;background:#e3e8ef}.dots i.cur{background:#9db4d6}.dots i.on{background:var(--ac)}
.qq{font-size:18px;font-weight:700;line-height:1.35;min-height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex:none}.qb{height:56px;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:12px;background:#f4f6f9;color:var(--fg);cursor:pointer;padding:4px 6px;-webkit-tap-highlight-color:transparent}
.qb.y{background:#dcfce7;border-color:#16a34a}.qb.n{background:#fee2e2;border-color:#dc2626}
.qm{height:24px;margin:8px 0 0;font-size:15px;font-weight:600;color:var(--ac);flex:none}
.qpn .bt{flex:none}
@keyframes qzg{0%,100%{box-shadow:0 0 0 2px #f59e0b,0 0 8px 2px rgba(245,158,11,.45)}50%{box-shadow:0 0 0 2px #f59e0b,0 0 18px 6px rgba(245,158,11,.75)}}#qzskip.glow{animation:qzg 1.3s ease-in-out infinite}</style></head><body><main>
<header><h1><img src="banner.png?v=1" alt="Study Monster" width="1200" height="398"></h1></header>
<div class="grp"><nav class="kids">
<div class="kw"><a class="kid" href="evyatar/"><img src="kids/evyatar.webp" alt=""><span class="tx"><b>אביתר</b><small>אוצר מילים באנגלית</small></span><span class="go">‹</span></a><button class="rq" type="button" data-k="evyatar">🎯 חידון כניסה</button></div>
<div class="kw"><a class="kid" href="dani/"><img src="kids/dani.webp" alt=""><span class="tx"><b>דני</b><small>הכתבה ואוצר מילים באנגלית</small></span><span class="go">‹</span></a><button class="rq" type="button" data-k="dani">🎯 חידון כניסה</button></div>
<div class="kw"><a class="kid soon" href="lia/"><img src="kids/lia.webp" alt=""><span class="tx"><b>ליה</b><small>בקרוב</small></span><span class="go">‹</span></a><button class="rq" type="button" data-k="lia">🎯 חידון כניסה</button></div>
</nav>
<div class="tops" id="tops">
<a class="tb" href="parents/"><svg viewBox="0 0 64 48" aria-hidden="true"><circle cx="21" cy="22" r="13" fill="#7a4a2a"/><path d="M8 26c0 14 4 18 4 18h18s4-4 4-18" fill="#7a4a2a"/><circle cx="21" cy="24" r="10" fill="#ffd9bf"/><path d="M11 21c2-9 18-11 21-1-6-2-14-4-21 1z" fill="#7a4a2a"/><circle cx="17.5" cy="25" r="1.4" fill="#3b2a1f"/><circle cx="24.5" cy="25" r="1.4" fill="#3b2a1f"/><path d="M18.5 29q2.5 2 5 0" stroke="#c2410c" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="14.5" cy="28" r="1.8" fill="#fda4af" opacity=".7"/><circle cx="27.5" cy="28" r="1.8" fill="#fda4af" opacity=".7"/><path d="M9 48c1-7 6-10 12-10s11 3 12 10z" fill="#f472b6"/>
<circle cx="44" cy="24" r="10.5" fill="#ffd9bf"/><path d="M33.5 22c0-8 5-11 10.5-11s11 3 10.5 11c-3-4-8-5-10.5-5s-7.5 1-10.5 5z" fill="#3b2a1f"/><circle cx="40" cy="25" r="3.2" fill="none" stroke="#334155" stroke-width="1.1"/><circle cx="48" cy="25" r="3.2" fill="none" stroke="#334155" stroke-width="1.1"/><path d="M43.2 25h1.6" stroke="#334155" stroke-width="1.1"/><circle cx="40" cy="25" r="1.2" fill="#3b2a1f"/><circle cx="48" cy="25" r="1.2" fill="#3b2a1f"/><path d="M41.5 30q2.5 2 5 0" stroke="#c2410c" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M32 48c1-7 6-10 12-10s11 3 12 10z" fill="#2f5d9e"/><path d="M32 8c-1.6-2.4-5-1-3.6 1.8L32 13l3.6-3.2C37 7 33.6 5.6 32 8z" fill="#f43f5e"/></svg><span><b>אזור הורים</b><small>התקדמות הילדים</small></span></a>
<button class="tb" type="button" id="gst"><span class="gi">🧪</span><span><b>מצב אורח</b><small>בלי להשפיע</small></span></button>
</div></div>
<script src="qbank.js?v=2"></script>
<script>
(function(){var b=document.getElementById('gst');if(window.STUDY_GUEST){b.innerHTML='<span class="gi">🚪</span><span><b>יציאה מאורח</b><small>חזרה לרגיל</small></span>';b.onclick=function(){studyGuest(false,location.pathname)}}else b.onclick=function(){studyGuest(true,location.pathname)}})();
</script>
<div class="ov" id="qlk"><div class="pn"><h2>⏳ חידון הכניסה נח קצת</h2><p id="qlkt"></p><div id="qlkc" style="font-size:36px;font-weight:700;color:var(--ac);direction:ltr;font-variant-numeric:tabular-nums;margin:8px 0">2:00:00</div><button class="bt pr" id="qlkg" type="button"></button><button class="bt" id="qlkb" type="button">→ חזרה למסך הראשי</button></div></div>
<div class="ov" id="who"><div class="pn"><img id="whoi" alt=""><h2 id="whot"></h2><p id="whop"></p><p id="whog"></p>
<button class="bt pr" id="whoy" type="button"></button><button class="bt g" id="whogb" type="button">🧪 כניסה במצב אורח</button><button class="bt" id="whob" type="button">→ חזרה למסך הראשי</button></div></div>
<div class="ov" id="qz"><div class="pn qpn"><div class="qh"><img id="qzi" alt=""><div><b id="qzt"></b><small id="qzs"></small></div></div>
<div class="dots" id="qzd"><i></i><i></i><i></i></div><div class="qq" id="qzq"></div><div class="qo" id="qzo"></div><div class="qm" id="qzm"></div><div style="flex:1"></div>
<button class="bt g" id="qzskip" type="button">🙈 אין לי מושג, תכניסו אותי</button><button class="bt" id="qzb" type="button">→ חזרה למסך הראשי</button></div></div>
<script>
// כניסה לאזור של ילד (אורן 6.11.2026): פעם ראשונה במכשיר: "האזור של X בלבד" ← "אני X" ← 3 שאלות שרק הילד יודע (טעות = מתחילים מחדש).
// אחרי שעבר: נשמר study_ok_<kid> ונכנסים ישר. במצב אורח: ישר לשאלות, עם כפתור עקיפה (רק לאורח).
(function(){
 var K=window.QBANK,cur=[];
 // 3 שאלות אקראיות מהמאגר: אחת מכל רמה, מהקלה לקשה
 function pickQ(){var q=K[kid].q;cur=[1,2,3].map(function(l){var a=q.filter(function(x){return x[2]===l});return a[Math.floor(Math.random()*a.length)]})}
 var $=function(i){return document.getElementById(i)},ov=$('who'),qz=$('qz'),go=null,kid=null,qi=0,lock=false;
 function ok(id){try{return localStorage.getItem('study_ok_'+id)==='1'}catch(e){return false}}
 function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
 function ask(){lock=false;var q=cur[qi];$('qzq').textContent=q[0];$('qzm').textContent='';
  [].forEach.call($('qzd').children,function(d,i){d.className=i<qi?'on':i===qi?'cur':''});
  $('qzo').innerHTML='';shuf(q[1]).forEach(function(o){var b=document.createElement('button');b.type='button';b.className='qb';b.textContent=o;
   b.onclick=function(){if(lock)return;lock=true;if(o===q[1][0]){b.classList.add('y');qi++;
     if(qi>=3){[].forEach.call($('qzd').children,function(d){d.className='on'});$('qzm').textContent=(kid==='evyatar'?'ידעתי שזה אתה':'ידעתי שזו את')+'! נכנסים... 🎉';if(REP){var r=qget(kid);r.n=(r.n||0)+1;if(r.n>=2){r.until=Date.now()+2*36e5;r.n=0}qset(kid,r)}try{if(!window.STUDY_GUEST)localStorage.setItem('study_ok_'+kid,'1')}catch(e){}setTimeout(function(){location.href=go},700)}
     else{$('qzm').textContent='נכון! ✨';setTimeout(ask,450)}}
    else{b.classList.add('n');$('qzm').textContent='אופס, זו לא התשובה. מתחילים מההתחלה 🙃';if(window.STUDY_GUEST)$('qzskip').classList.add('glow');setTimeout(function(){qi=0;pickQ();ask()},1100)}};$('qzo').appendChild(b)})}
 function quiz(rep){REP=!!rep;qi=0;pickQ();var k=K[kid];$('qzi').src='kids/'+kid+'.webp';$('qzt').textContent='רק '+k.n+' יודע'+(kid==='evyatar'?'':'ת')+' את התשובות!';$('qzs').textContent=k.t;
  $('qzskip').style.display=window.STUDY_GUEST?'':'none';$('qzskip').classList.remove('glow');ov.classList.remove('on');qz.classList.add('on');ask()}
 document.querySelectorAll('a.kid').forEach(function(a){a.addEventListener('click',function(ev){var id=a.getAttribute('href').replace('/',''),k=K[id];if(!k)return;go=a.href;kid=id;
  if(window.STUDY_GUEST){ev.preventDefault();return quiz()}
  if(ok(id)){qset(id,Object.assign(qget(id),{n:0}));return}ev.preventDefault();var n=k.n;$('whoi').src='kids/'+id+'.webp';
  $('whot').textContent='האזור של '+n+' בלבד';$('whop').innerHTML='כל התקדמות מכאן תירשם בהישגים של <b>'+n+'</b>.';
  $('whog').textContent='לא '+n+'? אפשר להיכנס במצב אורח, בלי להשפיע.';$('whoy').textContent='אני '+n+', להמשיך ←';ov.classList.add('on')})});
 $('whoy').onclick=function(){quiz()};
 // 🎯 חידון: נכנסים לאזור של הילד דרך השאלות, גם אם כבר עברו אותן (משחק צד)
 // חידון כניסה (אורן 6.11.2026): הכפתור מופיע רק למי שכבר עבר את החידון. אחרי 2 חידונים ברצף בלי להיכנס ללמוד דרך הכרטיס: נעול לשעתיים עם ספירה לאחור.
 var REP=false;
 function qget(k){try{return JSON.parse(localStorage.getItem('study_qz_'+k))||{}}catch(e){return{}}}
 function qset(k,v){try{localStorage.setItem('study_qz_'+k,JSON.stringify(v))}catch(e){}}
 function left(k){return Math.max(0,(qget(k).until||0)-Date.now())}
 function hms(ms,sec){var t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return h+':'+(m<10?'0':'')+m+(sec?':'+(x<10?'0':'')+x:'')}
 var LK=null;
 function tick(){document.querySelectorAll('.rq').forEach(function(b){var k=b.dataset.k,w=b.parentNode,l=left(k);w.classList.toggle('hq',!window.STUDY_GUEST&&ok(k));b.classList.toggle('lk',l>0);b.textContent=l>0?'⏳ '+hms(l+59e3):'🎯 חידון כניסה'});
  if(LK){var l=left(LK);if(l<=0){$('qlk').classList.remove('on');LK=null}else $('qlkc').textContent=hms(l,1)}}
 tick();setInterval(tick,1000);
 document.querySelectorAll('.rq').forEach(function(b){b.onclick=function(){var a=b.parentNode.querySelector('a.kid'),k=b.dataset.k;kid=k;go=a.href;
  if(left(k)>0){var boy=k==='evyatar';LK=k;$('qlkt').innerHTML='אפשר לעשות את חידון הכניסה שוב רק בעוד שעתיים.<br>עכשיו הזמן ללמוד, אז '+(boy?'תיכנס ותלמד':'תיכנסי ותלמדי')+' עם חיוך 😊';$('qlkg').textContent=(boy?'נכנס':'נכנסת')+' ללמוד ←';tick();$('qlk').classList.add('on');return}
  quiz(true)}});
 $('qlkg').onclick=function(){qset(kid,Object.assign(qget(kid),{n:0}));location.href=go};
 $('qlkb').onclick=function(){$('qlk').classList.remove('on');LK=null};
 $('whogb').onclick=function(){studyGuest(true,location.pathname+'?gq='+kid)};
 $('whob').onclick=function(){ov.classList.remove('on')};
 $('qzb').onclick=function(){qz.classList.remove('on')};
 $('qzskip').onclick=function(){if(go)location.href=go};
 [ov,qz].forEach(function(o){o.addEventListener('click',function(ev){if(ev.target===o)o.classList.remove('on')})});
 // כניסה כאורח מחלון "האזור של X": נטען מחדש במצב אורח וישר לשאלות של אותו ילד
 (function(){var m=/[?&]gq=([a-z]+)/.exec(location.search);if(!m)return;try{history.replaceState(null,'',location.pathname)}catch(e){}
  var a=document.querySelector('a.kid[href="'+m[1]+'/"]');if(!window.STUDY_GUEST||!a||!K[m[1]])return;kid=m[1];go=a.href;quiz()})()})();
</script>
</main></body></html>
