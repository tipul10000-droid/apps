<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Study">
<style>
:root{--bg:#f4f6fb;--fg:#1b1f2a;--card:#fff;--bd:#d6dbe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--fg:#eceff5;--card:#1e222b;--bd:#343a48}}
:root[data-theme="dark"]{--bg:#14161c;--fg:#eceff5;--card:#1e222b;--bd:#343a48}
body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
header img{width:56px;height:56px;border-radius:14px}
h1{margin:0;font-size:26px}header p{margin:2px 0 0;font-size:15px;opacity:.75}
.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kid{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--c);border-radius:20px;padding:10px 6px 12px;overflow:hidden;position:relative}
.kid:before{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:var(--c);opacity:.18}
.kid:active{transform:scale(.97)}
.kid img{height:190px;max-width:100%;object-fit:contain;position:relative}
.kid b{font-size:21px;margin-top:8px;position:relative}
.kid small{font-size:13px;opacity:.75;position:relative;margin-top:2px;text-align:center}
@media(max-width:360px){.kid img{height:150px}.kid b{font-size:18px}}
</style></head><body><main>
<header><img src="icon.svg" alt=""><div><h1>מי לומד עכשיו?</h1><p>לוחצים על השם שלך</p></div></header>
<nav class="kids">
<a class="kid" href="evyatar/" style="--c:#4d9bff"><img src="kids/evyatar.webp" alt=""><b>אביתר</b><small>אוצר מילים באנגלית</small></a>
<a class="kid" href="dani/" style="--c:#ff6fb5"><img src="kids/dani.webp" alt=""><b>דני</b><small>בקרוב</small></a>
<a class="kid" href="lia/" style="--c:#8fe04a"><img src="kids/lia.webp" alt=""><b>ליה</b><small>בקרוב</small></a>
</nav>
</main></body></html>
