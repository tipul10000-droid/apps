<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Study Monster · ליה</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-64.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">

<style>
/* תוכן בבדיקה = "בקרוב" (לא לחיץ). אחרי אישור ההורים: סרט "חדש!" חגיגי */
.item.soon{opacity:.6;pointer-events:none;border-style:dashed}.item.soon .go{visibility:hidden}
.item{position:relative;overflow:hidden}.nwr{position:absolute;top:5px;left:-29px;width:94px;transform:rotate(-35deg);text-align:center;font:800 11px/18px system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(90deg,#ff5fa2,#ffb36b,#ff5fa2);background-size:200% 100%;animation:nwr 2.2s linear infinite;box-shadow:0 2px 6px rgba(255,95,162,.45);pointer-events:none}
@keyframes nwr{to{background-position:200% 0}}
</style>
</head><body><main>
<a class="back" href="../">→ כל הילדים</a>
<div class="top"><img src="../kids/lia.webp" alt=""><div><h1>היי ליה!</h1><p>מה לומדים היום?</p></div></div>
<div class="list">
<a class="item" id="mxi" data-c="lia/mult" data-gen="1" href="mult/"><span class="ic">✖️</span><span class="tx"><b>לוח הכפל: חוקרת חרקי חלל</b><small id="mx">6 כוכבים, 6 סקווישים חדשים 🐞</small><div class="bar"><i id="mxb" style="width:0"></i></div></span><span class="go">›</span></a>
<a class="item" id="phi" data-c="lia/phonics" data-gen="1" href="phonics/"><span class="ic">🔤</span><span class="tx"><b>אותיות וצלילים באנגלית</b><small id="ph">35 צלילים, בהגייה אמריקאית</small><div class="bar"><i id="phb" style="width:0"></i></div></span><span class="go">›</span></a>
</div>
<div class="tools"><div id="rqm"></div><div id="pbm"></div></div>
<script>
// לפני אישור ההורים: "בקרוב" (אורן 6.11.2026). אחרי אישור: לחיץ, עם סרט "חדש!" עד הכניסה הראשונה.
function phGate(){var a=document.getElementById('phi'),ok=StudyContent.ok('lia/phonics');a.classList.toggle('soon',!ok);
 if(!ok){document.getElementById('ph').textContent='בקרוב! 🚧 אבא ואמא מכינים לך משהו מיוחד';return}
 if(StudyContent.isNew('lia/phonics')&&!a.querySelector('.nwr')){var r=document.createElement('span');r.className='nwr';r.textContent='חדש! ✨';a.appendChild(r)}}
phGate();StudyContent.refresh(function(){location.reload()});
// לוח הכפל (11.11.2026): אותו שער של אישור הורים
(function(){var a=document.getElementById('mxi'),ok=StudyContent.ok('lia/mult');a.classList.toggle('soon',!ok);
 if(!ok){document.getElementById('mx').textContent='בקרוב! 🚧 אבא ואמא מכינים לך משהו מיוחד';return}
 if(StudyContent.isNew('lia/mult')&&!a.querySelector('.nwr')){var r=document.createElement('span');r.className='nwr';r.textContent='חדש! ✨';a.appendChild(r)}
 try{var s=JSON.parse(localStorage.getItem('lia_mx'));if(s&&s.md){var n=Object.keys(s.md).length;document.getElementById('mx').textContent=n>=6?'כל 6 הכוכבים! ⚡ שליפה מהירה':'סיימת '+n+' מתוך 6 כוכבים 🐞';document.getElementById('mxb').style.width=(n/6*100)+'%'}}catch(e){}})();
</script>
<script>if(StudyContent.ok('lia/phonics'))try{var s=JSON.parse(localStorage.getItem('lia_ph'));if(s&&s.w){var n=0;for(var k in s.w)if(s.w[k].s==='done')n++;if(s.T){document.getElementById('ph').textContent='את יודעת '+n+' מתוך 35 צלילים';document.getElementById('phb').style.width=(n/35*100)+'%'}}}catch(e){}</script>
<script src="../kidlist.js?v=6"></script><script>StudyList.init('lia')</script>
<script src="../req.js?v=5"></script><script>StudyReq.mount('lia',false)</script>
<script src="../push.js?v=4"></script><script>StudyPush.kid(document.getElementById('pbm'),'lia',false)</script>
</main></body></html>
