 KIDS.forEach(k=>{const box=$('rq_'+k.id);if(!box)return;const L=j.items.filter(x=>x.kid===k.id),open=L.filter(x=>!x.done).length;
  const O=L.filter(x=>!x.done),D=L.filter(x=>x.done),row=x=>`<div class="rq${x.done?' dn':''}"><div class="t"><span>${RQK[x.kind]||''}</span><span>${ago(x.at)}</span></div><div class="tx">${esc(x.txt)}</div><div class="a">${x.done?`<span class="none" style="font-size:13px">✓ טופל ${x.done_at?ago(x.done_at):''}</span><button class="lnk" type="button" data-q="${x.id}|open">↩ לא טופל</button>`:`<button class="lnk" type="button" data-q="${x.id}|done">✓ טופל</button>`}<button class="lnk" type="button" data-q="${x.id}|hide">הסתרה</button></div></div>`;
  box.innerHTML=`<h3>💬 בקשות והצעות${open?` (${open===1?"1 פתוחה":open+" פתוחות"})`:''}</h3>`+(O.length?O.slice(0,30).map(row).join(''):`<div class="none">${L.length?'אין בקשות פתוחות 👍':'עוד לא '+(!!k.boy?'שלח':'שלחה')+' בקשות'}</div>`)+
   (D.length?`<details class="arc"${ARC[k.id]?' open':''} data-k="${k.id}"><summary>📦 ארכיון: טופלו (${D.length})</summary>${D.slice(0,30).map(row).join('')}<div class="none" style="font-size:12px;margin-top:6px">${!!k.boy?'הוא מקבל':'היא מקבלת'} הודעה "✅ אבא ואמא טיפלו בזה" כשנכנס${!!k.boy?'':'ת'} לדף ${!!k.boy?'שלו':'שלה'}.</div></details>`:'');
  RQO[k.id]=O.length;drawNeed(k)});
 V.querySelectorAll('details.arc').forEach(d=>d.ontoggle=()=>{ARC[d.dataset.k]=d.open})
 V.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [i,s]=b.dataset.q.split('|');if(s==='hide'&&!confirm('להסתיר את הבקשה?'))return;b.textContent='...';loadReq(+i,s)})}).catch(()=>{})}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
// דאבל-טאפ: באייפון user-scalable=no לא עובד. touch-action:manipulation מבטל זום בהקשה כפולה, ולמקרה שלא: הקשה שנייה מהירה לא מגיעה לזום, והלחיצה נשלחת ידנית.
var lastT=0;document.addEventListener('touchend',function(ev){var n=Date.now(),t=ev.target;if(n-lastT<350&&ev.cancelable&&!(t.closest&&t.closest('input,textarea,select,[contenteditable]'))){ev.preventDefault();if(t.click)t.click();else if(t.dispatchEvent)t.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))}lastT=n},{passive:false});
document.addEventListener('touchstart',function(ev){if(ev.touches.length>1)ev.preventDefault()},{passive:false});
document.addEventListener('dblclick',function(ev){ev.preventDefault()},{passive:false});

if(PIN)load();else pinView();
</script>
