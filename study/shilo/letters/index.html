// גן חובה, לפי "תשתית לשפה אוריינית בגן" של משרד החינוך: צליל פותח, הברות, אותיות לפי צורה, שם וצליל. בלי קריאת מילים: הכל בקול.
// 22 אותיות ב-4 קבוצות, מילה + ציור לכל אות. סיבוב = 6 שאלות, ובסוף צובעים ציור (נשמר באלבום).
// מפתחות: shilo_lt (התקדמות), shilo_sq (סקווישים, כמו ב-profiles.js), shilo_lt_col (האלבום), shilo_lt_mute.

const G=[
[['ש','שִׁין','שֶׁ','שֶׁמֶשׁ',['שֶׁ','מֶשׁ'],'☀️','shemesh'],['מ','מֵם','מְ','מְכוֹנִית',['מְ','כוֹ','נִית'],'🚗','mechonit'],['ב','בֵּית','בַּ','בַּיִת',['בַּ','יִת'],'🏠','bayit'],['ל','לָמֶד','לִי','לִימוֹן',['לִי','מוֹן'],'🍋','limon'],['ד','דָּלֶת','דָּ','דָּג',['דָּג'],'🐟','dag'],['פ','פֵּא','פַּ','פַּטִּישׁ',['פַּ','טִּישׁ'],'🔨','patish']],

const IT=[],BY={};G.forEach((g,gi)=>g.forEach(r=>{const o={l:r[0],nm:r[1],snd:r[2],w:r[3],syl:r[4],e:r[5],pk:r[6],g:gi};IT.push(o);BY[o.l]=o}));
const N=IT.length,LEARN=3;// 3 תשובות נכונות בניסיון ראשון = האות נלמדה
// זוגות שקל להתבלבל ביניהם: לא שמים אותם יחד כששתי אפשרויות בלבד
const CONF=['דר','בכ','הח','וז','וי','גנ','כפ','טמ','סם','עצ'];
const conf=(a,b)=>CONF.some(p=>p.includes(a)&&p.includes(b));
const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function fresh(){const w={};IT.forEach(x=>w[x.l]={s:0,c:0,err:0});return{v:1,pts:0,att:0,okc:0,cc:0,rounds:0,w,started:new Date().toISOString()}}
let S=LS.get('shilo_lt');if(!S||!S.w)S=fresh();IT.forEach(x=>{if(!S.w[x.l])S.w[x.l]={s:0,c:0,err:0}});
const save=()=>LS.set('shilo_lt',S);save();
let SQ=LS.get('shilo_sq')||[];let COL=LS.get('shilo_lt_col')||{};let MUTE=!!LS.get('shilo_lt_mute');

// ---------- קול ----------
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state!=='running')try{AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,vol,f2){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.16,a.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}

let SAYID=0,SRC=[],SAYT=null;
// קול: רק ההקלטות של הילה (audio/cNNN.mp3, window.SHILO_AUD: טקסט ← קובץ). בלי הקראה של המכשיר בכלל (אורן 10.11.2026).
// כל הקבצים נטענים מראש ל-WebAudio כשהדף נפתח, השקט בתחילה ובסוף נחתך, ומנגנים מיד בלי המתנה לרשת.
const AMAP=window.SHILO_AUD||{},BUF={},RAW={};let NLOAD=0,NTOT=0,READY=false;const RWAIT=[];

  try{const ok=b=>{BUF[f]=trim(b);done1()},no=()=>done1();const pr=AC.decodeAudioData(ab,ok,no);if(pr&&pr.catch)pr.catch(()=>{})}catch(e){done1()}}
function done1(){NLOAD++;goTxt();if(NLOAD>=NTOT&&!READY){READY=true;RWAIT.splice(0).forEach(f=>f())}}
function preload(){const fs=[...new Set(Object.values(AMAP))];NTOT=fs.length;if(!NTOT){READY=true;return}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  fs.forEach(f=>fetch('audio/'+f+'.mp3?v='+(window.SHILO_AUD_V||1)).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(ab=>{RAW[f]=ab;decode(f)}).catch(()=>done1()))}
function stopSay(){SAYID++;clearTimeout(SAYT);SRC.forEach(x=>{try{x.stop()}catch(e){}});SRC=[]}
// say(['טקסט', 600 (הפסקה במילישניות)], then): מתזמן את כל ההקלטות ברצף ב-WebAudio, ו-then נקרא כשהילה סיימה.
function say(parts,then){stopSay();const id=SAYID;
  const run=()=>{if(id!==SAYID)return;const a=ac();if(MUTE||!a){if(then)SAYT=setTimeout(then,250);return}
    let t=a.currentTime+.03;const t0=t;

const POPQ=[];let POPON=false;function popTxt(t){POPQ.push(t);if(!POPON)popNext()}
function popNext(){const t=POPQ.shift();if(t===undefined){POPON=false;return}POPON=true;const p=document.createElement('div');p.className='pop';p.textContent=t;document.body.appendChild(p);setTimeout(()=>{p.remove();popNext()},1050)}
function confetti(n){const c=['#facc15','#fb923c','#60a5fa','#34d399','#f472b6'];for(let i=0;i<(n||40);i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=pick(c);e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
// בלי שבחים בקול ובטקסט (אורן 10.11.2026: מוסיף כבדות). תשובה נכונה = צליל, ירוק, והמילה.

// ---------- מצב ----------
const learned=x=>S.w[x.l].c>=LEARN;
const nLearned=()=>IT.filter(learned).length;
const gOpen=g=>g===0||G[g-1].every(r=>learned(BY[r[0]]));// קבוצה נפתחת כשכל הקודמת נלמדה
const avail=()=>IT.filter(x=>gOpen(x.g));
const nOpt=()=>S.okc>=12?3:2;// מתחילים עם 2 אפשרויות, ואחרי 12 נכונות עוברים ל-3
let R=null;// הסיבוב: {q:[...], i, ok}
let CUR=null,TRY=0,LOCK=false;

function buildRound(){const av=avail(),seen=av.filter(x=>S.w[x.l].s),nw=av.filter(x=>!S.w[x.l].s);
  const learning=seen.filter(x=>!learned(x));const q=[];
  // אות חדשה כשיש פחות מ-3 בלמידה
  let intro=null;if(nw.length&&(learning.length<3||!seen.length))intro=nw[0];
  if(intro){q.push({t:'intro',it:intro})}
  const pool=seen.concat(intro?[intro]:[]);
  const weak=pool.filter(x=>!learned(x));
  while(q.length<6){let it;const r=Math.random();
    if(intro&&q.filter(z=>z.it===intro).length<3&&r<.5)it=intro;
    else if(weak.length&&r<.8)it=pick(weak);else it=pick(pool);
    const ts=['pic','let'];// בלי שאלת מחיאות כפיים (פישוט, אורן 10.11.2026)
    let t=pick(ts);const last=q[q.length-1];if(last&&last.it===it&&last.t===t)t=t==='pic'?'let':'pic';
    q.push({t,it})}
  return q}
function startRound(){R={q:buildRound(),i:0,ok:0};nextQ()}
function nextQ(){if(R.i>=R.q.length)return endRound();CUR=R.q[R.i];TRY=0;LOCK=false;render()}
function dots(){return '<div class="dots">'+R.q.map((_,i)=>`<i class="${i<R.i?'d':''}${i===R.i?' c':''}"></i>`).join('')+'</div>'}

function others(it,n,key){// מסיחים: אותיות אחרות (שנפתחו קודם, ואם אין מספיק גם מהקבוצה הבאה), בלי זוגות מבלבלים
  let c=IT.filter(x=>x!==it&&x[key]!==it[key]&&(gOpen(x.g)||x.g<=it.g+1)&&!(n<=1&&conf(x.l,it.l)));
  const s=c.filter(x=>S.w[x.l].s);const o=shuf(s).concat(shuf(c.filter(x=>!S.w[x.l].s)));return o.slice(0,n)}

// התשובות מוסתרות (visibility, תופסות מקום) עד שהילה מסיימת לשאול; בהשמעה חוזרת ובזמן משוב הן נעולות.
function hold(on){const o=$('op');if(o)o.classList.toggle('lk',on);LOCK=on}
function render(){const it=CUR.it,c=$('card');
  if(CUR.t==='intro'){
    c.innerHTML=dots()+`<div class="mid"><div class="big">${it.l}</div><div class="pic">${it.e}</div><button class="say" id="rp" type="button">🔊</button></div><div class="fb" id="fb"></div><div class="btns wait" id="bt"><button class="btn" id="nx" type="button">▶</button></div>`;
    const sp=()=>say(['זֹאת הָאוֹת',it.nm,500,it.snd,300,'כְּמוֹ',it.w],()=>$('bt').classList.remove('wait'));
    $('rp').onclick=()=>{ac();sp()};$('nx').onclick=()=>{S.w[it.l].s=1;save();R.i++;nextQ()};sp();return}
  const n=nOpt();let opts,ask;
  if(CUR.t==='pic'){// שומעים צליל, בוחרים תמונה שמתחילה בו
    opts=shuf([it].concat(others(it,n-1,'snd')));
    ask=()=>['אֵיזוֹ תְּמוּנָה מַתְחִילָה בַּצְּלִיל',300,it.snd];
    c.innerHTML=dots()+`<div class="mid"><div class="pic">👂</div><button class="say" id="rp" type="button">🔊</button></div><div class="fb" id="fb"></div><div class="opts${n>2?' o3':''} wait" id="op">${opts.map((x,i)=>`<button class="opt" data-i="${i}" type="button">${x.e}</button>`).join('')}</div><div class="btns" style="visibility:hidden"></div>`}
  else{// רואים תמונה ושומעים את שם האות, בוחרים את האות
    opts=shuf([it].concat(others(it,n-1,'l')));
    ask=()=>['אֵיפֹה הָאוֹת',it.nm];
    c.innerHTML=dots()+`<div class="mid"><div class="pic">${it.e}</div><button class="say" id="rp" type="button">🔊</button></div><div class="fb" id="fb"></div><div class="opts${n>2?' o3':''} wait" id="op">${opts.map((x,i)=>`<button class="opt lt" data-i="${i}" type="button">${x.l}</button>`).join('')}</div><div class="btns" style="visibility:hidden"></div>`}
  const q=()=>{hold(true);if(window.StudyGuess)StudyGuess.q({audio:true});say(ask(),()=>{$('op').classList.remove('wait');hold(false);if(window.StudyGuess)StudyGuess.heard()})};
  $('rp').onclick=()=>{ac();if(!$('op').classList.contains('done'))q()};q();
  $('op').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;if(LOCK){if(window.StudyGuess&&!$('op').classList.contains('done'))StudyGuess.tap();return}ac();const i=+b.dataset.i;
    // זיהוי ניחושים (אורן 13.11.2026): טעויות מהירות מדי או לחיצות באמצע ההקלטה = ההודעה של הילה, והשאלה מתחילה מחדש
    if(window.StudyGuess&&StudyGuess.chk(opts[i]===it,()=>render()))return;
    if(opts[i]===it)return good(b);
    TRY++;S.att++;S.w[it.l].err++;b.classList.add('no');SND.soft();
    const hint=()=>{if(TRY>=2)[...$('op').children][opts.indexOf(it)].classList.add('hint')};
    hold(true);if(window.StudyGuess)StudyGuess.q({audio:true});say([CUR.t==='pic'?opts[i].w:opts[i].nm,250,'נַסֵּה שׁוּב'],()=>{hold(false);hint();if(window.StudyGuess)StudyGuess.heard()});
    save();report()}}
function good(b){hold(true);$('op').classList.add('done');const it=CUR.it,first=TRY===0;b.classList.remove('hint');b.classList.add('ok');SND.ok();
  S.att++;S.okc++;S.pts++;R.ok++;if(TRY===0)S.w[it.l].c++;S.w[it.l].s=1;
  const was=S.w[it.l].c===LEARN&&TRY===0;
  const after=()=>{R.i++;if(was){popTxt(it.l+' ✓');confetti(30)}maybeSquishy(()=>setTimeout(nextQ,250),first)};
  say([350].concat(CUR.t==='pic'?[it.w]:[it.nm,200,it.w]),after);
  save();upd();report()}

// ---------- סוף סיבוב: צביעה ----------
function endRound(){S.rounds++;save();SND.win();confetti(50);
  const its=[...new Set(R.q.map(z=>z.it))];const fresh=its.filter(x=>!COL[x.pk]);const it=fresh.length?fresh[0]:pick(its);
  say([it.w]);paint(it,true)}
const PAL=['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7','#f472b6','#92400e','#9ca3af','#ffffff'];
let PC=PAL[2];
function paint(it,fromRound){const c=$('card');const fill=(COL[it.pk]||[]).slice();
  c.innerHTML=`<div class="row" style="justify-content:center;gap:10px;height:30px;flex:none"><b style="font:900 28px Arial">${it.l}</b><span style="font-size:26px">${it.e}</span><button class="ib" id="rp" type="button" style="height:30px">🔊</button></div><div class="cv" id="cv">${ShiloPics.get(it.pk)}</div><div class="pal" id="pal">${PAL.map(p=>`<button type="button" data-c="${p}" style="background:${p}" class="${p===PC?'sel':''}" aria-label="צבע"></button>`).join('')}</div><div class="btns"><button class="btn" id="dn2" type="button">סיימתי! ✓</button></div>`;
  const rs=[...$('cv').querySelectorAll('.r')];rs.forEach((r,i)=>{if(fill[i])r.style.fill=fill[i]});
  $('rp').onclick=()=>say([it.w,300,it.nm]);
  $('pal').onclick=e=>{const b=e.target.closest('button');if(!b)return;PC=b.dataset.c;[...$('pal').children].forEach(x=>x.classList.toggle('sel',x===b));SND.paint()};
  $('cv').onclick=e=>{const r=e.target.closest('.r');if(!r)return;ac();const i=rs.indexOf(r);r.style.fill=PC;fill[i]=PC;COL[it.pk]=fill;LS.set('shilo_lt_col',COL);SND.paint();upd()};
  $('dn2').onclick=()=>{COL[it.pk]=fill;LS.set('shilo_lt_col',COL);confetti(40);SND.win();upd();report();setTimeout(()=>{if(!fromRound&&R&&CUR&&R.i<R.q.length)render();else startRound()},fromRound?900:300)}}

// ---------- סקווישים ----------
const SQS=ShiloSquishies.list,SQS2=ShiloSquishies.list2,SQS3=ShiloSquishies.list3,aura=ShiloSquishies.aura,uaura=ShiloSquishies.uaura,ALLSQ=ShiloSquishies.all;
const baseDone=()=>SQS.every(x=>SQ.includes(x.id)),supDone=()=>baseDone()&&SQS2.every(x=>SQ.includes(x.id)),sqEvery=()=>supDone()?50:baseDone()?12:6,sqN=()=>ALLSQ.filter(x=>SQ.includes(x.id)).length,sqSvg=s=>`<svg viewBox="0 0 100 100">${s.svg}</svg>`;
let CURSQ=null,SQCB=null;
function maybeSquishy(cb,first){if(!first||(window.StudyGuess&&!StudyGuess.reward()))return cb();S.cc=(S.cc||0)+1;if(S.cc>=sqEvery()){S.cc=0;save();SQCB=cb;setTimeout(squishy,500)}else cb()}
function squishy(){const L=supDone()?SQS3:baseDone()?SQS2:SQS;let s=L.find(x=>!SQ.includes(x.id));const isNew=!!s;if(!s)s=pick(L);
  $('sqtt').textContent=s.ult?(isNew?'💎 אולטרה סקווישי חדש! 💎':'💎 אולטרה סקווישי!'):s.sup?(isNew?'⭐ סופר סקווישי חדש! ⭐':'⭐ סופר סקווישי!'):(isNew?'סקווישי חדש! 🎉':'סקווישי! 🎉');
  if(isNew){SQ.push(s.id);LS.set('shilo_sq',SQ)}
  CURSQ=s.id;$('sqimg').innerHTML=sqSvg(s);$('sqname').textContent=s.n+(isNew?'':' (שוב!)');$('sqdesc').textContent=s.d;$('sqok').textContent='לארגז! 🧰';const im=$('sqimg');im.style.animation='none';void im.offsetWidth;im.style.animation='';
  $('sqov').classList.add('on');confetti(70);SND.win();setTimeout(()=>sqSound(s.id),700);upd();report()}
$('sqimg').onclick=()=>{const im=$('sqimg');im.classList.remove('squish');void im.offsetWidth;im.classList.add('squish');sqSound(CURSQ)};
$('sqok').onclick=()=>{$('sqov').classList.remove('on');if(SQCB){const f=SQCB;SQCB=null;f()}};
function sqCol(){const ev=sqEvery(),left=ev-(S.cc||0);
  $('sqct').textContent=`אספת ${sqN()} מתוך ${ALLSQ.length} · עוד ${left} תשובות נכונות לסקווישי הבא`+(window.StudyGuess&&!StudyGuess.reward()?` · 🤔 הפרסים עצורים בגלל ניחושים: עוד ${StudyGuess.stat().need} תשובות נכונות במחשבה`:'');$('sqpb').style.width=((S.cc||0)/ev*100)+'%';
  const cl=s=>s.ult?' ult':s.sup?' sup':'';const tile=s=>SQ.includes(s.id)?`<div class="own${cl(s)}" data-id="${s.id}">${sqSvg(s)}</div>`:`<div class="lock${cl(s)}">${sqSvg({svg:s.svg.split(aura).join('').split(uaura).join('')})}</div>`;
  $('sqg').innerHTML=`<div class="sqhd">${ShiloSquishies.rows[0]}</div>`+SQS.map(tile).join('')+`<div class="sqhd">${ShiloSquishies.rows[1]}</div>`+SQS2.map(tile).join('')+`<div class="sqhd">${ShiloSquishies.rows[2]}</div>`+SQS3.map(tile).join('');$('sqcol').classList.add('on')}
$('sqb').onclick=sqCol;$('sqcx').onclick=()=>$('sqcol').classList.remove('on');
$('sqg').onclick=ev=>{const d=ev.target.closest('.own');if(!d)return;const s=ALLSQ.find(x=>x.id===d.dataset.id);if(!s)return;CURSQ=s.id;sqSound(s.id);$('sqtt').textContent=s.ult?'האולטרה סקווישי שלך 💎':s.sup?'הסופר סקווישי שלך ⭐':'הסקווישי שלך 🧰';$('sqimg').innerHTML=sqSvg(s);$('sqname').textContent=s.n;$('sqdesc').textContent=s.d;$('sqok').textContent='חזרה לארגז';const im=$('sqimg');im.style.animation='none';void im.offsetWidth;im.style.animation='';$('sqov').classList.add('on')};

// ---------- אלבום ----------
function album(){$('alb').innerHTML=IT.map(x=>{const open=S.w[x.l].s;const f=COL[x.pk]||[];let svg=ShiloPics.get(x.pk);
  let i=0;svg=svg.replace(/class="r"/g,()=>`class="r" style="fill:${f[i++]||'#fff'}"`);
  return `<div class="${open?'':'lock'}" data-k="${x.l}"><b>${x.l}</b>${svg}</div>`}).join('');$('albov').classList.add('on')}
$('albb').onclick=album;$('albx').onclick=()=>$('albov').classList.remove('on');
$('alb').onclick=e=>{const d=e.target.closest('div[data-k]');if(!d||d.classList.contains('lock'))return;$('albov').classList.remove('on');const it=BY[d.dataset.k];R=R||{q:[],i:0,ok:0};paint(it,false)};

// ---------- תצוגה ודיווח ----------
function upd(){$('dn').textContent=nLearned();$('pts').textContent='⭐ '+S.pts;$('sqn').textContent=sqN()+'/'+ALLSQ.length;$('aln').textContent=Object.keys(COL).filter(k=>(COL[k]||[]).some(Boolean)).length+'/'+N;
  $('abc').innerHTML=IT.map(x=>`<span class="${learned(x)?'ok':S.w[x.l].s?'on':''}">${x.l}</span>`).join('')}
function report(){if(!window.StudyTrack)return;const hard=IT.filter(x=>S.w[x.l].err).sort((a,b)=>S.w[b.l].err-S.w[a.l].err).slice(0,4).map(x=>x.l+' ('+x.w+')');
  let g=0;while(g<G.length-1&&gOpen(g+1))g++;
  StudyTrack.report({total:N,done:nLearned(),learning:IT.filter(x=>S.w[x.l].s&&!learned(x)).length,att:S.att,ok:S.okc,pts:S.pts,squishies:sqN(),hard,group:g+1,rounds:S.rounds,colored:Object.keys(COL).length,lv:1,lvn:'אותיות וצלילים',prog:nLearned(),pmax:N,started:S.started})}
$('mute').onclick=()=>{MUTE=!MUTE;LS.set('shilo_lt_mute',MUTE);$('mute').textContent=MUTE?'🔇':'🔊';if(MUTE){stopSay()}};$('mute').textContent=MUTE?'🔇':'🔊';
function goTxt(){const b=$('go');if(!b)return;const r=READY||NLOAD>=NTOT;b.textContent=r?'▶ מתחילים':'טוען… '+Math.round(NLOAD/Math.max(1,NTOT)*100)+'%';b.classList.toggle('soft',!r)}
$('go').onclick=()=>{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}ac();
  try{const a=AC,s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}catch(e){}
  $('intro').classList.remove('on');startRound()};
// אייפון משהה את הקול אחרי רקע: כל מגע מעיר אותו
document.addEventListener('touchstart',()=>{if(AC&&AC.state!=='running')AC.resume()},{passive:true});
preload();setTimeout(()=>{if(!READY){READY=true;goTxt();RWAIT.splice(0).forEach(f=>f())}},8000);
if(window.StudyGuess)StudyGuess.init('shilo','letters',{fast:1100,stop:stopSay});
if(window.StudyTrack){StudyTrack.init('shilo','letters',['shilo_lt','shilo_sq','shilo_lt_col']);StudyTrack.gift(()=>{SQCB=null;squishy();$('sqtt').textContent='🎁 מתנה מאבא ואמא!';confetti(60)})}
upd();goTxt();$('intro').classList.add('on');
</script>
</body></html>
