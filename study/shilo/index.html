.kemo{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;line-height:1}
.item.soon{opacity:.7;border-style:dashed}.item.soon .go{visibility:hidden}
.item.soon{opacity:.6;pointer-events:none;border-style:dashed}
.item{position:relative;overflow:hidden}.nwr{position:absolute;top:5px;left:-29px;width:94px;transform:rotate(-35deg);text-align:center;font:800 11px/18px system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(90deg,#ff5fa2,#ffb36b,#ff5fa2);background-size:200% 100%;animation:nwr 2.2s linear infinite;box-shadow:0 2px 6px rgba(255,95,162,.45);pointer-events:none}
@keyframes nwr{to{background-position:200% 0}}
.soonp{margin:14px 0 0;text-align:center;font-size:15px;color:var(--mut);line-height:1.5}

<script>try{var s=JSON.parse(localStorage.getItem('shilo_lt'));if(s&&s.w){var n=0,t=Object.keys(s.w).length;for(var k in s.w)if(s.w[k].c>=3)n++;if(s.att){document.getElementById('lt').textContent='אתה כבר יודע '+n+' מתוך '+t+' אותיות ⭐ '+(s.pts||0);document.getElementById('ltb').style.width=(n/t*100)+'%'}}}catch(e){}</script>
<script>
// המספרים של שילה (15.11.2026): אחרי אישור הורים
(function(){var a=document.getElementById('nmi'),ok=StudyContent.ok('shilo/numbers');a.classList.toggle('soon',!ok);
 if(!ok){document.getElementById('nm').textContent='בקרוב! 🚧 אבא ואמא מכינים לך משהו מיוחד';return}
 if(StudyContent.isNew('shilo/numbers')&&!a.querySelector('.nwr')){var r=document.createElement('span');r.className='nwr';r.textContent='חדש! ✨';a.appendChild(r)}
 try{var s=JSON.parse(localStorage.getItem('shilo_nm'));if(s&&s.w&&s.att){var n=0;for(var k in s.w)if(s.w[k].c>=3)n++;document.getElementById('nm').textContent='אתה כבר יודע '+n+' מתוך 10 מספרים ⭐ '+(s.pts||0);document.getElementById('nmb').style.width=(n*10)+'%'}}catch(e){}})();
StudyContent.refresh(function(){location.reload()});
</script>
