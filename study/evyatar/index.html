<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<script src="../guest.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Study Monster · אביתר</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-64.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Study Monster">
<meta name="theme-color" content="#eef1f5">
<link rel="stylesheet" href="../theme.css">
<script src="../content.js?v=5"></script>
<style>
/* תוכן בבדיקה = "בקרוב" (לא לחיץ). אחרי אישור ההורים: סרט "חדש!" */
.item.soon{opacity:.6;pointer-events:none;border-style:dashed}.item.soon .go{visibility:hidden}
.item{position:relative;overflow:hidden}.nwr{position:absolute;top:8px;left:-30px;width:110px;transform:rotate(-35deg);text-align:center;font:800 12px/20px system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(90deg,#2f5d9e,#5b8fd6,#2f5d9e);background-size:200% 100%;animation:nwr 2.2s linear infinite;box-shadow:0 2px 6px rgba(47,93,158,.45);pointer-events:none}
@keyframes nwr{to{background-position:200% 0}}
/* שלושה תכנים: מצמצמים קצת במסכים נמוכים כדי שהכול ייכנס במסך אחד */
@media (max-height:760px){.top{margin-bottom:10px}.list{gap:9px}.item{padding:11px 14px}.item .ic{width:46px;height:46px;font-size:25px}}
@media (max-height:680px){.top{margin-bottom:6px}.top img{max-height:90px}.list{gap:7px}.item{padding:8px 12px}.item b{font-size:18px}.item small{font-size:13px}}
</style>
</head><body><main>
<a class="back" href="../">→ כל הילדים</a>
<div class="top"><img src="../kids/evyatar.webp" alt=""><div><h1>היי אביתר!</h1><p>מה לומדים היום?</p></div></div>
<div class="list">
<a class="item" data-c="evyatar/vocab" href="vocab/"><span class="ic">📚</span><span class="tx"><b>אוצר מילים באנגלית</b><small>בלוקים ורמות, לוח דירוג</small></span><span class="go">‹</span></a>
<a class="item" id="psi" data-c="evyatar/past" data-gen="1" href="past/"><span class="ic">⏳</span><span class="tx"><b>זמני עבר: חזרה</b><small id="ps">50 שאלות, מהקל לקשה</small><div class="bar" id="psbr" style="display:none"><i id="psb" style="width:0"></i></div></span><span class="go">‹</span></a>
<a class="item" id="eci" data-c="evyatar/econ" data-t="בוחן" data-gen="1" href="econ/"><span class="ic">📈</span><span class="tx"><b>כלכלה: הכנה לבוחן</b><small id="ec">מחסור, גורמי ייצור, הגישות</small><div class="bar" id="ecbr" style="display:none"><i id="ecb" style="width:0"></i></div></span><span class="go">‹</span></a>
</div>
<script>
// לפני אישור ההורים: "בקרוב". אחרי אישור: לחיץ, עם סרט "חדש!" עד הכניסה הראשונה (אורן 6.11.2026)
function psGate(){var a=document.getElementById('psi'),ok=StudyContent.ok('evyatar/past');a.classList.toggle('soon',!ok);
 if(!ok){document.getElementById('ps').textContent='בקרוב! 🚧';return}
 if(StudyContent.isNew('evyatar/past')&&!a.querySelector('.nwr')){var r=document.createElement('span');r.className='nwr';r.textContent='חדש! ✨';a.appendChild(r)}
 try{var s=JSON.parse(localStorage.getItem('ev_past'));if(s&&s.d&&s.att){var n=Object.keys(s.d).length;document.getElementById('ps').textContent=n+' מתוך 50 שאלות';document.getElementById('psbr').style.display='';document.getElementById('psb').style.width=(n/50*100)+'%'}}catch(e){}}
function ecGate(){var a=document.getElementById('eci'),ok=StudyContent.ok('evyatar/econ');a.classList.toggle('soon',!ok);
 if(!ok){document.getElementById('ec').textContent='בקרוב! 🚧';return}
 if(StudyContent.isNew('evyatar/econ')&&!a.querySelector('.nwr')){var r=document.createElement('span');r.className='nwr';r.textContent='חדש! ✨';a.appendChild(r)}
 try{var s=JSON.parse(localStorage.getItem('ev_econ'));if(s&&s.d&&s.v>=2&&(s.att||Object.keys(s.oa||{}).length)){var n=Object.keys(s.d).length;document.getElementById('ec').textContent=n+' מתוך 64 שאלות'+(s.mk?' · מבחן: '+s.mk.best:'');document.getElementById('ecbr').style.display='';document.getElementById('ecb').style.width=(n/64*100)+'%'}}catch(e){}}
psGate();ecGate();StudyContent.refresh(function(){location.reload()});
</script>
<script src="../kidlist.js?v=1"></script><script>StudyList.init('evyatar')</script>

<div class="tools"><a class="tl" href="notes/"><span class="ic">📎</span><b>החומרים שלי</b></a><div id="rqm"></div><div id="pbm"></div></div>
<script src="../req.js?v=4"></script><script>StudyReq.mount('evyatar',true)</script>
<script src="../push.js?v=4"></script><script>StudyPush.kid(document.getElementById('pbm'),'evyatar',true)</script>
</main></body></html>
