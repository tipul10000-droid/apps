# פינג יומי לבסיס הנתונים (Supabase, פרויקט family-apps) כדי שלא יירדם אחרי שבוע בלי שימוש.
# הקריאה היא לפונקציית הקריאה של לוח הדירוג (שאילתה אמיתית בבסיס הנתונים).
# המפתח למטה הוא המפתח הציבורי (anon), אותו מפתח שנמצא ב-index.html, ולכן אין כאן סוד.
# אם הפינג נכשל, GitHub שולח מייל על ריצה שנכשלה (למשל אם הפרויקט כבר נרדם).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST "https://emgtyfksnofzzlutngbf.supabase.co/rest/v1/rpc/vocab_lb_get" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtZ3R5Zmtzbm9menpsdXRuZ2JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDI0MTMsImV4cCI6MjEwNjgxODQxM30.b7XE-gbCUlXMqpza1Bn9GvMKQsmu3jKP2eqZ0r4-k2k" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtZ3R5Zmtzbm9menpsdXRuZ2JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDI0MTMsImV4cCI6MjEwNjgxODQxM30.b7XE-gbCUlXMqpza1Bn9GvMKQsmu3jKP2eqZ0r4-k2k" \
            -H "Content-Type: application/json" \
            -d '{}' -o /dev/null -w "Supabase answered HTTP %{http_code}\n"
